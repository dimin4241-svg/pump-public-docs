name: mayhem-fresh-buy-differential
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/mayhem-fresh-buy-differential.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @pump-fun/pump-sdk@1.36.0 @solana/web3.js @solana/spl-token bn.js
      - name: Simulation-only fresh Mayhem buy differential
        shell: bash
        run: |
          cat > probe.mjs <<'NODE'
          import BN from 'bn.js';
          import {PublicKey,Keypair,Transaction,SystemProgram} from '@solana/web3.js';
          import {getAssociatedTokenAddressSync,TOKEN_PROGRAM_ID,TOKEN_2022_PROGRAM_ID,NATIVE_MINT} from '@solana/spl-token';
          import {PUMP_SDK,GLOBAL_PDA} from '@pump-fun/pump-sdk';

          const RICH=new PublicKey('39azUYFWPz3VHgKCf3VChUwbpURdCHRxjWVowf5jUJjg');
          const USDC=new PublicKey('EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v');
          const RPCS=['https://rpc.solanatracker.io/public','https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com'];
          let id=1; const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function raw(u,m,p,n=4){let e;for(let i=0;i<n;i++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-simulation-only/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});if(r.status===429||r.status>=500){e=Error('HTTP '+r.status);await sleep(250+400*i);continue}const j=await r.json();if(j.error)throw Error(JSON.stringify(j.error));return j.result}catch(x){e=x;await sleep(160)}}throw e}
          async function call(m,p){let e;for(const u of RPCS){try{return await raw(u,m,p)}catch(x){e=x;console.log('RPC_FAIL',m,u,String(x).slice(0,180))}}throw e}
          const b64=a=>a?Buffer.from(a.data[0],'base64'):null;
          const tok=a=>{const b=b64(a);return b&&b.length>=72?b.readBigUInt64LE(64):null};
          const curve=a=>{const b=b64(a);if(!b||b.length<115)return null;return {len:b.length,virtualToken:b.readBigUInt64LE(8),virtualQuote:b.readBigUInt64LE(16),realToken:b.readBigUInt64LE(24),realQuote:b.readBigUInt64LE(32),supply:b.readBigUInt64LE(40),complete:b[48],creator:new PublicKey(b.subarray(49,81)).toBase58(),isMayhem:b[81],isCashback:b[82],quote:new PublicKey(b.subarray(83,115)).toBase58(),raw:b.toString('hex')}};
          const state=a=>{const b=b64(a);return b?{owner:a.owner,len:b.length,raw:b.toString('hex')}:null};
          const j=x=>JSON.stringify(x,(_,v)=>typeof v==='bigint'?v.toString():v,2);

          const gi=(await call('getAccountInfo',[GLOBAL_PDA.toBase58(),{encoding:'base64',commitment:'confirmed'}])).value;
          if(!gi)throw Error('global missing');
          const global=PUMP_SDK.decodeGlobal(Buffer.from(gi.data[0],'base64'));
          console.log('GLOBAL_KEYS',Object.keys(global));
          function collect(v,path='',out=[]){if(v instanceof PublicKey){if(/recipient/i.test(path))out.push({path,pk:v});return out}if(Array.isArray(v)){for(let i=0;i<v.length;i++)collect(v[i],path+'['+i+']',out);return out}if(v&&typeof v==='object'&&!BN.isBN(v)){for(const [k,x] of Object.entries(v))collect(x,path?path+'.'+k:k,out)}return out}
          const seen=new Set(), candidatePks=[{path:'rich',pk:RICH},...collect(global)];
          const candidates=[];
          for(const c of candidatePks){const s=c.pk.toBase58();if(seen.has(s))continue;seen.add(s);try{const ata=getAssociatedTokenAddressSync(USDC,c.pk,true,TOKEN_PROGRAM_ID);const [oa,ta]=await Promise.all([call('getAccountInfo',[s,{encoding:'base64',commitment:'confirmed'}]),call('getAccountInfo',[ata.toBase58(),{encoding:'base64',commitment:'confirmed'}])]);const amount=tok(ta.value)??0n;const row={path:c.path,pk:s,owner:oa.value?.owner??null,lamports:oa.value?.lamports??0,usdcAta:ata.toBase58(),usdc:amount.toString(),ataExists:!!ta.value};candidates.push(row);console.log('CANDIDATE',JSON.stringify(row))}catch(e){console.log('CANDIDATE_FAIL',c.path,s,String(e).slice(0,160))}}
          const buyerRow=candidates.filter(x=>x.owner===SystemProgram.programId.toBase58()&&BigInt(x.usdc)>=2_000_000n&&BigInt(x.lamports)>=20_000_000n).sort((a,b)=>BigInt(a.usdc)>BigInt(b.usdc)?-1:1)[0];
          if(!buyerRow){console.log('ALL_CANDIDATES',j(candidates));throw Error('no system-owned simulation buyer with >=2 USDC and >=0.02 SOL')}
          const BUYER=new PublicKey(buyerRow.pk), BUYER_USDC=new PublicKey(buyerRow.usdcAta);
          console.log('BUYER_SELECTED',j(buyerRow));

          const AMOUNT=new BN('100000000000'); // 100,000 base tokens (6 decimals)
          const domains=[
            {name:'SOL',quoteMint:NATIVE_MINT,quoteTokenProgram:TOKEN_PROGRAM_ID,cap:new BN('1000000000')},
            {name:'USDC',quoteMint:USDC,quoteTokenProgram:TOKEN_PROGRAM_ID,cap:new BN('100000000')}
          ];

          async function simulate(ixs,watch){const bh=(await call('getLatestBlockhash',[{commitment:'confirmed'}])).value.blockhash;const tx=new Transaction({feePayer:BUYER,recentBlockhash:bh});for(const ix of ixs)tx.add(ix);let bytes;try{bytes=tx.serialize({requireAllSignatures:false,verifySignatures:false})}catch(e){console.log('SERIALIZE_FAIL',String(e));throw e}let v=null,used=null;for(const u of RPCS){try{v=(await raw(u,'simulateTransaction',[bytes.toString('base64'),{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'confirmed',accounts:{encoding:'base64',addresses:watch.map(x=>x.toBase58())}}],3)).value;used=u;break}catch(e){console.log('SIM_RPC_FAIL',u,String(e).slice(0,180))}}if(!v)throw Error('no simulation');return {v,used,bytes:bytes.length}}

          const results=[];
          for(const d of domains){
            const mint=Keypair.generate();
            const create=await PUMP_SDK.createV2Instruction({mint:mint.publicKey,name:'D',symbol:'D',uri:'x',creator:BUYER,user:BUYER,mayhemMode:true,cashback:false,quoteMint:d.quoteMint});
            const curvePk=create.keys[2].pubkey, curveBase=create.keys[3].pubkey, mayhemState=create.keys[12].pubkey, mayhemVault=create.keys[13].pubkey;
            const userBase=getAssociatedTokenAddressSync(mint.publicKey,BUYER,true,TOKEN_2022_PROGRAM_ID);
            const quoteWatch=d.name==='USDC'?BUYER_USDC:BUYER;
            const watch=[curvePk,curveBase,mayhemState,mayhemVault,userBase,quoteWatch];
            const pre=await simulate([create],watch);
            const preSnap=pre.v.accounts??[];
            console.log('CREATE_ONLY_'+d.name,j({bytes:pre.bytes,rpc:pre.used,err:pre.v.err,units:pre.v.unitsConsumed,curve:curve(preSnap[0]),curveBaseAmount:tok(preSnap[1]),mayhemState:state(preSnap[2]),mayhemVaultAmount:tok(preSnap[3]),userBaseAmount:tok(preSnap[4]),quoteAccount:d.name==='USDC'?{amount:tok(preSnap[5])}: {lamports:preSnap[5]?.lamports??null},anchor:(pre.v.logs??[]).filter(x=>/AnchorError|Error Code/.test(x)),failed:(pre.v.logs??[]).filter(x=>x.includes('failed:'))}));
            if(pre.v.err)throw Error('create-only failed '+d.name);

            const both=await PUMP_SDK.createV2AndBuyV2Instructions({global,mint:mint.publicKey,name:'D',symbol:'D',uri:'x',creator:BUYER,user:BUYER,amount:AMOUNT,quoteAmount:d.cap,mayhemMode:true,cashback:false,quoteMint:d.quoteMint,quoteTokenProgram:d.quoteTokenProgram});
            console.log('BUILT_'+d.name,j({count:both.length,ixs:both.map((ix,i)=>({i,program:ix.programId.toBase58(),keys:ix.keys.length,data:ix.data.toString('hex').slice(0,32)}))}));
            const post=await simulate(both,watch);
            const ps=post.v.accounts??[];
            const before=curve(preSnap[0]),after=curve(ps[0]);
            const delta=before&&after?{virtualToken:before.virtualToken-after.virtualToken,virtualQuote:after.virtualQuote-before.virtualQuote,realToken:before.realToken-after.realToken,realQuote:after.realQuote-before.realQuote,quoteFractionPpb:(after.virtualQuote-before.virtualQuote)*1_000_000_000n/before.virtualQuote,tokenFractionPpb:(before.virtualToken-after.virtualToken)*1_000_000_000n/before.virtualToken}:null;
            const quoteDelta=d.name==='USDC'&&tok(preSnap[5])!==null&&tok(ps[5])!==null?(tok(preSnap[5])-tok(ps[5])):null;
            const row={domain:d.name,bytes:post.bytes,rpc:post.used,err:post.v.err,units:post.v.unitsConsumed,before,after,delta,curveBaseBefore:tok(preSnap[1]),curveBaseAfter:tok(ps[1]),mayhemVaultBefore:tok(preSnap[3]),mayhemVaultAfter:tok(ps[3]),userBaseBefore:tok(preSnap[4]),userBaseAfter:tok(ps[4]),buyerUsdcDelta:quoteDelta,buyerLamportsBefore:d.name==='SOL'?preSnap[5]?.lamports??null:null,buyerLamportsAfter:d.name==='SOL'?ps[5]?.lamports??null:null,anchor:(post.v.logs??[]).filter(x=>/AnchorError|Error Code/.test(x)),failed:(post.v.logs??[]).filter(x=>x.includes('failed:')),interesting:(post.v.logs??[]).filter(x=>/Instruction: BuyV2|Mayhem|Fee|fee|Quote|quote/.test(x))};
            console.log('BUY_RESULT_'+d.name,j(row));results.push(row);
          }
          if(results.length===2&&results.every(x=>!x.err&&x.delta)){
            const s=results[0].delta,u=results[1].delta;
            console.log('NORMALIZED_COMPARISON',j({solQuoteFractionPpb:s.quoteFractionPpb,usdcQuoteFractionPpb:u.quoteFractionPpb,differencePpb:s.quoteFractionPpb>u.quoteFractionPpb?s.quoteFractionPpb-u.quoteFractionPpb:u.quoteFractionPpb-s.quoteFractionPpb,solTokenFractionPpb:s.tokenFractionPpb,usdcTokenFractionPpb:u.tokenFractionPpb,solCurveQuoteDelta:s.virtualQuote,usdcCurveQuoteDelta:u.virtualQuote,usdcBuyerDebit:results[1].buyerUsdcDelta}));
          }
          NODE
          node probe.mjs
