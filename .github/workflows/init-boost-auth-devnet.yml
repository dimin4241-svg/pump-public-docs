name: PumpSwap init_boost auth Devnet proof

on:
  push:
    branches:
      - research/boost-auth-devnet
    paths:
      - "research/init-boost-auth/**"
      - "idl/pump_amm.json"
      - ".github/workflows/init-boost-auth-devnet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devnet-init-boost-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install isolated harness dependencies
        working-directory: research/init-boost-auth
        run: npm install --no-audit --no-fund

      - name: Simulate foreign-signer init_boost on Devnet only
        working-directory: research/init-boost-auth
        env:
          DEVNET_RPC: https://api.devnet.solana.com
        run: node devnet-init-boost-sim.mjs
