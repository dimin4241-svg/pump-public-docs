name: donation-cross-token-shared-relay

on:
  push:
    paths:
      - '.github/workflows/donation-cross-token-shared-relay.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save @pump-fun/pump-sdk@1.36.0 @solana/web3.js @solana/spl-token bs58
      - name: Simulation-only cross-token shared relay differential
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import bs58pkg from 'bs58'; const bs58=bs58pkg.default??bs58pkg;
          import {PublicKey,TransactionMessage,VersionedTransaction} from '@solana/web3.js';
          import * as p from '@pump-fun/pump-sdk';
          import {NATIVE_MINT} from '@solana/spl-token';

          const RPC='https://api.mainnet-beta.solana.com';
          const FEE='pfeeUxB6jkeY1Hxd7CsFCAjcbHA9rWtchMGdZ6VojVZ';
          const DISC=bs58.encode(Buffer.from('f6c56009c11e5d73','hex'));
          const PAYER=new PublicKey('Gygj9QQby4j2jryqyqBHvLP7ctv2SaANgh4sCb69BUpA');
          const RELAY=p.DONATION_RELAY_PROGRAM_ID_MAINNET;
          let id=1;
          async function rpc(method,params){
            const r=await fetch(RPC,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-simulation-only-cross-token-donation/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method,params})});
            if(!r.ok) throw Error('HTTP '+r.status);
            const j=await r.json(); if(j.error) throw Error(JSON.stringify(j.error)); return j.result;
          }
          function parseDonation(row){
            const b=Buffer.from(row.account.data[0],'base64');
            let o=10;
            const config=bs58.encode(b.subarray(o,o+=32));
            const base=bs58.encode(b.subarray(o,o+=32));
            const quote=bs58.encode(b.subarray(o,o+=32));
            const creator=bs58.encode(b.subarray(o,o+=32));
            const totalDonated=b.readBigUInt64LE(o); o+=8;
            const lastCrankTs=b.readBigInt64LE(o);
            return {pda:row.pubkey,lamports:row.account.lamports,config,base,quote,creator,totalDonated:totalDonated.toString(),lastCrankTs:lastCrankTs.toString()};
          }
          function compactAccount(a){
            if(!a) return null;
            const data=Buffer.from(a.data[0],'base64');
            return {lamports:a.lamports,owner:a.owner,executable:a.executable,dataLen:data.length,dataHex:data.toString('hex')};
          }
          function parseLogs(logs){
            const xs=logs??[]; const t=xs.join('\n');
            return {
              code:t.match(/Error Code: ([A-Za-z0-9_]+)/)?.[1]??null,
              num:Number(t.match(/Error Number: (\d+)/)?.[1]??0)||null,
              account:t.match(/AnchorError caused by account: ([A-Za-z0-9_\-]+)/)?.[1]??null,
              interesting:xs.filter(x=>/Instruction:|AnchorError|Error Code|Error Number|donat|relay|deboun|epoch|whitelist|Transfer|failed|success/i.test(x)).slice(-220)
            };
          }

          const rows=(await rpc('getProgramAccounts',[FEE,{encoding:'base64',commitment:'confirmed',filters:[{memcmp:{offset:0,bytes:DISC}}],dataSlice:{offset:0,length:218}}])).map(parseDonation);
          const ws=rows.filter(x=>x.quote===NATIVE_MINT.toBase58());
          const groups=new Map();
          for(const x of ws){const k=x.config+'|'+x.quote; if(!groups.has(k))groups.set(k,[]); groups.get(k).push(x)}
          const ranked=[...groups.entries()].map(([k,v])=>({k,v,bases:new Set(v.map(x=>x.base)).size,total:v.reduce((a,x)=>a+BigInt(x.lamports),0n),max:v.reduce((a,x)=>a>BigInt(x.lamports)?a:BigInt(x.lamports),0n)})).filter(g=>g.bases>=2).sort((a,b)=>a.total===b.total?0:(a.total>b.total?-1:1));
          console.log('MULTI_BASE_GROUP_COUNT',ranked.length);
          console.log('TOP_MULTI_BASE_GROUPS',JSON.stringify(ranked.slice(0,20).map(g=>({config:g.v[0].config,quote:g.v[0].quote,count:g.v.length,bases:g.bases,totalLamports:g.total.toString(),members:g.v.sort((a,b)=>b.lamports-a.lamports).slice(0,8)})),null,2));
          if(!ranked.length) throw Error('No multi-base config+quote groups');
          const chosen=ranked.find(g=>g.v.some(x=>BigInt(x.lamports)>3000000n) && new Set(g.v.map(x=>x.base)).size>=2) ?? ranked[0];
          const members=[...chosen.v].sort((a,b)=>b.lamports-a.lamports);
          let A=members[0],B=members.find(x=>x.base!==A.base);
          if(!B) throw Error('No second distinct base in chosen group');
          const CONFIG=new PublicKey(A.config),QUOTE=new PublicKey(A.quote);
          const EPOCH=p.donationRelayEpochTrackerPda(CONFIG,QUOTE,RELAY);
          const DEB=p.donationRelayDebouncerPda(CONFIG,QUOTE,RELAY);
          const WATCH=[new PublicKey(A.pda),new PublicKey(B.pda),EPOCH,DEB];
          console.log('CHOSEN',JSON.stringify({A,B,relay:RELAY.toBase58(),epoch:EPOCH.toBase58(),debouncer:DEB.toBase58(),sameConfig:A.config===B.config,sameQuote:A.quote===B.quote,differentBase:A.base!==B.base},null,2));

          const ixA=await p.PUMP_SDK.crankDonationFeePda({payer:PAYER,mint:new PublicKey(A.base),configId:CONFIG,donationRelayProgramId:RELAY,quoteMint:QUOTE});
          const ixB=await p.PUMP_SDK.crankDonationFeePda({payer:PAYER,mint:new PublicKey(B.base),configId:CONFIG,donationRelayProgramId:RELAY,quoteMint:QUOTE});
          const keySummary=ix=>ix.keys.map((k,i)=>({i,pk:k.pubkey.toBase58(),s:k.isSigner,w:k.isWritable}));
          console.log('IX_A_KEYS',JSON.stringify(keySummary(ixA),null,2));
          console.log('IX_B_KEYS',JSON.stringify(keySummary(ixB),null,2));
          const sharedA=new Set(ixA.keys.map(k=>k.pubkey.toBase58()));
          console.log('SHARED_KEYS',JSON.stringify(ixB.keys.map(k=>k.pubkey.toBase58()).filter(x=>sharedA.has(x)),null,2));

          async function sim(label,ixs){
            const bh=(await rpc('getLatestBlockhash',[{commitment:'processed'}])).value.blockhash;
            const tx=new VersionedTransaction(new TransactionMessage({payerKey:PAYER,recentBlockhash:bh,instructions:ixs}).compileToV0Message());
            const raw=Buffer.from(tx.serialize()).toString('base64');
            const v=(await rpc('simulateTransaction',[raw,{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'processed',accounts:{encoding:'base64',addresses:WATCH.map(x=>x.toBase58())}}])).value;
            const e=parseLogs(v.logs);
            console.log('\nSIM',label,JSON.stringify({err:v.err,units:v.unitsConsumed,code:e.code,num:e.num,account:e.account,watched:WATCH.map((pk,i)=>({pk:pk.toBase58(),post:compactAccount(v.accounts?.[i])})),interesting:e.interesting},null,2));
            return {v,e};
          }

          await sim('A_ONLY',[ixA]);
          await sim('B_ONLY',[ixB]);
          await sim('A_THEN_B',[ixA,ixB]);
          await sim('B_THEN_A',[ixB,ixA]);
          await sim('A_THEN_A',[ixA,ixA]);
          await sim('B_THEN_B',[ixB,ixB]);
          NODE
