name: PumpSwap Direct Pool Init BOOST Probe

on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths:
      - audit/direct_pool_init_boost_probe.mjs
      - .github/workflows/direct-pool-init-boost-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save @solana/web3.js@1.98.4 @solana/spl-token@0.4.14 bs58@6.0.0
      - name: Discover direct-created pools and simulate creator init_boost only
        run: node audit/direct_pool_init_boost_probe.mjs
