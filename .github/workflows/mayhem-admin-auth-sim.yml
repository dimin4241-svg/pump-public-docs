name: mayhem-admin-auth-sim
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/mayhem-admin-auth-sim.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @solana/web3.js
      - name: Simulation-only admin auth matrix
        shell: bash
        run: |
          cat > x.mjs <<'NODE'
          import {PublicKey,Transaction,TransactionInstruction,SystemProgram} from '@solana/web3.js';
          const MAY=new PublicKey('MAyhSmzXzV1pTf7LsNkrNwkWKTo4ougAJ1PPg47MD4e'),GP=new PublicKey('13ec7XdrjF3h3YcqBTFDSReRcUFwbCnJaAQspM4j6DDJ'),ADMIN=new PublicKey('FFWtrEQ4B4PKQoVuHYzZq8FabGkVatYzDpEVHsK5rrhF'),TRADER=new PublicKey('Gygj9QQby4j2jryqyqBHvLP7ctv2SaANgh4sCb69BUpA'),ALT=new PublicKey('39azUYFWPz3VHgKCf3VChUwbpURdCHRxjWVowf5jUJjg'),EA=new PublicKey('8FoNgzmjuSmiy86EPCWxvv1q7oJSu2WGA7wPymwki2LJ');
          const D={UpdateTrader:'c9cf63406556af60',UpdateAdmin:'a1b028d53cb8b3e4',ResetState:'9176742a28db948b',ResetSolDeployed:'b0ad9da2f0bcc439',ResetStableDeployed:'bf2530b70f5489cb',ResumeTrading:'922ed456459f1e41',StopTrading:'7fb06a3bf27a726f'};
          const RPCS=['https://rpc.solanatracker.io/public','https://api.mainnet-beta.solana.com'];let id=1;const sl=m=>new Promise(r=>setTimeout(r,m));async function q(u,m,p,n=4){let e;for(let i=0;i<n;i++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-simulation-only/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});if(r.status===429||r.status>=500){e=Error('HTTP '+r.status);await sl(250+400*i);continue}const j=await r.json();if(j.error)throw Error(JSON.stringify(j.error));return j.result}catch(x){e=x;await sl(150)}}throw e}async function call(m,p){let e;for(const u of RPCS){try{return await q(u,m,p)}catch(x){e=x;console.log('RPCFAIL',m,u,String(x).slice(0,140))}}throw e}
          const info=(await call('getAccountInfo',[ALT.toBase58(),{encoding:'base64',commitment:'confirmed'}])).value;if(!info||info.owner!==SystemProgram.programId.toBase58())throw Error('fee payer unavailable');
          const baseKeys=(who)=>[{pubkey:who,isSigner:true,isWritable:true},{pubkey:GP,isSigner:false,isWritable:true},{pubkey:EA,isSigner:false,isWritable:false},{pubkey:MAY,isSigner:false,isWritable:false}];
          function data(name){const d=Buffer.from(D[name],'hex');if(name==='UpdateTrader'||name==='UpdateAdmin')return Buffer.concat([d,ALT.toBuffer()]);return d}
          async function sim(name,who,layout='basic'){let keys=baseKeys(who);if(layout==='sys')keys=[{pubkey:who,isSigner:true,isWritable:true},{pubkey:GP,isSigner:false,isWritable:true},{pubkey:SystemProgram.programId,isSigner:false,isWritable:false},{pubkey:EA,isSigner:false,isWritable:false},{pubkey:MAY,isSigner:false,isWritable:false}];const ix=new TransactionInstruction({programId:MAY,keys,data:data(name)});const bh=(await call('getLatestBlockhash',[{commitment:'confirmed'}])).value.blockhash;const tx=new Transaction({feePayer:ALT,recentBlockhash:bh}).add(ix);const raw=tx.serialize({requireAllSignatures:false,verifySignatures:false});let v,used;for(const u of RPCS){try{v=(await q(u,'simulateTransaction',[raw.toString('base64'),{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'confirmed',accounts:{encoding:'base64',addresses:[GP.toBase58()]}}],3)).value;used=u;break}catch(e){}}if(!v)return {noSim:true};const logs=v.logs??[],a=v.accounts?.[0],b=a?Buffer.from(a.data[0],'base64'):null;const r={name,who:who.toBase58(),layout,rpc:used,err:v.err,units:v.unitsConsumed,gpHead:b?.subarray(0,120).toString('hex')??null,anchor:logs.filter(x=>/AnchorError|Error Code|Error Number/.test(x)),failed:logs.filter(x=>x.includes('failed:')),instructions:logs.filter(x=>x.includes('Instruction:'))};console.log('RESULT',JSON.stringify(r,null,2));return r}
          for(const name of Object.keys(D)){let c=await sim(name,ADMIN,'basic');if(c.err&&c.anchor?.some(x=>/NotEnough|AccountNotEnoughKeys/.test(x)))c=await sim(name,ADMIN,'sys');let a=await sim(name,ALT,c.layout??'basic');console.log('PAIR',name,JSON.stringify({control:c,attacker:a},null,2))}
          NODE
          node x.mjs
