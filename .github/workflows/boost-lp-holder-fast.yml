name: boost-lp-holder-fast
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/boost-lp-holder-fast.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @solana/web3.js bs58
      - shell: bash
        run: |
          node --input-type=module <<'NODE'
          import bs58pkg from 'bs58';import{PublicKey,SystemProgram}from'@solana/web3.js';const bs58=bs58pkg.default??bs58pkg;
          const pool='FpvoV2tqRxDW156CvATS6xFNuGewiHRX5JZneau1uFgF',RPCS=['https://rpc.solanatracker.io/public','https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com','https://solana.public-rpc.com'];let id=1;
          async function req(u,m,p){const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});const x=await r.json();if(x.error)throw Error(JSON.stringify(x.error));return x.result}
          async function call(m,p){let e;for(const u of RPCS){try{const x=await req(u,m,p);console.log('RPC',m,u);return x}catch(x){e=x;console.log('FAIL',m,u,String(x).slice(0,150))}}throw e}
          const pr=(await call('getAccountInfo',[pool,{encoding:'base64',commitment:'confirmed'}])).value,b=Buffer.from(pr.data[0],'base64');const lp=bs58.encode(b.subarray(107,139));console.log('LP_MINT',lp,'POOL_LEN',b.length);
          const la=(await call('getTokenLargestAccounts',[lp,{commitment:'confirmed'}])).value;console.log('LARGEST_COUNT',la.length);
          for(const x of la.slice(0,20)){const tr=(await call('getAccountInfo',[x.address,{encoding:'base64',commitment:'confirmed'}])).value;if(!tr)continue;const d=Buffer.from(tr.data[0],'base64'),owner=bs58.encode(d.subarray(32,64)),amount=d.readBigUInt64LE(64);let oi=null;try{oi=(await call('getAccountInfo',[owner,{encoding:'base64',commitment:'confirmed'}])).value}catch{}const onCurve=PublicKey.isOnCurve(new PublicKey(owner).toBytes());console.log('HOLDER',JSON.stringify({tokenAccount:x.address,owner,amount:amount.toString(),ui:x.uiAmountString,onCurve,ownerProgram:oi?.owner,lamports:oi?.lamports??0,system:oi?.owner===SystemProgram.programId.toBase58()}));}
          NODE