name: token2022-dangerous-live-from-prior
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/token2022-dangerous-live-from-prior.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @solana/web3.js @solana/spl-token
      - name: Download prior exhaustive base scan log
        shell: bash
        run: |
          gh api -H 'Accept: application/vnd.github+json' repos/dimin4241-svg/pump-public-docs/actions/jobs/95029071790/logs > prior.log
          wc -c prior.log
      - name: Parse dangerous rows and refresh live config
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {PublicKey} from '@solana/web3.js';
          import {
            TOKEN_2022_PROGRAM_ID,unpackMint,getExtensionTypes,ExtensionType,
            getPermanentDelegate,getTransferHook,getPausableConfig,getMintCloseAuthority,
            getDefaultAccountState,getNonTransferable,getInterestBearingMintConfigState,getScaledUiAmountConfig,
          } from '@solana/spl-token';
          let s=fs.readFileSync('prior.log','utf8').replace(/^\ufeff/,'');
          s=s.split('\n').map(l=>l.replace(/^\d{4}-\d\d-\d\dT[^ ]+Z\s+/, '')).join('\n');
          const a=s.indexOf('TOKEN2022_DETAILS [');
          const b=s.indexOf('\nTRANSFER_FEE_PUMPSWAP_COUNT',a);
          if(a<0||b<0)throw new Error('Could not locate TOKEN2022_DETAILS JSON in prior log');
          const raw=s.slice(a+'TOKEN2022_DETAILS '.length,b).trim();
          const details=JSON.parse(raw);
          console.log('PRIOR_T22_DETAILS_COUNT',details.length);
          const dangerNames=new Set(['PermanentDelegate','PausableConfig','DefaultAccountState','NonTransferable','TransferHook','MintCloseAuthority','InterestBearingConfig','ScaledUiAmountConfig']);
          const candidates=details.filter(x=>(x.extensions??[]).some(e=>dangerNames.has(e)));
          const counts={};for(const d of details)for(const e of d.extensions??[])counts[e]=(counts[e]??0)+1;
          console.log('ALL_EXTENSION_COUNTS',JSON.stringify(counts,null,2));
          console.log('DANGEROUS_PRIOR_COUNT',candidates.length);
          console.log('DANGEROUS_PRIOR_ROWS',JSON.stringify(candidates,null,2));

          const RPCS=['https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com','https://solana.public-rpc.com','https://rpc.solanatracker.io/public'];let id=1;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function one(u,m,p,n=5){let e;for(let k=0;k<n;k++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});if(r.status===429||r.status>=500){e=new Error('HTTP '+r.status);await sleep(500+500*k);continue}const x=await r.json();if(x.error){e=new Error(JSON.stringify(x.error));break}return x.result}catch(x){e=x;await sleep(500+500*k)}}throw e}
          async function rpc(m,p){let e;for(const u of RPCS){try{return await one(u,m,p)}catch(x){e=x}}throw e}
          const out=[];
          for(let i=0;i<candidates.length;i+=80){
            const chunk=candidates.slice(i,i+80),keys=chunk.map(x=>x.mint),r=await rpc('getMultipleAccounts',[keys,{encoding:'base64',commitment:'confirmed'}]);
            for(let k=0;k<chunk.length;k++){
              const ai=r.value[k];if(!ai)continue;const info={data:Buffer.from(ai.data[0],'base64'),executable:ai.executable,lamports:ai.lamports,owner:new PublicKey(ai.owner),rentEpoch:ai.rentEpoch??0};
              const mint=unpackMint(new PublicKey(keys[k]),info,TOKEN_2022_PROGRAM_ID);
              const enc=z=>JSON.parse(JSON.stringify(z,(_key,v)=>typeof v==='bigint'?v.toString():v?.toBase58?.()??v));
              out.push({
                mint:keys[k],pools:chunk[k].pools,
                extensions:getExtensionTypes(mint.tlvData).map(n=>ExtensionType[n]??String(n)),
                permanentDelegate:enc(getPermanentDelegate(mint)),
                transferHook:enc(getTransferHook(mint)),
                pausable:enc(getPausableConfig(mint)),
                mintCloseAuthority:enc(getMintCloseAuthority(mint)),
                defaultAccountState:enc(getDefaultAccountState(mint)),
                nonTransferable:enc(getNonTransferable(mint)),
                interestBearing:enc(getInterestBearingMintConfigState(mint)),
                scaledUiAmount:enc(getScaledUiAmountConfig(mint)),
              });
            }
          }
          console.log('LIVE_DANGEROUS_ROWS',JSON.stringify(out,null,2));
          const activeHooks=out.filter(x=>x.transferHook&&x.transferHook.programId&&x.transferHook.programId!=='11111111111111111111111111111111');
          const permanent=out.filter(x=>x.permanentDelegate);
          const pausable=out.filter(x=>x.pausable);
          console.log('LIVE_PERMANENT_DELEGATE_COUNT',permanent.length);
          console.log('LIVE_PERMANENT_DELEGATE_ROWS',JSON.stringify(permanent,null,2));
          console.log('LIVE_ACTIVE_TRANSFER_HOOK_COUNT',activeHooks.length);
          console.log('LIVE_ACTIVE_TRANSFER_HOOK_ROWS',JSON.stringify(activeHooks,null,2));
          console.log('LIVE_PAUSABLE_COUNT',pausable.length);
          console.log('LIVE_PAUSABLE_ROWS',JSON.stringify(pausable,null,2));
          NODE
