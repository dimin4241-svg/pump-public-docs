name: Exact reachable payment-info selector analysis v207

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-paymentinfo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact public Okko 8.180.0 and decompile sole APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/okko
          curl --location --fail --retry 2 --silent --show-error \
            --header 'User-Agent: okko-standoff365-static-research/1.0' \
            --output /tmp/okko/okko.pkg \
            'https://static.rustore.ru/2026/8/14/7b/de764e6d-0184-4e0f-a7c6-0b6a30580a79.zip'
          python3 - <<'PY'
          import hashlib,shutil,zipfile
          from pathlib import Path
          p=Path('/tmp/okko/okko.pkg');h=hashlib.sha256();n=0
          with p.open('rb') as f:
              for b in iter(lambda:f.read(1024*1024),b''):
                  n+=len(b);h.update(b)
          got=h.hexdigest();assert n==45942514 and got=='b00bca9cb327ab3ee483b46d390c9120ac28bfc7674c75fda0129c6c594cc1f9'
          with zipfile.ZipFile(p) as z:
              apks=[x for x in z.infolist() if x.filename.lower().endswith('.apk')]
              assert len(apks)==1
              with z.open(apks[0]) as src,open('/tmp/okko/okko.apk','wb') as dst:shutil.copyfileobj(src,dst,1024*1024)
          PY
          URL=$(python3 - <<'PY'
          import json,urllib.request
          d=json.load(urllib.request.urlopen('https://api.github.com/repos/skylot/jadx/releases/latest',timeout=30))
          print([a['browser_download_url'] for a in d['assets'] if a['name'].startswith('jadx-') and a['name'].endswith('.zip')][0])
          PY
          )
          curl -L --fail --retry 2 "$URL" -o /tmp/jadx.zip
          mkdir -p /tmp/jadx && unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          /tmp/jadx/bin/jadx --no-res --no-imports --show-bad-code --threads-count 4 \
            -d /tmp/okko/jadx /tmp/okko/okko.apk >/tmp/jadx.stdout 2>/tmp/jadx.stderr || true
          test -d /tmp/okko/jadx/sources

      - name: Trace subscription selector provenance and PaymentInfo response dataflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json,re
          from pathlib import Path

          SRC=Path('/tmp/okko/jadx/sources');OUT=Path('/tmp/okko-v207.json')
          FIRST=('ru/okko/','ru/more/play/','p003nskobfuscated/','nskobfuscated/')
          STR_RX=re.compile(r'"([^"\\]*(?:\\.[^"\\]*)*)"')
          URL_RX=re.compile(r'https?://[^\s\"\'<>]+',re.I)
          TARGET='getPaymentMethodInfo'
          SELS=('renewedUserSubscriptionId','upgradedUserSubscriptionIds')

          def rel(p):return str(p.relative_to(SRC)).replace('\\','/')
          def rd(p):return p.read_text(encoding='utf-8',errors='replace')
          def redact(s):
              safe=set(SELS)|{'client_type','paymentToken','subscriptionId','orderId','price','currency','offerId','loyaltyPrice','paymentMethod'}
              return STR_RX.sub(lambda m:'"'+m.group(1)+'"' if m.group(1) in safe or URL_RX.fullmatch(m.group(1)) else '"<lit>"',s)[:18000]
          def one(path,base):
              p=SRC/path
              if p.is_file():return p
              rows=[x for x in SRC.rglob(base) if str(x).replace('\\','/').endswith(str(path).replace('\\','/'))] or list(SRC.rglob(base))
              if len(rows)!=1:raise SystemExit(f'{base}: {len(rows)} matches')
              return rows[0]
          def match(t,op,L='(',R=')'):
              d=0;q=None;esc=False
              for i in range(op,len(t)):
                  c=t[i]
                  if q:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c==q:q=None
                      continue
                  if c in ('"',"'"):q=c;continue
                  if c==L:d+=1
                  elif c==R:
                      d-=1
                      if d==0:return i
              return None
          def split_top(s):
              out=[];st=0;dp=db=ds=da=0;q=None;esc=False
              for i,c in enumerate(s):
                  if q:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c==q:q=None
                      continue
                  if c in ('"',"'"):q=c
                  elif c=='(':dp+=1
                  elif c==')':dp-=1
                  elif c=='{':db+=1
                  elif c=='}':db-=1
                  elif c=='[':ds+=1
                  elif c==']':ds-=1
                  elif c=='<':da+=1
                  elif c=='>':da=max(0,da-1)
                  elif c==',' and dp==db==ds==da==0:
                      out.append(s[st:i].strip());st=i+1
              out.append(s[st:].strip());return [x for x in out if x]
          def methods(t):
              out=[];rx=re.compile(r'(?m)^\s*(?:(?:public|private|protected|static|final|synchronized|native|abstract|default)\s+)+[^;={}]{1,3800}?\s+([A-Za-z_$][\w$]*)\s*\(([^;{}]*)\)\s*(?:throws [^{]+)?\{')
              for m in rx.finditer(t):
                  op=t.find('{',m.start(),m.end()+2);cp=match(t,op,'{','}') if op>=0 else None
                  if cp is None:continue
                  out.append({'start':m.start(),'end':cp+1,'name':m.group(1),'params':m.group(2),'sig':re.sub(r'\s+',' ',m.group(0)[:-1]).strip()[:3800]})
              return out
          def owner(ms,pos):
              rows=[m for m in ms if m['start']<=pos<m['end']]
              return rows[-1] if rows else None
          def sl(t,pos,b=14,a=24):
              ls=t.splitlines();line=t[:pos].count('\n')+1;lo=max(1,line-b);hi=min(len(ls),line+a)
              return {'line':line,'start':lo,'end':hi,'text':'\n'.join(f'{i:05d}: {redact(ls[i-1])}' for i in range(lo,hi+1))}
          def typemap(t):
              out={}
              for m in re.finditer(r'\b([A-Za-z_$][\w.$]*(?:<[^;={}()]+>)?)\s+([A-Za-z_$][\w$]*)\s*(?=[;=,)])',t):
                  out[m.group(2)]=re.sub(r'<.*>','',m.group(1)).strip()
              return out
          def model(p):
              t=rd(p);ls=t.splitlines();fields=[];getters=[];pending=None
              sr=re.compile(r'(?i)(?:SerialName|SerializedName|JsonProperty)\s*\(\s*"([^"\\]{1,180})"')
              for i,l in enumerate(ls,1):
                  sm=sr.search(l)
                  if sm:pending=(i,sm.group(1))
                  fm=re.search(r'^\s*(?:(?:public|private|protected|final|static|transient|volatile)\s+)+([A-Za-z0-9_.$<>?, \[\]]+)\s+([A-Za-z_$][\w$]*)\s*(?:;|=)',l)
                  if fm:
                      ser=pending[1] if pending and i-pending[0]<=4 else None
                      fields.append({'line':i,'type':fm.group(1).strip(),'field':fm.group(2),'serialized':ser});pending=None
              for i,l in enumerate(ls,1):
                  gm=re.search(r'\b(get|is)([A-Za-z_$][\w$]*)\s*\(\s*\)\s*\{',l)
                  if gm:
                      tail='\n'.join(ls[i-1:min(len(ls),i+8)]);rm=re.search(r'return\s+(?:this\.)?([A-Za-z_$][\w$]*)\s*;',tail)
                      getters.append({'line':i,'getter':gm.group(1)+gm.group(2),'field':rm.group(1) if rm else None})
              return {'path':rel(p),'fields':fields,'getters':getters,'method_signatures':[m['sig'] for m in methods(t)[:150]],'shape':redact(t[:30000])}

          api=one(Path('ru/okko/sdk/data/network/api/AuthScreenApi.java'),'AuthScreenApi.java')
          provider=one(Path('ru/okko/commonApp/internal/di/modules/lazyApi/AuthScreenApiProvider.java'),'AuthScreenApiProvider.java')
          pay=one(Path('ru/okko/sdk/data/repository/PaymentRepositoryImpl.java'),'PaymentRepositoryImpl.java')
          prepo=one(Path('ru/okko/sdk/domain/repository/PaymentRepository.java'),'PaymentRepository.java')
          usecase=one(Path('ru/okko/sdk/domain/usecase/PaymentNewCardUseCase.java'),'PaymentNewCardUseCase.java')

          # ---- exact endpoint declaration and query indices ----
          at=rd(api);endpoint=None
          m=re.search(r'(?s)(@(?:retrofit2\.http\.)?GET\s*\(\s*"v3/paymentmethod/\{client_type\}/1"\s*\).*?\bgetPaymentMethodInfo\s*\((.*?)\)\s*;)',at)
          if m:
              params=split_top(m.group(2));rows=[]
              for i,p in enumerate(params):
                  anns=[]
                  for a in re.finditer(r'@(?:retrofit2\.http\.)?(Path|Query|QueryName|Header|Field|Body)\s*(?:\(\s*"([^"]*)"\s*\))?',p):anns.append({'kind':a.group(1),'value':a.group(2)})
                  clean=re.sub(r'@[\w.$]+(?:\([^)]*\))?\s*','',p).strip();nm=re.search(r'([A-Za-z_$][\w$]*)\s*$',clean)
                  rows.append({'index':i,'name':nm.group(1) if nm else None,'declaration':redact(clean),'annotations':anns})
              endpoint={'verb':'GET','route':'v3/paymentmethod/{client_type}/1','params':rows,'declaration_shape':redact(m.group(1))}

          # ---- repository inner call and response conversion ----
          pt=rd(pay);pms=methods(pt);repo_calls=[];paymentinfo_context=[]
          for cm in re.finditer(r'\.'+TARGET+r'\s*\(',pt):
              op=pt.find('(',cm.start(),cm.end()+2);cp=match(pt,op)
              if cp is None:continue
              mo=owner(pms,cm.start());args=split_top(pt[op+1:cp]);repo_calls.append({'line':pt[:cm.start()].count('\n')+1,'owner':mo['sig'] if mo else None,'args':[redact(x) for x in args],'slice':sl(pt,cm.start(),28,40)})
          for mm in re.finditer(r'PaymentInfo|ScreenApiResponse',pt):
              mo=owner(pms,mm.start());body=pt[mo['start']:mo['end']] if mo else ''
              if TARGET in body or ('PaymentInfo' in body and 'getPaymentInfo' in (mo['sig'] if mo else '')):
                  paymentinfo_context.append({'marker':mm.group(0),'owner':mo['sig'] if mo else None,'slice':sl(pt,mm.start(),14,20)})
                  if len(paymentinfo_context)>=60:break

          # ---- outer getPaymentInfo constructor of inner class c and capture fields ----
          outer=[];inner_ctor=[]
          for mo in pms:
              if mo['name']=='getPaymentInfo':outer.append({'signature':mo['sig'],'slice':sl(pt,mo['start'],0,36)})
          for nm in re.finditer(r'\bnew\s+(?:(?:[A-Za-z_$][\w$]*\.)*)c\s*\(',pt):
              mo=owner(pms,nm.start())
              if not mo or mo['name']!='getPaymentInfo':continue
              op=pt.find('(',nm.start(),nm.end()+2);cp=match(pt,op);args=split_top(pt[op+1:cp]) if cp else []
              inner_ctor.append({'outer':mo['sig'],'args':[redact(x) for x in args],'slice':sl(pt,nm.start(),12,18)})

          # ---- PaymentRepository interface metadata/declaration near getPaymentInfo ----
          prt=rd(prepo);interface_ctx=[]
          for mm in re.finditer(r'\bgetPaymentInfo\s*\(',prt):
              interface_ctx.append({'slice':sl(prt,mm.start(),12,24),'metadata_near':redact(prt[max(0,mm.start()-5000):min(len(prt),mm.start()+6000)])})

          # ---- external PaymentNewCardUseCase calls and provenance of selector expressions ----
          ut=rd(usecase);ums=methods(ut);ucalls=[]
          for cm in re.finditer(r'\.getPaymentInfo\s*\(',ut):
              op=ut.find('(',cm.start(),cm.end()+2);cp=match(ut,op)
              if cp is None:continue
              mo=owner(ums,cm.start());args=split_top(ut[op+1:cp]);detail=[]
              body_before=ut[mo['start']:cm.start()] if mo else ut[:cm.start()]
              for idx,a in enumerate(args):
                  assigns=[]
                  if re.fullmatch(r'[A-Za-z_$][\w$]*',a):
                      assigns=[redact(x.group(1).strip()) for x in re.finditer(r'\b'+re.escape(a)+r'\s*=\s*([^;]+);',body_before)][-6:]
                  getters=sorted(set(re.findall(r'\.([A-Za-z_$][\w$]*(?:Id|Ids|Token|Subscriptions?|Price|Amount|Offer))\s*\(',a)))
                  detail.append({'index':idx,'expr':redact(a),'prior_assignments':assigns,'semantic_getters':getters})
              ucalls.append({'line':ut[:cm.start()].count('\n')+1,'owner':mo['sig'] if mo else None,'args':detail,'slice':sl(ut,cm.start(),30,38)})

          # ---- every named selector occurrence and surrounding source -----
          selector_occ=[]
          for p in SRC.rglob('*.java'):
              rp=rel(p)
              if not rp.startswith(FIRST):continue
              try:t=rd(p)
              except Exception:continue
              if not any(s in t for s in SELS):continue
              ms=methods(t)
              for s in SELS:
                  for mm in re.finditer(re.escape(s),t):
                      mo=owner(ms,mm.start());selector_occ.append({'selector':s,'path':rp,'line':t[:mm.start()].count('\n')+1,'owner':mo['sig'] if mo else None,'slice':sl(t,mm.start(),10,16)})
                      if len(selector_occ)>=220:break

          # ---- domain/model classes that expose subscription IDs or upgrade relationships ----
          model_candidates=[]
          mmrx=re.compile(r'(?i)(renewedUserSubscriptionId|upgradedUserSubscriptionIds|userSubscriptionId|subscriptionId)')
          for p in SRC.rglob('*.java'):
              rp=rel(p)
              if not rp.startswith(FIRST):continue
              try:t=rd(p)
              except Exception:continue
              if not mmrx.search(t):continue
              bn=p.name.lower();score=0
              for tok,w in [('subscription',5),('product',3),('payment',4),('offer',2),('user',2)]:
                  if tok in (rp+' '+t[:9000]).lower():score+=w
              # only compact semantic model-ish files, excluding huge APIs/repos
              if p.stat().st_size<250000:
                  model_candidates.append({'path':rp,'score':score,'shape':redact(t[:26000]),'method_signatures':[m['sig'] for m in methods(t)[:80]]})
          model_candidates.sort(key=lambda x:x['score'],reverse=True)

          # ---- PaymentInfo model and converter/use sites ----
          paymentinfo_files=list(SRC.rglob('PaymentInfo.java'))
          paymentinfo_models=[model(p) for p in paymentinfo_files[:10]]
          converters=[]
          for p in SRC.rglob('*.java'):
              rp=rel(p)
              if not rp.startswith(FIRST):continue
              try:t=rd(p)
              except Exception:continue
              if 'PaymentInfo' not in t or 'ScreenApiResponse' not in t:continue
              ms=methods(t)
              hits=[]
              for mm in re.finditer(r'PaymentInfo|ScreenApiResponse',t):
                  mo=owner(ms,mm.start())
                  if mo:hits.append({'marker':mm.group(0),'owner':mo['sig'],'slice':sl(t,mm.start(),10,15)})
                  if len(hits)>=20:break
              if hits:converters.append({'path':rp,'hits':hits})

          # ---- screenapi production base URL mapping (reuse exact structural logic) ----
          provt=rd(provider);base_expr=[];getters=sorted(set(re.findall(r'get([A-Z][A-Za-z0-9_$]*)\s*\(\s*\)',provt)))
          for bm in re.finditer(r'\.baseUrl\s*\(([^;]+?)\)',provt,re.S):base_expr.append({'expression':redact(re.sub(r'\s+',' ',bm.group(1))),'slice':sl(provt,bm.start(),10,14)})
          prod_urls=[]
          if 'ScreenApiServerUrlV2' in getters:
              cmr=list(SRC.rglob('ConfigModelResponse.java'));dflt=list(SRC.rglob('DefaultConfigModelResponse.java'))
              if len(cmr)==1 and len(dflt)==1:
                  ct=rd(cmr[0]);dt=rd(dflt[0]);gm=re.search(r'(?s)\bgetScreenApiServerUrlV2\s*\(\s*\)\s*\{(.{0,1200}?)\}',ct)
                  if gm:
                      rm=re.search(r'return\s+(?:this\.)?([A-Za-z_$][\w$]*)\s*;',gm.group(1));field=rm.group(1) if rm else None
                      slot=arity=None
                      if field:
                          crx=re.compile(r'(?m)^\s*(?:(?:public|private|protected)\s+)?ConfigModelResponse\s*\(([^)]*)\)\s*\{')
                          for c in crx.finditer(ct):
                              ps=split_top(c.group(1));names=[]
                              for row in ps:
                                  x=re.sub(r'@[\w.$]+(?:\([^)]*\))?\s*','',row).strip();nm=re.search(r'([A-Za-z_$][\w$]*)\s*$',x);names.append(nm.group(1) if nm else '')
                              op=ct.find('{',c.start(),c.end()+2);cp=match(ct,op,'{','}') if op>=0 else None;body=ct[op+1:cp] if cp else ''
                              am=re.search(r'this\.'+re.escape(field)+r'\s*=\s*([A-Za-z_$][\w$]*)\s*;',body)
                              if am and am.group(1) in names and not any('DefaultConstructorMarker' in x for x in ps):slot=names.index(am.group(1));arity=len(ps);break
                      if slot is not None:
                          for nm in re.finditer(r'\bnew\s+(?:[A-Za-z_$][\w$]*\.)*ConfigModelResponse\s*\(',dt):
                              op=dt.find('(',nm.start(),nm.end()+2);cp=match(dt,op)
                              if cp is None:continue
                              args=split_top(dt[op+1:cp])
                              if len(args)!=arity or slot>=len(args):continue
                              left=dt[max(0,nm.start()-400):nm.start()];am=re.search(r'([A-Za-z_$][\w$]*)\s*=\s*$',left);target=am.group(1) if am else None
                              if target=='prod':prod_urls.extend(URL_RX.findall(args[slot]))

          report={
            'status':'ok','run_rev':'v207.0-paymentinfo-selector',
            'package_identity':{'version_name':'8.180.0','outer_bytes':45942514,'outer_sha256':'b00bca9cb327ab3ee483b46d390c9120ac28bfc7674c75fda0129c6c594cc1f9','apk_entry_count':1},
            'network_policy':{'okko_requests':0,'protected_requests':0,'runtime_started':False,'credentials_read':False,'mutations':0,'third_party_accounts':0,'identifier_enumeration':False,'certificate_or_trust_override':False,'static_only':True},
            'raw_credentials_persisted':False,
            'endpoint':endpoint,
            'repository_calls':repo_calls,
            'repository_outer_method':outer,
            'repository_inner_construction':inner_ctor,
            'repository_paymentinfo_context':paymentinfo_context,
            'repository_interface_context':interface_ctx,
            'payment_new_card_calls':ucalls,
            'selector_occurrences':selector_occ[:220],
            'selector_model_candidates':model_candidates[:80],
            'paymentinfo_models':paymentinfo_models,
            'paymentinfo_converter_candidates':converters[:80],
            'provider':{'path':rel(provider),'baseurl_expressions':base_expr,'getters':getters},
            'derived':{'production_base_urls':sorted(set(prod_urls))},
            'summary':{
              'repository_call_count':len(repo_calls),
              'payment_new_card_call_count':len(ucalls),
              'selector_occurrence_count':len(selector_occ),
              'selector_model_candidate_count':len(model_candidates),
              'paymentinfo_model_count':len(paymentinfo_models),
              'converter_candidate_count':len(converters),
              'production_base_url_count':len(set(prod_urls)),
              'exact_single_production_base_url_proven':len(set(prod_urls))==1,
              'vulnerability_proven':False
            },
            'decision':{
              'vulnerability_proven':False,'reportable':False,'runtime_authorized':False,
              'next_action':'Classify whether subscription selectors are normal caller-owned IDs and whether PaymentInfo contains user-sensitive data or only pricing/options for the caller. Fail closed before any runtime request.'
            }
          }
          OUT.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'summary':report['summary'],'prod_urls':report['derived']['production_base_urls'],'endpoint':endpoint,
                            'repo_calls':repo_calls,'usecase_calls':ucalls,'paymentinfo_models':paymentinfo_models,
                            'model_candidates':model_candidates[:20]},ensure_ascii=False,indent=2)[:160000])
          PY

      - name: Upload sanitized payment-info evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okko-paymentinfo-v207
          path: |
            /tmp/okko-v207.json
            /tmp/jadx.stderr
          if-no-files-found: warn
          retention-days: 7

# Exact public Okko 8.180.0 static analysis only via trusted official RuStore CDN alias.
# Zero target/protected traffic, credentials, mutations, third-party data, enumeration or bypasses.
