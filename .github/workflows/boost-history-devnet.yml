name: PumpSwap BOOST Devnet history inspection

on:
  push:
    branches:
      - research/boost-auth-devnet
    paths:
      - "research/boost-history/**"
      - ".github/workflows/boost-history-devnet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-history:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install isolated dependencies
        working-directory: research/boost-history
        run: npm install --no-audit --no-fund
      - name: Inspect Devnet history read-only
        working-directory: research/boost-history
        env:
          DEVNET_RPC: https://api.devnet.solana.com
        run: node inspect.mjs
