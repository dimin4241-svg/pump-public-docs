name: boost-lp-supply-fast
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/boost-lp-supply-fast.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - shell: bash
        run: |
          node --input-type=module <<'NODE'
          const mint='28EQ4ZxYemsyWyffL1R2fpQi3q86aUjDnVxFViwuf7H1';
          const RPCS=['https://rpc.solanatracker.io/public','https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com'];let id=1;
          async function req(u,m,p){const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});if(!r.ok)throw Error('HTTP '+r.status);const x=await r.json();if(x.error)throw Error(JSON.stringify(x.error));return x.result}
          async function call(m,p){let e;for(const u of RPCS){try{const x=await req(u,m,p);console.log('RPC_OK',m,u);return x}catch(x){e=x;console.log('RPC_FAIL',m,u,String(x).slice(0,180))}}throw e}
          const s=await call('getTokenSupply',[mint,{commitment:'confirmed'}]);
          const a=(await call('getAccountInfo',[mint,{encoding:'base64',commitment:'confirmed'}])).value;
          console.log('CURRENT_LP_SUPPLY',JSON.stringify(s.value));
          if(a){const b=Buffer.from(a.data[0],'base64');console.log('MINT_RAW',JSON.stringify({owner:a.owner,len:b.length,rawSupplyLE:b.length>=44?b.readBigUInt64LE(36).toString():null,decimals:b.length>44?b[44]:null}));}
          NODE