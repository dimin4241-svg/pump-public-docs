name: set-coin-creator-cross-binding-runtime
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/set-coin-creator-cross-binding-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @solana/web3.js bs58
      - name: Simulation-only set_coin_creator cross-binding differential
        shell: bash
        run: |
          cat > probe.mjs <<'NODE'
          import fs from 'fs';
          import bs58pkg from 'bs58';
          import {PublicKey,Keypair,Transaction,TransactionInstruction,ComputeBudgetProgram} from '@solana/web3.js';
          const bs58=bs58pkg.default??bs58pkg;

          // Authorized bounty harness: read-only RPC + simulateTransaction only. No broadcast methods are present.
          const AMM=new PublicKey('pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA');
          const PAYER=new PublicKey('39azUYFWPz3VHgKCf3VChUwbpURdCHRxjWVowf5jUJjg');
          const pumpJson=JSON.parse(fs.readFileSync('idl/pump.json','utf8'));
          const ammJson=JSON.parse(fs.readFileSync('idl/pump_amm.json','utf8'));
          const PUMP=new PublicKey(pumpJson.address);
          const META=new PublicKey('metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s');
          const setDef=ammJson.instructions.find(i=>i.name==='set_coin_creator');
          if(!setDef)throw Error('set_coin_creator missing');
          const names=setDef.accounts.map(a=>a.name);
          console.log('SET_BINDING',JSON.stringify(setDef.accounts.map(a=>({name:a.name,pda:a.pda??null,address:a.address??null,writable:!!a.writable,signer:!!a.signer})),null,2));

          const RPCS=['https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com','https://rpc.solanatracker.io/public'];
          let id=1;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function raw(u,m,p,n=4){let e;for(let a=0;a<n;a++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-simulation-only/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});if(r.status===429||r.status>=500){e=Error('HTTP '+r.status);await sleep(250+350*a);continue}const x=await r.json();if(x.error)throw Error(JSON.stringify(x.error));return x.result}catch(x){e=x;await sleep(180)}}throw e}
          async function call(m,p){let e;for(const u of RPCS){try{const x=await raw(u,m,p);console.log('RPC_OK',m,u);return x}catch(x){e=x;console.log('RPC_FAIL',m,u,String(x).slice(0,180))}}throw e}
          function curvePda(mint){return PublicKey.findProgramAddressSync([Buffer.from('bonding-curve'),mint.toBuffer()],PUMP)[0]}
          function metadataPda(mint){return PublicKey.findProgramAddressSync([Buffer.from('metadata'),META.toBuffer(),mint.toBuffer()],META)[0]}
          const EVENT=PublicKey.findProgramAddressSync([Buffer.from('__event_authority')],AMM)[0];
          const INCIN='1nc1nerator11111111111111111111111111111111';

          // Pick classic/non-Mayhem live pools for which both canonical source accounts exist, so the control reaches instruction logic.
          let rows=null;
          for(const u of RPCS){try{rows=await raw(u,'getProgramAccounts',[AMM.toBase58(),{encoding:'base64',commitment:'confirmed',filters:[{dataSize:301},{memcmp:{offset:243,bytes:'1'}}],dataSlice:{offset:0,length:245}}],3);console.log('GPA_OK',u,'rows',rows.length);break}catch(e){console.log('GPA_FAIL',u,String(e).slice(0,200))}}
          if(!rows)throw Error('no AMM pool inventory');
          const parsed=[];
          for(const r of rows){const b=Buffer.from(r.account.data[0],'base64');if(b.length<245||b[243]!==0)continue;parsed.push({pool:new PublicKey(r.pubkey),baseMint:new PublicKey(b.subarray(43,75)),coinCreator:new PublicKey(b.subarray(211,243))});}
          parsed.sort((a,b)=>(a.coinCreator.toBase58()===INCIN?-1:0)-(b.coinCreator.toBase58()===INCIN?-1:0));
          console.log('NON_MAYHEM_PARSED',parsed.length,'incinerator',parsed.filter(x=>x.coinCreator.toBase58()===INCIN).length);

          const valid=[];
          const sample=parsed.slice(0,1600);
          for(let i=0;i<sample.length&&valid.length<12;i+=40){
            const batch=sample.slice(i,i+40);const addrs=[];for(const x of batch)addrs.push(metadataPda(x.baseMint).toBase58(),curvePda(x.baseMint).toBase58());
            let vals;try{vals=(await call('getMultipleAccounts',[addrs,{encoding:'base64',commitment:'confirmed'}])).value}catch(e){console.log('VALID_BATCH_FAIL',i,String(e).slice(0,160));continue}
            for(let j=0;j<batch.length;j++){const md=vals[j*2],bc=vals[j*2+1];if(md&&bc&&md.owner===META.toBase58()&&bc.owner===PUMP.toBase58())valid.push({...batch[j],metadata:metadataPda(batch[j].baseMint),curve:curvePda(batch[j].baseMint)});if(valid.length>=12)break}
          }
          console.log('VALID_CONTROLS',JSON.stringify(valid.map(x=>({pool:x.pool.toBase58(),baseMint:x.baseMint.toBase58(),preCoinCreator:x.coinCreator.toBase58(),metadata:x.metadata.toBase58(),curve:x.curve.toBase58()})),null,2));
          if(valid.length<2)throw Error('not enough valid controls');

          const foreign=valid.find((x,i)=>i>0&&x.baseMint.toBase58()!==valid[0].baseMint.toBase58())??valid[1];
          const targets=valid.filter(x=>x.pool.toBase58()!==foreign.pool.toBase58()).slice(0,Math.min(4,valid.length-1));
          function make(x,over={}){const map={pool:x.pool,metadata:x.metadata,bonding_curve:x.curve,event_authority:EVENT,program:AMM,...over};const keys=setDef.accounts.map(a=>{let p=map[a.name];if(!p&&a.address)p=new PublicKey(a.address);if(!p)throw Error('missing '+a.name);return {pubkey:p,isSigner:!!a.signer,isWritable:!!a.writable}});return new TransactionInstruction({programId:AMM,keys,data:Buffer.from(setDef.discriminator)});}
          const bh=(await call('getLatestBlockhash',[{commitment:'confirmed'}])).value.blockhash;
          function postCreator(a){try{const b=Buffer.from(a.data[0],'base64');return bs58.encode(b.subarray(211,243))}catch{return null}}
          async function sim(label,target,ix){const tx=new Transaction({feePayer:PAYER,recentBlockhash:bh}).add(ComputeBudgetProgram.setComputeUnitLimit({units:300000}),ix);const bytes=tx.serialize({requireAllSignatures:false,verifySignatures:false});let v=null;for(const u of RPCS){try{v=(await raw(u,'simulateTransaction',[bytes.toString('base64'),{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'confirmed',accounts:{encoding:'base64',addresses:[target.pool.toBase58()]}}],3)).value;break}catch(e){console.log('SIM_RPC_FAIL',label,u,String(e).slice(0,180))}}if(!v)return {rpc:'fail'};const l=v.logs??[];const out={err:v.err,units:v.unitsConsumed,postCoinCreator:v.accounts?.[0]?postCreator(v.accounts[0]):null,anchor:l.filter(x=>x.includes('AnchorError')||x.includes('Error Code:')),failed:l.filter(x=>x.includes('failed:')),instructions:l.filter(x=>x.includes('Instruction:'))};console.log('CASE',label,JSON.stringify(out,null,2));if(v.err)for(const x of l)console.log('ERRLOG',label,x);return out}

          const result={foreign:{pool:foreign.pool.toBase58(),baseMint:foreign.baseMint.toBase58(),coinCreator:foreign.coinCreator.toBase58(),metadata:foreign.metadata.toBase58(),curve:foreign.curve.toBase58()},targets:{}};
          for(const t of targets){
            const cases={
              control:make(t),
              foreign_curve_only:make(t,{bonding_curve:foreign.curve}),
              foreign_metadata_only:make(t,{metadata:foreign.metadata}),
              foreign_metadata_and_curve:make(t,{metadata:foreign.metadata,bonding_curve:foreign.curve}),
              random_curve:make(t,{bonding_curve:Keypair.generate().publicKey}),
            };
            const rr={baseMint:t.baseMint.toBase58(),preCoinCreator:t.coinCreator.toBase58(),metadata:t.metadata.toBase58(),curve:t.curve.toBase58(),cases:{}};
            for(const [n,ix] of Object.entries(cases))rr.cases[n]=await sim(t.pool.toBase58().slice(0,7)+'_'+n,t,ix);
            result.targets[t.pool.toBase58()]=rr;
          }
          console.log('DECISIVE',JSON.stringify(result,null,2));
          NODE
          node probe.mjs
