name: mayhem-sweep-prefix-debug
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/mayhem-sweep-prefix-debug.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @solana/web3.js @solana/spl-token
      - name: Simulation-only prefix debug
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {PublicKey,TransactionInstruction,TransactionMessage,VersionedTransaction} from '@solana/web3.js';
          import {getAssociatedTokenAddressSync,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID,NATIVE_MINT,TOKEN_2022_PROGRAM_ID} from '@solana/spl-token'; import crypto from 'node:crypto';
          const pk=s=>new PublicKey(s),P=pk('MAyhSmzXzV1pTf7LsNkrNwkWKTo4ougAJ1PPg47MD4e'),G=pk('13ec7XdrjF3h3YcqBTFDSReRcUFwbCnJaAQspM4j6DDJ'),T=pk('Gygj9QQby4j2jryqyqBHvLP7ctv2SaANgh4sCb69BUpA'),Q=pk('EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v'),SYS=pk('11111111111111111111111111111111');
          const TA=getAssociatedTokenAddressSync(Q,T,true,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID),[EV]=PublicKey.findProgramAddressSync([Buffer.from('__event_authority')],P); const disc=crypto.createHash('sha256').update('global:sweep_fees').digest().subarray(0,8); const bhurl='https://api.mainnet-beta.solana.com';let id=1;
          async function rpc(method,params){const r=await fetch(bhurl,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-simulation-only-sweep-prefix/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method,params})});const j=await r.json();if(j.error)throw Error(JSON.stringify(j.error));return j.result}
          const bh=(await rpc('getLatestBlockhash',[{commitment:'processed'}])).value.blockhash;const meta=(p,s=false,w=false)=>({pubkey:p,isSigner:s,isWritable:w});
          const variants={system:SYS,ata:ASSOCIATED_TOKEN_PROGRAM_ID,token22:TOKEN_2022_PROGRAM_ID,event:EV,mayhem:P};
          for(const [label,p5] of Object.entries(variants)){const keys=[meta(T,true,true),meta(G,false,true),meta(Q),meta(TA,false,true),meta(TOKEN_PROGRAM_ID),meta(p5),...Array.from({length:12},()=>meta(SYS))];const ix=new TransactionInstruction({programId:P,keys,data:disc});const msg=new TransactionMessage({payerKey:T,recentBlockhash:bh,instructions:[ix]}).compileToV0Message();const tx=new VersionedTransaction(msg);const v=(await rpc('simulateTransaction',[Buffer.from(tx.serialize()).toString('base64'),{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'processed'}])).value;console.log('\n===',label,p5.toBase58(),'===');console.log('ERR',JSON.stringify(v.err),'UNITS',v.unitsConsumed);for(const l of v.logs??[])console.log(l)}
          NODE
