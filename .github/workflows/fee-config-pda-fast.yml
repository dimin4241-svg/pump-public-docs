name: fee-config-pda-fast
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/fee-config-pda-fast.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @solana/web3.js
      - shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {PublicKey} from '@solana/web3.js';
          const FEE=new PublicKey('pfeeUxB6jkeY1Hxd7CsFCAjcbHA9rWtchMGdZ6VojVZ');const ps={pump:'6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P',amm:'pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA'};const out={};for(const[n,p]of Object.entries(ps)){const[a,b]=PublicKey.findProgramAddressSync([Buffer.from('fee_config'),new PublicKey(p).toBuffer()],FEE);out[n]={program:p,pda:a.toBase58(),bump:b};}console.log('PDAS',JSON.stringify(out));
          const RPCS=['https://rpc.solanatracker.io/public','https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com'];let id=1;async function req(u,m,p){const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});const x=await r.json();if(x.error)throw Error(JSON.stringify(x.error));return x.result}let v=null;for(const u of RPCS){try{v=(await req(u,'getMultipleAccounts',[[out.pump.pda,out.amm.pda],{encoding:'base64',commitment:'confirmed'}])).value;console.log('RPC',u);break}catch(e){console.log('FAIL',u,String(e).slice(0,160))}}if(!v)throw Error('no rpc');for(let i=0;i<2;i++){const a=v[i];console.log('ACCOUNT',i,JSON.stringify({exists:!!a,owner:a?.owner,lamports:a?.lamports,len:a?Buffer.from(a.data[0],'base64').length:null,prefix:a?Buffer.from(a.data[0],'base64').subarray(0,24).toString('hex'):null}));}
          NODE