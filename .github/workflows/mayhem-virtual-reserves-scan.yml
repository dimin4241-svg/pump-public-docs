name: mayhem-virtual-reserves-scan
on:
  push:
    paths:
      - '.github/workflows/mayhem-virtual-reserves-scan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @pump-fun/pump-swap-sdk@1.19.0 @solana/web3.js bs58
      - name: Read-only scan of Mayhem virtual reserves
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import bs58pkg from 'bs58'; const bs58=bs58pkg.default??bs58pkg;
          import {Connection,PublicKey} from '@solana/web3.js';
          import {OnlinePumpAmmSdk} from '@pump-fun/pump-swap-sdk';
          const PROGRAM='pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA';
          const RPCS=['https://api.mainnet-beta.solana.com','https://rpc.solanatracker.io/public','https://solana-rpc.publicnode.com'];
          let id=1; const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function req(u,m,p,n=3){let e;for(let a=0;a<n;a++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-readonly-vqr-scan/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});if(r.status===429||r.status>=500){e=Error('HTTP '+r.status);await sleep(300+350*a);continue}if(!r.ok)throw Error('HTTP '+r.status);const x=await r.json();if(x.error)throw Error(JSON.stringify(x.error));return x.result}catch(x){e=x;await sleep(250)}}throw e}
          let rows=null,rpcUsed=null;
          for(const u of RPCS){try{rows=await req(u,'getProgramAccounts',[PROGRAM,{encoding:'base64',commitment:'confirmed',filters:[{dataSize:301},{memcmp:{offset:243,bytes:'2'}}],dataSlice:{offset:0,length:253}}],2);rpcUsed=u;console.log('GPA_OK',u,'rows',rows.length);break}catch(e){console.log('GPA_FAIL',u,String(e).slice(0,250))}}
          if(!rows)throw Error('all GPA RPCs failed');
          const parsed=[];
          for(const r of rows){const b=Buffer.from(r.account.data[0],'base64');if(b.length<253||b[243]!==1)continue;parsed.push({pool:r.pubkey,creator:bs58.encode(b.subarray(11,43)),baseMint:bs58.encode(b.subarray(43,75)),quoteMint:bs58.encode(b.subarray(75,107)),poolBase:bs58.encode(b.subarray(139,171)),poolQuote:bs58.encode(b.subarray(171,203)),coinCreator:bs58.encode(b.subarray(211,243)),isMayhem:b[243],isCashback:b[244],virtualQuoteReserves:b.readBigUInt64LE(245).toString()});}
          const positives=parsed.filter(x=>BigInt(x.virtualQuoteReserves)>0n);
          console.log('SUMMARY',JSON.stringify({rpcUsed,totalMayhem:parsed.length,nonzeroVirtual:positives.length,zeroVirtual:parsed.length-positives.length},null,2));
          positives.sort((a,b)=>BigInt(a.virtualQuoteReserves)>BigInt(b.virtualQuoteReserves)?-1:BigInt(a.virtualQuoteReserves)<BigInt(b.virtualQuoteReserves)?1:0);
          console.log('TOP_RAW_VQR',JSON.stringify(positives.slice(0,100),null,2));
          if(!positives.length)process.exit(0);
          const targets=positives.slice(0,100);
          const balances=new Map();
          for(let off=0;off<targets.length;off+=100){const batch=targets.slice(off,off+100);let vals=null;for(const u of RPCS){try{vals=(await req(u,'getMultipleAccounts',[batch.map(x=>x.poolQuote),{encoding:'base64',commitment:'confirmed'}],2)).value;break}catch(e){console.log('MULTI_FAIL',u,String(e).slice(0,180))}}if(!vals)continue;for(let i=0;i<batch.length;i++){const a=vals[i];if(!a)continue;const d=Buffer.from(a.data[0],'base64');if(d.length>=72)balances.set(batch[i].pool,{quoteAmount:d.readBigUInt64LE(64).toString(),quoteProgram:a.owner})}}
          const enriched=targets.map(x=>{const z=balances.get(x.pool)??{quoteAmount:'0',quoteProgram:null};const q=BigInt(z.quoteAmount),v=BigInt(x.virtualQuoteReserves);return {...x,...z,virtualToRealPpm:q?((v*1000000n)/q).toString():null}}).sort((a,b)=>{const A=a.virtualToRealPpm==null?-1n:BigInt(a.virtualToRealPpm),B=b.virtualToRealPpm==null?-1n:BigInt(b.virtualToRealPpm);return A>B?-1:A<B?1:0});
          console.log('TOP_RATIO',JSON.stringify(enriched.slice(0,50),null,2));
          // Decode the most extreme currently-live accounts through the official SDK as a sanity check.
          const conn=new Connection(rpcUsed,'confirmed');const online=new OnlinePumpAmmSdk(conn);
          for(const x of enriched.slice(0,10)){try{const p=await online.fetchPool(new PublicKey(x.pool));console.log('SDK_DECODE',x.pool,JSON.stringify({isMayhemMode:p.isMayhemMode,isCashbackCoin:p.isCashbackCoin,virtualQuoteReserves:p.virtualQuoteReserves?.toString?.(),creator:p.creator.toBase58(),coinCreator:p.coinCreator.toBase58(),baseMint:p.baseMint.toBase58(),quoteMint:p.quoteMint.toBase58()},null,2))}catch(e){console.log('SDK_DECODE_FAIL',x.pool,String(e).slice(0,250))}}
          NODE