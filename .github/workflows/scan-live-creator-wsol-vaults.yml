name: scan-live-creator-wsol-vaults
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/scan-live-creator-wsol-vaults.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @pump-fun/pump-swap-sdk@1.19.0 @solana/web3.js @solana/spl-token bs58
      - name: Find funded creator WSOL vaults
        shell: bash
        run: |
          cat > scan_creator_vaults.mjs <<'NODE'
          import fs from 'node:fs';import bs58pkg from 'bs58';
          import {PublicKey} from '@solana/web3.js';
          import {NATIVE_MINT,TOKEN_PROGRAM_ID} from '@solana/spl-token';
          import {PUMP_AMM_PROGRAM_ID,coinCreatorVaultAuthorityPda,coinCreatorVaultAtaPda} from '@pump-fun/pump-swap-sdk';
          const bs58=bs58pkg.default??bs58pkg;
          const RPCS=['https://api.mainnet-beta.solana.com','https://rpc.solanatracker.io/public','https://solana-rpc.publicnode.com','https://solana.public-rpc.com'];let id=1;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function one(u,m,p,n=5){let e;for(let a=0;a<n;a++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-readonly/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});if(r.status===429||r.status>=500){e=new Error('HTTP '+r.status);await sleep(500+700*a);continue}const x=await r.json();if(x.error){e=new Error(JSON.stringify(x.error));break}return x.result}catch(x){e=x;await sleep(500+700*a)}}throw e}
          async function call(m,p){let e;for(const u of RPCS){try{const x=await one(u,m,p);console.log('RPC_OK',m,u);return x}catch(x){e=x;console.log('RPC_FAIL',m,u,String(x).slice(0,180))}}throw e}
          const idl=JSON.parse(fs.readFileSync('node_modules/@pump-fun/pump-swap-sdk/src/idl/pump_amm.json','utf8'));const disc=idl.accounts.find(x=>x.name.toLowerCase()==='pool').discriminator;const disc58=bs58.encode(Buffer.from(disc));
          const rows=await call('getProgramAccounts',[PUMP_AMM_PROGRAM_ID.toBase58(),{commitment:'confirmed',encoding:'base64',filters:[{dataSize:300},{memcmp:{offset:0,bytes:disc58}},{memcmp:{offset:75,bytes:NATIVE_MINT.toBase58()}}],dataSlice:{offset:211,length:32}}]);
          const zero=PublicKey.default.toBase58(),poolCounts=new Map();
          for(const r of rows??[]){const d=Buffer.from(r.account.data[0],'base64');if(d.length!==32)continue;const c=bs58.encode(d);if(c===zero)continue;poolCounts.set(c,(poolCounts.get(c)??0)+1)}
          const creators=[...poolCounts.keys()];console.log('WSOL_POOL_ROWS',rows.length,'NONZERO_CREATOR_UNIQUE',creators.length,'NONZERO_CREATOR_POOL_ROWS',[...poolCounts.values()].reduce((a,b)=>a+b,0));
          const vaults=creators.map(c=>{const creator=new PublicKey(c),auth=coinCreatorVaultAuthorityPda(creator),ata=coinCreatorVaultAtaPda(auth,NATIVE_MINT,TOKEN_PROGRAM_ID);return{creator:c,auth:auth.toBase58(),ata:ata.toBase58(),pools:poolCounts.get(c)}});
          const funded=[];let done=0;
          for(let i=0;i<vaults.length;i+=400){const window=vaults.slice(i,i+400);const chunks=[];for(let j=0;j<window.length;j+=100)chunks.push(window.slice(j,j+100));const responses=[];
            for(const ch of chunks){let got=null,last;for(const u of RPCS){try{got=await one(u,'getMultipleAccounts',[ch.map(x=>x.ata),{encoding:'base64',commitment:'confirmed',dataSlice:{offset:64,length:8}}]);break}catch(e){last=e}}if(!got)throw last;responses.push(got);await sleep(120)}
            let q=0;for(const resp of responses){for(const a of resp.value){const x=window[q++];if(!a)continue;const d=Buffer.from(a.data[0],'base64');if(d.length<8)continue;const amount=d.readBigUInt64LE(0);if(amount>0n)funded.push({...x,amount:amount.toString()})}}
            done+=window.length;if(done%4000<400||done===vaults.length)console.log('PROGRESS',done,'/',vaults.length,'FUNDED',funded.length);await sleep(250)}
          funded.sort((a,b)=>BigInt(a.amount)>BigInt(b.amount)?-1:BigInt(a.amount)<BigInt(b.amount)?1:0);
          const total=funded.reduce((s,x)=>s+BigInt(x.amount),0n);console.log('FUNDED_VAULT_COUNT',funded.length,'TOTAL_WSOL_LAMPORTS',total.toString(),'TOTAL_SOL',Number(total)/1e9);
          console.log('TOP_FUNDED_CREATOR_VAULTS',JSON.stringify(funded.slice(0,30),null,2));
          NODE
          node scan_creator_vaults.mjs