name: boost-lp-holder-history
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/boost-lp-holder-history.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - shell: bash
        run: |
          node --input-type=module <<'NODE'
          const mint='28EQ4ZxYemsyWyffL1R2fpQi3q86aUjDnVxFViwuf7H1',supply=4193388282604n;
          const RPCS=['https://rpc.solanatracker.io/public','https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com'];let id=1;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function req(u,m,p){const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});if(!r.ok)throw Error('HTTP '+r.status);const x=await r.json();if(x.error)throw Error(JSON.stringify(x.error));return x.result}
          async function call(m,p){let e;for(const u of RPCS){try{const x=await req(u,m,p);console.log('RPC',m,u);return x}catch(x){e=x;console.log('FAIL',m,u,String(x).slice(0,160))}}throw e}
          const sigs=await call('getSignaturesForAddress',[mint,{limit:40,commitment:'confirmed'}]);console.log('SIGS',sigs.length);
          const seen=new Map();
          for(const s of sigs){let tx=null;for(const u of RPCS){try{tx=await req(u,'getTransaction',[s.signature,{encoding:'jsonParsed',commitment:'confirmed',maxSupportedTransactionVersion:0}]);if(tx)break}catch(e){console.log('TX_FAIL',u,String(e).slice(0,120))}}if(!tx)continue;const keys=tx.transaction.message.accountKeys.map(x=>typeof x==='string'?x:x.pubkey);for(const z of tx.meta?.postTokenBalances??[]){if(z.mint!==mint)continue;const amount=BigInt(z.uiTokenAmount?.amount??'0'),ta=keys[z.accountIndex],owner=z.owner??null;const prev=seen.get(ta);if(!prev||amount>BigInt(prev.amount))seen.set(ta,{tokenAccount:ta,owner,amount:amount.toString(),signature:s.signature,slot:s.slot});}}
          const rows=[...seen.values()].sort((a,b)=>BigInt(a.amount)>BigInt(b.amount)?-1:1);console.log('HISTORY_ROWS',rows.length);for(const r of rows.slice(0,30))console.log('HIST_HOLDER',JSON.stringify({...r,sharePct:Number(BigInt(r.amount)*1000000n/supply)/10000}));
          // Refresh every discovered token account directly for current amount/owner.
          for(const r of rows.slice(0,30)){if(!r.tokenAccount)continue;try{const a=(await call('getAccountInfo',[r.tokenAccount,{encoding:'base64',commitment:'confirmed'}])).value;if(!a){console.log('CURRENT',JSON.stringify({...r,exists:false}));continue}const d=Buffer.from(a.data[0],'base64'),amount=d.length>=72?d.readBigUInt64LE(64):0n;console.log('CURRENT',JSON.stringify({tokenAccount:r.tokenAccount,owner:r.owner,amount:amount.toString(),sharePct:Number(amount*1000000n/supply)/10000,program:a.owner}))}catch(e){}}
          NODE