name: PumpSwap BOOST Liquidity Rounding
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths:
      - audit/boost_liquidity_rounding_probe.mjs
      - .github/workflows/boost-liquidity-rounding.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save @solana/web3.js@1.98.4 @solana/spl-token@0.4.14
      - run: node audit/boost_liquidity_rounding_probe.mjs
