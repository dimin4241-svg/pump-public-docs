name: mayhem-trade-sample-paged
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save bs58
      - name: Paged read-only representative trade sample
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import bs58pkg from 'bs58';const bs58=bs58pkg.default??bs58pkg;
          const P='MAyhSmzXzV1pTf7LsNkrNwkWKTo4ougAJ1PPg47MD4e', WANT={'c2951c220e7467d6':'buy_v2','ae123813f63bd1bc':'sell_v2','66063d1201daebea':'buy','33e685a4017f83ad':'sell'};
          const RPCS=['https://rpc.solanatracker.io/public','https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com'];let id=1;const sl=m=>new Promise(r=>setTimeout(r,m));
          async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-bounty-readonly-paged-sample/1.0'},body:JSON.stringify(b)});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}
          async function single(method,params){let e;for(const u of RPCS){try{const j=await post(u,{jsonrpc:'2.0',id:id++,method,params});if(j.error)throw Error(JSON.stringify(j.error));return j.result}catch(x){e=x;console.log('FAIL',method,u,String(x).slice(0,120));await sl(200)}}throw e}
          let sigs=[],before;for(let page=0;page<7;page++){const a=await single('getSignaturesForAddress',[P,{limit:100,commitment:'confirmed',...(before?{before}:{})}]);if(!a.length)break;sigs.push(...a.filter(x=>!x.err).map(x=>x.signature));before=a[a.length-1].signature;console.log('PAGE',page,'OK',sigs.length);await sl(120)}
          const found={};
          for(let off=0;off<sigs.length&&Object.keys(found).length<4;off+=8){let rows=null;for(const u of RPCS){try{const req=sigs.slice(off,off+8).map(sig=>({jsonrpc:'2.0',id:id++,method:'getTransaction',params:[sig,{encoding:'json',commitment:'confirmed',maxSupportedTransactionVersion:0}]}));const out=await post(u,req);if(!Array.isArray(out))throw Error('non-array');const bm=new Map(out.map(x=>[x.id,x.result]));rows=req.map(x=>bm.get(x.id));break}catch(e){console.log('BATCH',off,u,String(e).slice(0,130));await sl(250)}}if(!rows)continue;
            for(let j=0;j<rows.length;j++){const tx=rows[j];if(!tx||tx.meta?.err)continue;const flat=[...tx.transaction.message.accountKeys,...(tx.meta.loadedAddresses?.writable??[]),...(tx.meta.loadedAddresses?.readonly??[])];for(const [ixIdx,ix] of tx.transaction.message.instructions.entries()){if(flat[ix.programIdIndex]!==P)continue;let b;try{b=Buffer.from(bs58.decode(ix.data))}catch{continue}const d=b.subarray(0,8).toString('hex'),name=WANT[d];if(!name||found[name])continue;found[name]={signature:sigs[off+j],slot:tx.slot,blockTime:tx.blockTime,ixIdx,dataHex:b.toString('hex'),accountIndexes:ix.accounts,accountKeys:flat,header:tx.transaction.message.header,loadedAddresses:tx.meta.loadedAddresses,inner:(tx.meta.innerInstructions??[]).find(g=>g.index===ixIdx)?.instructions??[],logs:tx.meta.logMessages??[]};console.log('FOUND',name,JSON.stringify(found[name],null,2));}}
            if(off%40===0)console.log('PROGRESS',off,Object.keys(found));await sl(120)
          }
          console.log('FINAL',JSON.stringify(found,null,2));
          NODE
