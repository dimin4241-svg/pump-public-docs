name: PumpSwap funded init_boost Devnet proof

on:
  push:
    branches:
      - research/boost-auth-devnet
    paths:
      - "research/init-boost-funded/**"
      - "idl/pump_amm.json"
      - ".github/workflows/init-boost-funded-devnet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  funded-init-boost:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install isolated harness dependencies
        working-directory: research/init-boost-funded
        run: npm install --no-audit --no-fund

      - name: Simulate funded foreign-signer init_boost on Devnet only
        working-directory: research/init-boost-funded
        env:
          DEVNET_RPC: https://api.devnet.solana.com
        run: node devnet-init-boost-funded.mjs
