name: Pump V2 cross-quote buy Devnet proof

on:
  push:
    branches: [research/boost-auth-devnet]
    paths:
      - "research/cross-quote-buy-v2/**"
      - "idl/pump.json"
      - ".github/workflows/cross-quote-buy-v2-devnet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-quote-buy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install isolated dependencies
        working-directory: research/cross-quote-buy-v2
        run: npm install --no-audit --no-fund
      - name: Run Devnet-only wrong-quote simulation
        working-directory: research/cross-quote-buy-v2
        env:
          DEVNET_RPC: https://api.devnet.solana.com
        run: node probe.mjs
