name: mayhem-v2-cpi-target-mutation
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save @solana/web3.js bs58
      - name: Simulation-only BuyV2/SellV2 CPI target mutation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {PublicKey,TransactionInstruction,TransactionMessage,VersionedTransaction,AddressLookupTableAccount} from '@solana/web3.js';
          import bs58pkg from 'bs58'; const bs58=bs58pkg.default??bs58pkg;
          const MAY='MAyhSmzXzV1pTf7LsNkrNwkWKTo4ougAJ1PPg47MD4e',ALT='39azUYFWPz3VHgKCf3VChUwbpURdCHRxjWVowf5jUJjg',SYSTEM='11111111111111111111111111111111';
          const PUMP='6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P',PUMP_EA='Ce6TQqeHC9p8KetsN6JsjHK7UTZk7nasjjnr7XxXp9F1',PFEE='pfeeUxB6jkeY1Hxd7CsFCAjcbHA9rWtchMGdZ6VojVZ';
          const TOKEN22='TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb',TOKEN='TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA',ATA='ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL';
          const CASES={sell_v2:{sig:'4ed43uMUCqNjMcrqcLuMCsjYy2qCdzRVQ7d5HyyBZ2MdQ8Rcs58YxcPfoTMjRwWAnEJLvzdT9Yjwwo17C8wotVQE',disc:'5df6823ce7e940b2'},buy_v2:{sig:'4frcMBVQpK9fw4in9N3DiqDikckASrZ8Mt4rdwmngBYmesWbHq3LF3e11yC4mtDT2W3Sp4K9Po9WXkEdRtBJEgoG',disc:'b817ee6167c5d33d'}};
          const RPCS=['https://api.mainnet-beta.solana.com','https://rpc.solanatracker.io/public','https://solana-rpc.publicnode.com'];let id=1;const sl=m=>new Promise(r=>setTimeout(r,m));
          async function q(u,m,p,n=4){let e;for(let i=0;i<n;i++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-simulation-only-v2-targets/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});if(r.status===429||r.status>=500){e=Error('HTTP '+r.status);await sl(300+500*i);continue}const j=await r.json();if(j.error)throw Error(JSON.stringify(j.error));return j.result}catch(x){e=x;await sl(170)}}throw e}
          async function call(m,p){let e;for(const u of RPCS){try{return await q(u,m,p)}catch(x){e=x;console.log('RPCFAIL',m,u,String(x).slice(0,160))}}throw e}
          async function loadAlts(lookups){const out=[];for(const l of lookups??[]){const k=typeof l.accountKey==='string'?l.accountKey:l.accountKey?.toString?.();const a=(await call('getAccountInfo',[k,{encoding:'base64',commitment:'confirmed'}])).value;if(!a)throw Error('ALT missing '+k);out.push(new AddressLookupTableAccount({key:new PublicKey(k),state:AddressLookupTableAccount.deserialize(Buffer.from(a.data[0],'base64'))}));}return out}
          async function source(c){const tx=await call('getTransaction',[c.sig,{encoding:'json',commitment:'confirmed',maxSupportedTransactionVersion:0}]);if(!tx)throw Error('source missing');const msg=tx.transaction.message,staticKeys=msg.accountKeys,loaded=[...(tx.meta.loadedAddresses?.writable??[]),...(tx.meta.loadedAddresses?.readonly??[])],flat=[...staticKeys,...loaded],h=msg.header,nStatic=staticKeys.length,nw=(tx.meta.loadedAddresses?.writable??[]).length;const flags=i=>{const isSigner=i<h.numRequiredSignatures;let isWritable=false;if(i<nStatic){const sw=h.numRequiredSignatures-h.numReadonlySignedAccounts,uw=nStatic-h.numReadonlyUnsignedAccounts;isWritable=isSigner?i<sw:i<uw}else if(i<nStatic+nw)isWritable=true;return {isSigner,isWritable}};const alts=await loadAlts(msg.addressTableLookups);for(const ix of msg.instructions){if(flat[ix.programIdIndex]!==MAY)continue;const raw=Buffer.from(bs58.decode(ix.data));if(raw.subarray(0,8).toString('hex')!==c.disc)continue;return {raw,alts,base:ix.accounts.map((idx,pos)=>({pos,index:idx,pubkey:flat[idx],...flags(idx)}))}}throw Error('source ix missing')}
          const mutate=(base,kind)=>base.map(a=>{let p=a.pubkey;if(kind==='pump_program'&&p===PUMP)p=SYSTEM;if(kind==='pump_event_authority'&&p===PUMP_EA)p=ALT;if(kind==='fee_program'&&p===PFEE)p=SYSTEM;if(kind==='token22_program'&&p===TOKEN22)p=SYSTEM;if(kind==='token_program'&&p===TOKEN)p=SYSTEM;if(kind==='associated_token_program'&&p===ATA)p=SYSTEM;return {pubkey:new PublicKey(p),isSigner:a.isSigner,isWritable:a.isWritable}});
          async function sim(name,src,kind){const ix=new TransactionInstruction({programId:new PublicKey(MAY),keys:mutate(src.base,kind),data:src.raw});const bh=(await call('getLatestBlockhash',[{commitment:'confirmed'}])).value.blockhash;const message=new TransactionMessage({payerKey:new PublicKey(ALT),recentBlockhash:bh,instructions:[ix]}).compileToV0Message(src.alts);const tx=new VersionedTransaction(message),raw=Buffer.from(tx.serialize()).toString('base64');console.log('SERIALIZED',name,kind,Buffer.from(tx.serialize()).length,'static',message.staticAccountKeys.length,'lookups',message.addressTableLookups.length);let v,used;for(const u of RPCS){try{v=(await q(u,'simulateTransaction',[raw,{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'confirmed'}],3)).value;used=u;break}catch(e){console.log('SIMFAIL',name,kind,u,String(e).slice(0,180))}}if(!v)return {name,kind,noSim:true};const logs=v.logs??[];const r={name,kind,rpc:used,err:v.err,units:v.unitsConsumed,instructions:logs.filter(x=>x.includes('Instruction:')),invokes:logs.filter(x=>/Program .* invoke/.test(x)),anchor:logs.filter(x=>/AnchorError|Error Code|Error Number|Left:|Right:/.test(x)),failed:logs.filter(x=>x.includes('failed:')),interesting:logs.filter(x=>/InvalidProgram|Program ID|ConstraintAddress|Permission|Signer|Pump|BuyV2|SellV2|Trade|Risk|paused|reserves|token_program|associated/i.test(x))};console.log('RESULT',JSON.stringify(r,null,2));return r}
          const kinds=['canonical','pump_program','pump_event_authority','fee_program','token22_program','token_program','associated_token_program'];const out={};for(const [name,c] of Object.entries(CASES)){const src=await source(c);console.log('SOURCE',name,JSON.stringify(src.base,null,2));out[name]={};for(const kind of kinds){out[name][kind]=await sim(name,src,kind);await sl(220)}}console.log('SUMMARY',JSON.stringify(out,null,2));
          NODE
