name: fee-config-optional-none-runtime
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/fee-config-optional-none-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @pump-fun/pump-swap-sdk@1.19.0 @solana/web3.js @solana/spl-token bn.js
      - shell: bash
        run: |
          cat > optional_fee.mjs <<'NODE'
          import BN from 'bn.js';
          import {Connection,PublicKey,Transaction,TransactionInstruction,ComputeBudgetProgram,SystemProgram} from '@solana/web3.js';
          import {AccountLayout,getAssociatedTokenAddressSync,createAssociatedTokenAccountIdempotentInstruction,createSyncNativeInstruction,TOKEN_PROGRAM_ID} from '@solana/spl-token';
          import {OnlinePumpAmmSdk,PUMP_AMM_SDK,pumpAmmJson} from '@pump-fun/pump-swap-sdk';
          const AMM=new PublicKey('pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA'),FEE_PROGRAM=new PublicKey('pfeeUxB6jkeY1Hxd7CsFCAjcbHA9rWtchMGdZ6VojVZ'),POOL=new PublicKey('3EUUwdSpEXap46NB6n5Mmt3U8XM8vW8HPCLtJDoGzw33'),USER=new PublicKey('39azUYFWPz3VHgKCf3VChUwbpURdCHRxjWVowf5jUJjg');
          const RPCS=['https://rpc.solanatracker.io/public','https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com'];let id=1;const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function raw(u,m,p,n=4){let e;for(let a=0;a<n;a++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-simulation-only/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});if(r.status===429||r.status>=500){e=Error('HTTP '+r.status);await sleep(250+400*a);continue}const x=await r.json();if(x.error){e=Error(JSON.stringify(x.error));if(/429|No response|Too many/i.test(String(e))){await sleep(250+400*a);continue}throw e}return x.result}catch(x){e=x;await sleep(160)}}throw e}async function call(m,p){let e;for(const u of RPCS){try{return await raw(u,m,p)}catch(x){e=x;console.log('RPC_FAIL',m,u,String(x).slice(0,170))}}throw e}
          function clone(ix,pk=null,idx=-1){return new TransactionInstruction({programId:ix.programId,data:Buffer.from(ix.data),keys:ix.keys.map((k,i)=>i===idx&&pk?{...k,pubkey:pk}:{...k})})}function tok(a){if(!a)return null;const b=Buffer.from(a.data[0],'base64');if(b.length<72)return null;try{return AccountLayout.decode(b).amount.toString()}catch{return null}}
          let conn=null;for(const u of RPCS){try{const c=new Connection(u,'confirmed');await c.getLatestBlockhash();conn=c;break}catch{}}if(!conn)throw Error('no rpc');const state=await new OnlinePumpAmmSdk(conn).swapSolanaState(POOL,USER);const userBase=getAssociatedTokenAddressSync(state.pool.baseMint,USER,false,state.baseTokenProgram),userQuote=getAssociatedTokenAddressSync(state.pool.quoteMint,USER,false,state.quoteTokenProgram);
          const built=await PUMP_AMM_SDK.buyQuoteInput(state,new BN('1000000'),5),def=pumpAmmJson.instructions.find(i=>i.name==='buy'),disc=Buffer.from(def.discriminator),bi=built.findIndex(ix=>ix.programId.equals(AMM)&&ix.data.length>=8&&Buffer.from(ix.data.subarray(0,8)).equals(disc));if(bi<0)throw Error('buy missing');const buy=built[bi],names=def.accounts.map(a=>a.name),fi=names.indexOf('fee_config'),pri=names.indexOf('protocol_fee_recipient_token_account'),cci=names.indexOf('coin_creator_vault_ata');const canonical=buy.keys[fi].pubkey,protocolAta=buy.keys[pri].pubkey,creatorAta=buy.keys[cci].pubkey;
          console.log('META',JSON.stringify({fi,canonical:canonical.toBase58(),ammSentinel:AMM.toBase58(),feeProgramSentinel:FEE_PROGRAM.toBase58(),systemSentinel:SystemProgram.programId.toBase58(),optional:def.accounts[fi].optional??false,names},null,2));
          const cases={control:clone(buy),none_amm:clone(buy,AMM,fi),fee_program_key:clone(buy,FEE_PROGRAM,fi),system_key:clone(buy,SystemProgram.programId,fi)};const prefix=built.slice(0,bi),suffix=built.slice(bi+1),bh=(await call('getLatestBlockhash',[{commitment:'confirmed'}])).value.blockhash;
          async function sim(name,ix){const setup=[createAssociatedTokenAccountIdempotentInstruction(USER,userBase,USER,state.pool.baseMint,state.baseTokenProgram),createAssociatedTokenAccountIdempotentInstruction(USER,userQuote,USER,state.pool.quoteMint,state.quoteTokenProgram),SystemProgram.transfer({fromPubkey:USER,toPubkey:userQuote,lamports:20_000_000}),createSyncNativeInstruction(userQuote,TOKEN_PROGRAM_ID)];const tx=new Transaction({feePayer:USER,recentBlockhash:bh}).add(ComputeBudgetProgram.setComputeUnitLimit({units:1_400_000}),...setup,...prefix,ix,...suffix);const bytes=tx.serialize({requireAllSignatures:false,verifySignatures:false});const watch=[state.pool.poolBaseTokenAccount,state.pool.poolQuoteTokenAccount,userBase,userQuote,protocolAta,creatorAta];let v=null,rpc=null;for(const u of RPCS){try{v=(await raw(u,'simulateTransaction',[bytes.toString('base64'),{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'confirmed',accounts:{encoding:'base64',addresses:watch.map(x=>x.toBase58())}}],3)).value;rpc=u;break}catch(e){console.log('SIM_FAIL',name,u,String(e).slice(0,180))}}if(!v)return {rpc:'fail'};const l=v.logs??[],a=v.accounts??[];const out={rpc,err:v.err,units:v.unitsConsumed,amounts:{poolBase:tok(a[0]),poolQuote:tok(a[1]),userBase:tok(a[2]),userQuote:tok(a[3]),protocolFee:tok(a[4]),creatorFee:tok(a[5])},fees:l.filter(s=>s.includes('Instruction: GetFees')||s.includes('Program return: pfeeUx')),anchor:l.filter(s=>s.includes('AnchorError')||s.includes('Error Code:')),failed:l.filter(s=>s.includes('failed:')),instructions:l.filter(s=>s.includes('Instruction:'))};console.log('CASE',name,JSON.stringify(out,null,2));if(v.err)for(const s of l)console.log('ERRLOG',name,s);return out}
          const out={};for(const [n,ix] of Object.entries(cases))out[n]=await sim(n,ix);console.log('DECISIVE',JSON.stringify(Object.fromEntries(Object.entries(out).map(([n,x])=>[n,{err:x.err??x.rpc??null,amounts:x.amounts??null,fees:x.fees??[],anchor:x.anchor??[],failed:x.failed??[]}])) ,null,2));
          NODE
          node optional_fee.mjs