name: Resolve renewed subscription source and purchase semantics v210

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact package and decompile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/okko
          curl --location --fail --retry 2 --silent --show-error --output /tmp/okko/okko.pkg \
            'https://static.rustore.ru/2026/8/14/7b/de764e6d-0184-4e0f-a7c6-0b6a30580a79.zip'
          python3 - <<'PY'
          import hashlib,shutil,zipfile
          from pathlib import Path
          p=Path('/tmp/okko/okko.pkg');h=hashlib.sha256();n=0
          with p.open('rb') as f:
              for b in iter(lambda:f.read(1024*1024),b''):n+=len(b);h.update(b)
          assert n==45942514 and h.hexdigest()=='b00bca9cb327ab3ee483b46d390c9120ac28bfc7674c75fda0129c6c594cc1f9'
          with zipfile.ZipFile(p) as z:
              apks=[x for x in z.infolist() if x.filename.lower().endswith('.apk')];assert len(apks)==1
              with z.open(apks[0]) as src,open('/tmp/okko/okko.apk','wb') as dst:shutil.copyfileobj(src,dst,1024*1024)
          PY
          URL=$(python3 - <<'PY'
          import json,urllib.request
          d=json.load(urllib.request.urlopen('https://api.github.com/repos/skylot/jadx/releases/latest',timeout=30))
          print([a['browser_download_url'] for a in d['assets'] if a['name'].startswith('jadx-') and a['name'].endswith('.zip')][0])
          PY
          )
          curl -L --fail --retry 2 "$URL" -o /tmp/jadx.zip
          mkdir -p /tmp/jadx && unzip -q /tmp/jadx.zip -d /tmp/jadx && chmod +x /tmp/jadx/bin/jadx
          /tmp/jadx/bin/jadx --no-res --no-imports --show-bad-code --threads-count 4 -d /tmp/okko/jadx /tmp/okko/okko.apk >/tmp/jadx.stdout 2>/tmp/jadx.stderr || true
          test -d /tmp/okko/jadx/sources
      - name: Trace renewed subscription source and state-changing semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          SRC=Path('/tmp/okko/jadx/sources');OUT=Path('/tmp/okko-v210.json')
          FIRST=('ru/okko/','ru/more/play/','p003nskobfuscated/','nskobfuscated/')
          STR=re.compile(r'"([^"\\]*(?:\\.[^"\\]*)*)"')
          SAFE={'renewedUserSubscriptionId','upgradedUserSubscriptionIds','userSubscriptionId','subscriptionId','forcedUpgradeSubscriptionId','paymentToken','orderId','client_type'}
          def rel(p):return str(p.relative_to(SRC)).replace('\\','/')
          def rd(p):return p.read_text(encoding='utf-8',errors='replace')
          def red(s):return STR.sub(lambda m:'"'+m.group(1)+'"' if m.group(1) in SAFE else '"<lit>"',s)[:22000]
          def one(path,base):
              p=SRC/path
              if p.is_file():return p
              r=[x for x in SRC.rglob(base) if str(x).replace('\\','/').endswith(str(path).replace('\\','/'))] or list(SRC.rglob(base))
              if len(r)!=1:raise SystemExit(f'{base}:{len(r)}')
              return r[0]
          def match(t,op,L='(',R=')'):
              d=0;q=None;e=False
              for i in range(op,len(t)):
                  c=t[i]
                  if q:
                      if e:e=False
                      elif c=='\\':e=True
                      elif c==q:q=None
                      continue
                  if c in ('"',"'"):q=c;continue
                  if c==L:d+=1
                  elif c==R:
                      d-=1
                      if d==0:return i
              return None
          def split(s):
              out=[];st=0;dp=db=ds=da=0;q=None;e=False
              for i,c in enumerate(s):
                  if q:
                      if e:e=False
                      elif c=='\\':e=True
                      elif c==q:q=None
                      continue
                  if c in ('"',"'"):q=c
                  elif c=='(':dp+=1
                  elif c==')':dp-=1
                  elif c=='{':db+=1
                  elif c=='}':db-=1
                  elif c=='[':ds+=1
                  elif c==']':ds-=1
                  elif c=='<':da+=1
                  elif c=='>':da=max(0,da-1)
                  elif c==',' and dp==db==ds==da==0:out.append(s[st:i].strip());st=i+1
              out.append(s[st:].strip());return [x for x in out if x]
          def methods(t):
              out=[];rx=re.compile(r'(?m)^\s*(?:(?:public|private|protected|static|final|synchronized|native|abstract|default)\s+)+[^;={}]{1,4400}?\s+([A-Za-z_$][\w$]*)\s*\(([^;{}]*)\)\s*(?:throws [^{]+)?\{')
              for m in rx.finditer(t):
                  op=t.find('{',m.start(),m.end()+2);cp=match(t,op,'{','}') if op>=0 else None
                  if cp is not None:out.append({'start':m.start(),'end':cp+1,'name':m.group(1),'params':m.group(2),'sig':re.sub(r'\s+',' ',m.group(0)[:-1]).strip()[:4400]})
              return out
          def owner(ms,pos):
              r=[m for m in ms if m['start']<=pos<m['end']];return r[-1] if r else None
          def sl(t,pos,b=14,a=24):
              ls=t.splitlines();ln=t[:pos].count('\n')+1;lo=max(1,ln-b);hi=min(len(ls),ln+a)
              return {'line':ln,'text':'\n'.join(f'{i:05d}: {red(ls[i-1])}' for i in range(lo,hi+1))}
          def typemap(t):
              out={}
              for m in re.finditer(r'\b([A-Za-z_$][\w.$]*(?:<[^;={}()]+>)?)\s+([A-Za-z_$][\w$]*)\s*(?=[;=,)])',t):out[m.group(2)]=re.sub(r'<.*>','',m.group(1)).strip()
              return out

          # Classes identified by v209.
          psi=one(Path('ru/okko/sdk/domain/entity/payment/PaymentScreenInfo.java'),'PaymentScreenInfo.java')
          init=one(Path('ru/okko/feature/payment/common/library/tea/main/PaymentInitCommonEffectHandler.java'),'PaymentInitCommonEffectHandler.java')
          process=one(Path('ru/okko/feature/payment/common/library/tea/main/PaymentProcessCommonEffectHandler.java'),'PaymentProcessCommonEffectHandler.java')
          purchase=one(Path('ru/okko/sdk/domain/usecase/payment/PurchaseUseCase.java'),'PurchaseUseCase.java')
          complete=one(Path('ru/okko/sdk/domain/usecase/payment/CompletePurchaseUseCase.java'),'CompletePurchaseUseCase.java')
          api=one(Path('ru/okko/sdk/data/network/api/AuthScreenApi.java'),'AuthScreenApi.java')
          payrepo=one(Path('ru/okko/sdk/data/repository/PaymentRepositoryImpl.java'),'PaymentRepositoryImpl.java')

          # A. PaymentInitCommonEffectHandler.k caller graph and first string argument (renewed ID source).
          it=rd(init);ims=methods(it);k_method=[m for m in ims if m['name']=='k']
          ksig=k_method[0]['sig'] if k_method else None
          k_calls=[]
          for p in SRC.rglob('*.java'):
              rp=rel(p)
              if not rp.startswith(FIRST):continue
              try:t=rd(p)
              except:continue
              if '.k(' not in t and 'PaymentInitCommonEffectHandler' not in t:continue
              ms=methods(t);ft=typemap(t)
              for mo in ms:
                  body=t[mo['start']:mo['end']];types={**ft,**typemap(body)}
                  for cm in re.finditer(r'\b([A-Za-z_$][\w$]*)\.k\s*\(',body):
                      recv=cm.group(1);typ=types.get(recv,'')
                      if 'PaymentInitCommonEffectHandler' not in typ and 'PaymentInitCommonEffectHandler' not in body[max(0,cm.start()-1000):cm.start()+500]:continue
                      op=body.find('(',cm.start(),cm.end()+2);cp=match(body,op);args=split(body[op+1:cp]) if cp else []
                      pos=mo['start']+cm.start();k_calls.append({'path':rp,'owner':mo['sig'],'receiver_type':typ,'args':[red(x) for x in args],'slice':sl(t,pos,16,22)})

          # B. The effect object whose `.a.getRenewedUserSubscriptionId()` feeds k(). Identify class/constructors.
          effect_refs=[];effect_types=set()
          for p in SRC.rglob('*.java'):
              rp=rel(p)
              if not rp.startswith(FIRST):continue
              try:t=rd(p)
              except:continue
              if 'getRenewedUserSubscriptionId' not in t:continue
              ms=methods(t);ft=typemap(t)
              for mm in re.finditer(r'\b([A-Za-z_$][\w$]*)\.a\.getRenewedUserSubscriptionId\s*\(\s*\)',t):
                  recv=mm.group(1);typ=ft.get(recv,'');effect_types.add(typ)
                  mo=owner(ms,mm.start());effect_refs.append({'path':rp,'owner':mo['sig'] if mo else None,'receiver':recv,'receiver_type':typ,'slice':sl(t,mm.start(),14,20)})
          effect_models=[]
          for typ in sorted(x for x in effect_types if x):
              base=typ.split('.')[-1]+'.java';rows=list(SRC.rglob(base))
              for p in rows[:5]:
                  t=rd(p);effect_models.append({'type':typ,'path':rel(p),'shape':red(t[:30000]),'methods':[m['sig'] for m in methods(t)[:80]]})

          # C. All constructors/new objects containing PaymentScreenInfo and direct sources of renewed ID from UserSubscription.
          source_rows=[]
          source_rx=re.compile(r'(?i)(getUserSubscriptionId\s*\(|getForcedUpgradeSubscriptionId\s*\(|getRenewedUserSubscriptionId\s*\(|getSubscription\s*\(.*?getId\s*\()')
          for p in SRC.rglob('*.java'):
              rp=rel(p)
              if not rp.startswith(FIRST):continue
              try:t=rd(p)
              except:continue
              if not source_rx.search(t):continue
              ms=methods(t)
              for mm in source_rx.finditer(t):
                  around=t[max(0,mm.start()-5000):min(len(t),mm.start()+6500)]
                  if 'PaymentScreenInfo' not in around and 'renewedUserSubscriptionId' not in around:continue
                  mo=owner(ms,mm.start());source_rows.append({'path':rp,'marker':red(mm.group(0)),'owner':mo['sig'] if mo else None,'slice':sl(t,mm.start(),16,24)})

          # D. Purchase/CompletePurchase method bodies that accept renewed ID and product upgrade IDs, plus repository calls.
          purchase_flow=[]
          for p,label in [(purchase,'PurchaseUseCase'),(complete,'CompletePurchaseUseCase')]:
              t=rd(p);ms=methods(t)
              for mo in ms:
                  body=t[mo['start']:mo['end']]
                  if not re.search(r'(?i)(renewedUserSubscriptionId|upgradedUserSubscriptionIds|getUpgradedUserSubscriptionIds|getPaymentInfo|purchase\s*\()',body):continue
                  purchase_flow.append({'class':label,'path':rel(p),'signature':mo['sig'],'body':red(body)[:36000]})

          # E. PaymentRepository outer purchase/topup methods: prove selectors are caller params, not regenerated.
          prt=rd(payrepo);prms=methods(prt);repo_methods=[]
          for mo in prms:
              body=prt[mo['start']:mo['end']]
              if not re.search(r'(?i)(renewedUserSubscriptionId|upgradedUserSubscriptionIds)',body):continue
              if not re.search(r'(?i)(purchase\s*\(|topUp|purchaseBy|paymentInfo|getPaymentInfo)',mo['sig']+' '+body):continue
              repo_methods.append({'signature':mo['sig'],'body':red(body)[:32000]})

          # F. AuthScreenApi state-changing methods carrying subscription IDs; preserve exact query/field names.
          at=rd(api);state_endpoints=[]
          for hm in re.finditer(r'@(?:retrofit2\.http\.)?(POST|PUT|PATCH|DELETE)\s*\(\s*"([^"]*)"\s*\)',at):
              tail=at[hm.end():hm.end()+9000];semi=tail.find(';')
              if semi<0:continue
              decl=tail[:semi+1]
              if 'renewedUserSubscriptionId' not in decl and 'upgradedUserSubscriptionIds' not in decl:continue
              state_endpoints.append({'verb':hm.group(1),'route':hm.group(2),'declaration':red(decl)})

          # G. ProductResponse -> Product conversion. Find methods that read upgraded IDs and instantiate Product classes.
          product_convert=[]
          for p in SRC.rglob('*.java'):
              rp=rel(p)
              if not rp.startswith(FIRST):continue
              try:t=rd(p)
              except:continue
              if 'ProductResponse' not in t or 'getUpgradedUserSubscriptionIds' not in t:continue
              ms=methods(t)
              for mo in ms:
                  body=t[mo['start']:mo['end']]
                  if 'getUpgradedUserSubscriptionIds' in body and re.search(r'new\s+(?:ru\.okko\.sdk\.domain\.entity\.products\.)?Product',body):
                      product_convert.append({'path':rp,'signature':mo['sig'],'body':red(body)[:34000]})

          # H. Endpoints returning ProductResponse / product data around upgrade pricing. This helps classify IDs as server-returned account state.
          product_endpoints=[]
          for p in SRC.rglob('*.java'):
              rp=rel(p)
              if not rp.startswith(FIRST):continue
              try:t=rd(p)
              except:continue
              if '@GET(' not in t and '@retrofit2.http.GET(' not in t:continue
              for hm in re.finditer(r'@(?:retrofit2\.http\.)?GET\s*\(\s*"([^"]*)"\s*\)',t):
                  tail=t[hm.end():hm.end()+6000];semi=tail.find(';');decl=tail[:semi+1] if semi>=0 else tail[:3000]
                  if 'ProductResponse' in decl or re.search(r'(?i)(product|purchase|payment)',hm.group(1)) and 'ScreenApiResponse' in decl:
                      if re.search(r'(?i)(upgrade|subscription|product)',decl+hm.group(1)):
                          product_endpoints.append({'path':rp,'route':hm.group(1),'declaration':red(decl)})

          report={'status':'ok','run_rev':'v210.0-renewed-source-purchase-semantics','package_identity':{'version_name':'8.180.0','outer_bytes':45942514,'outer_sha256':'b00bca9cb327ab3ee483b46d390c9120ac28bfc7674c75fda0129c6c594cc1f9','apk_entry_count':1},'network_policy':{'okko_requests':0,'protected_requests':0,'runtime_started':False,'credentials_read':False,'mutations':0,'third_party_accounts':0,'identifier_enumeration':False,'static_only':True},'payment_init_k_signature':ksig,'payment_init_k_callers':k_calls[:100],'effect_references':effect_refs[:100],'effect_models':effect_models[:50],'subscription_to_payment_screen_sources':source_rows[:180],'purchase_flow':purchase_flow[:100],'payment_repository_selector_methods':repo_methods[:100],'state_changing_subscription_endpoints':state_endpoints,'product_response_to_domain_converters':product_convert[:50],'product_upgrade_endpoints':product_endpoints[:100],'summary':{'payment_init_k_caller_count':len(k_calls),'effect_reference_count':len(effect_refs),'subscription_payment_screen_source_count':len(source_rows),'purchase_flow_method_count':len(purchase_flow),'repository_selector_method_count':len(repo_methods),'state_changing_subscription_endpoint_count':len(state_endpoints),'product_converter_count':len(product_convert),'product_upgrade_endpoint_count':len(product_endpoints),'vulnerability_proven':False},'decision':{'vulnerability_proven':False,'reportable':False,'runtime_authorized':False,'next_action':'If renewed/upgraded IDs are proven to originate from the authenticated user subscription state and are forwarded unchanged into purchase/topup, the remaining gate is server ownership enforcement. Any validation must be approved and use only two researcher-owned subscriptions; do not perform state-changing cross-account purchase without explicit instruction.'}}
          OUT.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'summary':report['summary'],'k_callers':k_calls[:25],'effect_refs':effect_refs[:25],'sources':source_rows[:35],'purchase_flow':purchase_flow[:15],'state_endpoints':state_endpoints,'product_convert':product_convert[:10]},ensure_ascii=False,indent=2)[:180000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okko-paymentinfo-v210
          path: |
            /tmp/okko-v210.json
            /tmp/jadx.stderr
          retention-days: 7

# Exact static analysis only. Zero Okko target traffic, credentials, mutations or enumeration.
