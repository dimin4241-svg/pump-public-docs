name: mayhem-createv2-vault-sim
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/mayhem-createv2-vault-sim.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @pump-fun/pump-sdk@1.36.0 @solana/web3.js @solana/spl-token
      - name: Simulation-only create_v2 differentials
        shell: bash
        run: |
          cat > probe.mjs <<'NODE'
          import {PublicKey,Keypair,Transaction,TransactionInstruction,ComputeBudgetProgram,SystemProgram} from '@solana/web3.js';
          import {getAssociatedTokenAddressSync,TOKEN_2022_PROGRAM_ID} from '@solana/spl-token';
          import {PUMP_SDK,MAYHEM_PROGRAM_ID,getGlobalParamsPda,getMayhemStatePda,getSolVaultPda,getTokenVaultPda} from '@pump-fun/pump-sdk';

          const USER=new PublicKey('39azUYFWPz3VHgKCf3VChUwbpURdCHRxjWVowf5jUJjg');
          const FOREIGN_MINT=new PublicKey('C8D4bQyLzECPHXRmzHr539ZNJNTHiR9YEa4tioJcpump');
          const RPCS=['https://rpc.solanatracker.io/public','https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com'];
          let rid=1;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function raw(u,m,p,n=4){let e;for(let i=0;i<n;i++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-simulation-only/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:rid++,method:m,params:p})});if(r.status===429||r.status>=500){e=Error('HTTP '+r.status);await sleep(250+350*i);continue}const j=await r.json();if(j.error){e=Error(JSON.stringify(j.error));if(/429|No response|Too many/i.test(String(e))){await sleep(250+350*i);continue}throw e}return j.result}catch(x){e=x;await sleep(180)}}throw e}
          async function call(m,p){let e;for(const u of RPCS){try{return await raw(u,m,p)}catch(x){e=x;console.log('RPC_FAIL',m,u,String(x).slice(0,180))}}throw e}
          const info=(await call('getAccountInfo',[USER.toBase58(),{encoding:'base64',commitment:'confirmed'}])).value;
          console.log('USER',JSON.stringify({address:USER.toBase58(),exists:!!info,owner:info?.owner,lamports:info?.lamports}));
          if(!info||info.owner!==SystemProgram.programId.toBase58()) throw Error('simulation fee payer unavailable');

          const mint=Keypair.generate();
          const expected={program:MAYHEM_PROGRAM_ID,globalParams:getGlobalParamsPda(),solVault:getSolVaultPda(),mayhemState:getMayhemStatePda(mint.publicKey),mayhemTokenVault:getTokenVaultPda(mint.publicKey)};
          const userAta=getAssociatedTokenAddressSync(mint.publicKey,USER,true,TOKEN_2022_PROGRAM_ID);
          const foreignVault=getTokenVaultPda(FOREIGN_MINT);
          const random=Keypair.generate();
          const control=await PUMP_SDK.createV2Instruction({mint:mint.publicKey,name:'BB Sim Only',symbol:'BBSIM',uri:'https://example.invalid/bb-sim',creator:USER,user:USER,mayhemMode:true,cashback:false});
          const names=['mint','mint_authority','bonding_curve','associated_bonding_curve','global','user','system_program','token_program','associated_token_program','mayhem_program_id','global_params','sol_vault','mayhem_state','mayhem_token_vault','event_authority','program'];
          console.log('TARGETS',JSON.stringify({mint:mint.publicKey.toBase58(),userAta:userAta.toBase58(),foreignVault:foreignVault.toBase58(),random:random.publicKey.toBase58(),expected:Object.fromEntries(Object.entries(expected).map(([k,v])=>[k,v.toBase58()]))},null,2));
          console.log('CONTROL_KEYS',JSON.stringify(control.keys.map((k,i)=>({i,name:names[i]??'extra',p:k.pubkey.toBase58(),w:k.isWritable,s:k.isSigner})),null,2));
          function mutate(repls={}){return new TransactionInstruction({programId:control.programId,data:Buffer.from(control.data),keys:control.keys.map((k,i)=>{const r=repls[i];return r?{...k,...r}:{...k}})});}
          const cases={
            control,
            vault_random_unsigned:mutate({13:{pubkey:random.publicKey,isSigner:false,isWritable:true}}),
            vault_user_ata:mutate({13:{pubkey:userAta,isSigner:false,isWritable:true}}),
            vault_foreign_canonical:mutate({13:{pubkey:foreignVault,isSigner:false,isWritable:true}}),
            mayhem_state_random:mutate({12:{pubkey:random.publicKey,isSigner:false,isWritable:true}}),
            global_params_random:mutate({10:{pubkey:random.publicKey,isSigner:false,isWritable:false}}),
            mayhem_program_user:mutate({9:{pubkey:USER,isSigner:false,isWritable:true}})
          };
          const watch=[mint.publicKey,expected.mayhemState,expected.mayhemTokenVault,random.publicKey,userAta];
          async function sim(name,ix){
            const bh=(await call('getLatestBlockhash',[{commitment:'confirmed'}])).value.blockhash;
            const tx=new Transaction({feePayer:USER,recentBlockhash:bh}).add(ComputeBudgetProgram.setComputeUnitLimit({units:1_400_000}),ix);
            const bytes=tx.serialize({requireAllSignatures:false,verifySignatures:false});let v=null,used=null;
            for(const u of RPCS){try{v=(await raw(u,'simulateTransaction',[bytes.toString('base64'),{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'confirmed',accounts:{encoding:'base64',addresses:watch.map(x=>x.toBase58())}}],3)).value;used=u;break}catch(e){console.log('SIM_RPC_FAIL',name,u,String(e).slice(0,180))}}
            if(!v){console.log('RESULT',name,JSON.stringify({noSim:true}));return;}
            const logs=v.logs??[];console.log('RESULT',name,JSON.stringify({simulationOnly:true,broadcast:false,rpc:used,err:v.err,units:v.unitsConsumed,accounts:(v.accounts??[]).map((a,i)=>({address:watch[i].toBase58(),exists:!!a,owner:a?.owner??null,lamports:a?.lamports??null,dataLen:a?Buffer.from(a.data[0],'base64').length:null})),instructions:logs.filter(l=>l.includes('Instruction:')),anchor:logs.filter(l=>l.includes('AnchorError')||l.includes('Error Code:')||l.includes('Error Number:')),failed:logs.filter(l=>l.includes('failed:')),mayhem:logs.filter(l=>/mayhem|Mayhem|cpitialize/i.test(l))},null,2));
            for(const l of logs)if(/AnchorError|Error Code:|failed:|mayhem|Mayhem|Constraint|owner|seed|address/i.test(l))console.log('ERRLOG',name,l);
          }
          for(const [n,ix] of Object.entries(cases))await sim(n,ix);
          NODE
          node probe.mjs
