name: mayhem-burn-cross-state-runtime
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/mayhem-burn-cross-state-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @solana/web3.js @solana/spl-token @pump-fun/pump-sdk@1.36.0
      - name: Simulation-only cross-state and relation differential
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {PublicKey,TransactionInstruction,TransactionMessage,VersionedTransaction,Keypair} from '@solana/web3.js';
          import {TOKEN_PROGRAM_ID,TOKEN_2022_PROGRAM_ID} from '@solana/spl-token'; import * as pump from '@pump-fun/pump-sdk'; import crypto from 'node:crypto';
          const MINT=new PublicKey('5wGtQmhiJ3Gb8VBBbXno9byUzVmyeZ9dFuRt8EcQpump'),P=pump.MAYHEM_PROGRAM_ID,STATE=pump.getMayhemStatePda(MINT),VAULT=pump.getTokenVaultPda(MINT),SOLV=pump.getSolVaultPda(),BC=pump.bondingCurvePda(MINT),TRADER=new PublicKey('Gygj9QQby4j2jryqyqBHvLP7ctv2SaANgh4sCb69BUpA'),SYS=new PublicKey('11111111111111111111111111111111'),[EV]=PublicKey.findProgramAddressSync([Buffer.from('__event_authority')],P),disc=crypto.createHash('sha256').update('global:burn_tokens').digest().subarray(0,8),m=(p,s=false,w=false)=>({pubkey:p,isSigner:s,isWritable:w});
          const URL='https://api.mainnet-beta.solana.com';let id=1;async function rpc(method,params){const r=await fetch(URL,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-simulation-only-burn-cross-state/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method,params})});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j.error)throw Error(JSON.stringify(j.error));return j.result}
          const states=await rpc('getProgramAccounts',[P.toBase58(),{encoding:'base64',commitment:'confirmed',filters:[{dataSize:106}]}]);const other=states.find(x=>x.pubkey!==STATE.toBase58());if(!other)throw Error('no second state');const OTHER_STATE=new PublicKey(other.pubkey);console.log('STATE_PAIR',JSON.stringify({active:STATE.toBase58(),other:OTHER_STATE.toBase58(),totalStates:states.length},null,2));
          const bh=(await rpc('getLatestBlockhash',[{commitment:'processed'}])).value.blockhash;
          function controlKeys(){return [m(STATE,false,true),m(MINT,false,true),m(VAULT,false,true),m(SOLV,false,true),m(BC,false,true),m(pump.GLOBAL_PDA),m(pump.PUMP_PROGRAM_ID),m(pump.PUMP_EVENT_AUTHORITY_PDA),m(SYS),m(TOKEN_2022_PROGRAM_ID),m(EV),m(P)]}
          async function sim(label,keys){const ix=new TransactionInstruction({programId:P,keys,data:disc});const msg=new TransactionMessage({payerKey:TRADER,recentBlockhash:bh,instructions:[ix]}).compileToV0Message();const tx=new VersionedTransaction(msg);const v=(await rpc('simulateTransaction',[Buffer.from(tx.serialize()).toString('base64'),{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'processed'}])).value;const logs=v.logs??[];console.log('\n===',label,'===');console.log('ERR',JSON.stringify(v.err),'UNITS',v.unitsConsumed);for(const l of logs)if(/Instruction:|AnchorError|Error Code|Error Number|Left:|Right:|failed|Mayhem|Constraint|owner|seed/i.test(l))console.log(l);return v}
          await sim('control_active_state',controlKeys());
          let k=controlKeys();k[0]=m(OTHER_STATE,false,true);await sim('other_valid_mayhem_state_with_active_mint_vault',k);
          k=controlKeys();k[0]=m(new PublicKey('13ec7XdrjF3h3YcqBTFDSReRcUFwbCnJaAQspM4j6DDJ'),false,true);await sim('global_params_as_state',k);
          k=controlKeys();k[1]=m(new PublicKey('EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v'),false,true);await sim('wrong_mint_keep_active_state_vault',k);
          k=controlKeys();k[2]=m(new PublicKey('41xY1DU1zzo893bEg2HzTFxPVVM84UvDCNsQm6aKRq8Z'),false,true);await sim('wrong_token_account_as_vault',k);
          k=controlKeys();k[4]=m(new PublicKey('DSV2CUbhfEWRPRn9QRZWkYohRi47WEeauz8s89ekKBdN'),false,true);await sim('foreign_pumpamm_pool_as_bonding_curve',k);
          NODE
