name: mayhem-sweep-map-v2
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/mayhem-sweep-map-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @solana/web3.js @solana/spl-token
      - name: Simulation-only sequential SweepFees account recovery
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {PublicKey,TransactionInstruction,TransactionMessage,VersionedTransaction,Keypair} from '@solana/web3.js';
          import {getAssociatedTokenAddressSync,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID,NATIVE_MINT,TOKEN_2022_PROGRAM_ID} from '@solana/spl-token'; import crypto from 'node:crypto';
          const pk=s=>new PublicKey(s),P=pk('MAyhSmzXzV1pTf7LsNkrNwkWKTo4ougAJ1PPg47MD4e'),G=pk('13ec7XdrjF3h3YcqBTFDSReRcUFwbCnJaAQspM4j6DDJ'),T=pk('Gygj9QQby4j2jryqyqBHvLP7ctv2SaANgh4sCb69BUpA'),R=pk('Ce6TQqeHC9p8KetsN6JsjHK7UTZk7nasjjnr7XxXp9F1'),Q=pk('EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v'),SYS=pk('11111111111111111111111111111111'),VAULT=pk('BwWK17cbHxwWBKZkUYvzxLcNQ1YVyaFezduWbtm2de6s'),FEE=pk('GesfTA3X2arioaHp8bbKdjG9vJtskViWACZoYvxp4twS'),FEE6=pk('463MEnMeGyJekNZFQSTUABBEbLnvMTALbT6ZmsxAbAdq');
          const [EV]=PublicKey.findProgramAddressSync([Buffer.from('__event_authority')],P),TATA=getAssociatedTokenAddressSync(Q,T,true,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID),VATA=getAssociatedTokenAddressSync(Q,VAULT,true,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID),FATA=getAssociatedTokenAddressSync(Q,FEE,true,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID),F6ATA=getAssociatedTokenAddressSync(Q,FEE6,true,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID),disc=crypto.createHash('sha256').update('global:sweep_fees').digest().subarray(0,8);
          const m=(p,s=false,w=false)=>({pubkey:p,isSigner:s,isWritable:w});
          const roles={
            trader:m(T,true,true),global_params:m(G,false,true),quote_mint:m(Q),trader_quote_ata:m(TATA,false,true),system_program:m(SYS),token_program:m(TOKEN_PROGRAM_ID),associated_token_program:m(ASSOCIATED_TOKEN_PROGRAM_ID),event_authority:m(EV),program:m(P),sol_vault:m(VAULT,false,true),sol_vault_quote_ata:m(VATA,false,true),wsol_mint:m(NATIVE_MINT),fee_recipient:m(FEE,false,true),fee_recipient_ata:m(FATA,false,true),quote_token_program:m(TOKEN_PROGRAM_ID),base_token_program:m(TOKEN_PROGRAM_ID),token_2022_program:m(TOKEN_2022_PROGRAM_ID)
          };
          let prefix=['trader','global_params','quote_mint','trader_quote_ata','system_program','token_program','associated_token_program'].map(n=>({...roles[n]}));
          const RPCS=['https://api.mainnet-beta.solana.com','https://rpc.solanatracker.io/public'];let id=1;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function rpc(method,params){let last;for(const url of RPCS){try{const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-simulation-only-sweep-map-v2/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method,params})});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j.error)throw Error(JSON.stringify(j.error));return {url,result:j.result}}catch(e){last=e;console.log('RPCFAIL',url,String(e).slice(0,150));await sleep(250)}}throw last}
          const bh=(await rpc('getLatestBlockhash',[{commitment:'processed'}])).result.value.blockhash;
          function parse(v){const logs=v?.logs??[],text=logs.join('\n');return {logs,text,account:text.match(/AnchorError caused by account: ([A-Za-z0-9_\-]+)/)?.[1]??null,code:text.match(/Error Code: ([A-Za-z0-9_]+)/)?.[1]??null,num:Number(text.match(/Error Number: (\d+)/)?.[1]??0)||null}}
          async function sim(label,keys,full=false){const ix=new TransactionInstruction({programId:P,keys,data:disc});const msg=new TransactionMessage({payerKey:T,recentBlockhash:bh,instructions:[ix]}).compileToV0Message();const tx=new VersionedTransaction(msg);const {url,result}=await rpc('simulateTransaction',[Buffer.from(tx.serialize()).toString('base64'),{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'processed'}]);const v=result?.value,e=parse(v);console.log('SIM',label,JSON.stringify({rpc:url,err:v?.err??null,units:v?.unitsConsumed??null,account:e.account,code:e.code,num:e.num,interesting:e.logs.filter(x=>/Instruction:|AnchorError|Error Code|Error Number|Left:|Right:|failed|Permission|Rate|Sweep/.test(x)).slice(-30)},null,2));if(full)for(const l of e.logs)console.log('FULLLOG',l);return {v,e}}
          for(let step=0;step<15;step++){
            const fillers=Array.from({length:12},()=>m(Keypair.generate().publicKey,false,false));
            const r=await sim('map_'+step,[...prefix,...fillers]);
            if(r.v?.err==null || !r.e.account){console.log('PARSER_DONE_OR_HANDLER',JSON.stringify({step,err:r.v?.err??null,code:r.e.code,num:r.e.num,prefixLen:prefix.length}));break}
            const n=r.e.account;if(!roles[n]){console.log('UNKNOWN_NEXT_ROLE',n);break}console.log('NEXT_ROLE',prefix.length,n,roles[n].pubkey.toBase58());prefix.push({...roles[n]});await sleep(120)
          }
          console.log('RECOVERED_PREFIX',JSON.stringify(prefix.map((x,i)=>({i,pubkey:x.pubkey.toBase58(),signer:x.isSigner,writable:x.isWritable})),null,2));
          const exact=await sim('exact_control',prefix,true);
          // Authorization / destination probes use same parsed layout.
          const randomKeys=prefix.map(x=>({...x}));randomKeys[0]=m(R,true,true);await sim('arbitrary_signer_same_destination',randomKeys);
          const feeDest=prefix.map(x=>({...x}));feeDest[3]=m(FATA,false,true);await sim('real_trader_fee_recipient_destination',feeDest);
          const both=prefix.map(x=>({...x}));both[0]=m(R,true,true);both[3]=m(FATA,false,true);await sim('arbitrary_signer_fee_destination',both);
          console.log('AUX',JSON.stringify({event:EV.toBase58(),traderAta:TATA.toBase58(),vaultAta:VATA.toBase58(),feeAta:FATA.toBase58(),fee6Ata:F6ATA.toBase58()}));
          NODE
