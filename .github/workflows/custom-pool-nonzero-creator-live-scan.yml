name: custom-pool-nonzero-creator-live-scan
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/custom-pool-nonzero-creator-live-scan.yml']
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save bs58
      - shell: bash
        run: |
          node --input-type=module <<'NODE'
          import bs58pkg from 'bs58';const bs58=bs58pkg.default??bs58pkg;
          const PROGRAM='pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA';
          const DISC=bs58.encode(Uint8Array.from([241,154,109,4,17,177,109,188]));
          const ZERO='11111111111111111111111111111111';
          const RPCS=['https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com','https://rpc.solanatracker.io/public'];let id=1;
          async function req(u,m,p){const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-readonly/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j.error)throw Error(JSON.stringify(j.error));return j.result}
          let rows=null,used=null;for(const u of RPCS){try{rows=await req(u,'getProgramAccounts',[PROGRAM,{encoding:'base64',commitment:'confirmed',filters:[{memcmp:{offset:0,bytes:DISC}}],dataSlice:{offset:0,length:245}}]);used=u;console.log('GPA_OK',u,rows.length);break}catch(e){console.log('GPA_FAIL',u,String(e).slice(0,220))}}if(!rows)throw Error('all GPA failed');
          const out=[];let index0=0,custom=0,customNonzero=0,index0Nonzero=0;
          for(const r of rows){const b=Buffer.from(r.account.data[0],'base64');if(b.length<243)continue;const index=b.readUInt16LE(9);const creator=bs58.encode(b.subarray(11,43));const base=bs58.encode(b.subarray(43,75));const quote=bs58.encode(b.subarray(75,107));const coin=bs58.encode(b.subarray(211,243));if(index===0){index0++;if(coin!==ZERO)index0Nonzero++;}else{custom++;if(coin!==ZERO){customNonzero++;if(out.length<100)out.push({pool:r.pubkey,index,creator,base,quote,coinCreator:coin,len:b.length});}}}
          console.log('SUMMARY',JSON.stringify({rpc:used,total:rows.length,index0,index0Nonzero,custom,customNonzero},null,2));for(const x of out)console.log('CUSTOM_NONZERO',JSON.stringify(x));
          NODE
