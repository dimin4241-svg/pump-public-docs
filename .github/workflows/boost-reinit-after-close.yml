name: PumpSwap BOOST Reinit After Close

on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths:
      - audit/boost_reinit_after_close.mjs
      - .github/workflows/boost-reinit-after-close.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save @solana/web3.js@1.98.4 @solana/spl-token@0.4.14
      - name: Recreate closed BOOST vault and simulate true pool creator init_boost
        run: node audit/boost_reinit_after_close.mjs
