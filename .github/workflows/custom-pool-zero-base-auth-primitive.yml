name: custom-pool-zero-base-auth-primitive
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/custom-pool-zero-base-auth-primitive.yml']
  workflow_dispatch:
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @pump-fun/pump-swap-sdk@1.19.0 @solana/web3.js @solana/spl-token bn.js
      - shell: bash
        run: |
          sed -e 's/const baseIn=100000000n,quoteIn=1000000n;/const baseIn=0n,quoteIn=1000000n;/' \
              -e "s/const control=await run('default_creator',ZERO,41000);const attacker=await run('attacker_creator',USER,41001);/const attacker=await run('zero_base_attacker',USER,42001);const control=attacker;/" \
              .github/workflows/custom-pool-coin-creator-guard.yml >/tmp/x || true
          cat > probe.mjs <<'NODE'
          import BN from 'bn.js';import{PublicKey,Keypair,SystemProgram,Transaction}from'@solana/web3.js';import{TOKEN_PROGRAM_ID,NATIVE_MINT,ASSOCIATED_TOKEN_PROGRAM_ID,MINT_SIZE,getAssociatedTokenAddressSync,createAssociatedTokenAccountIdempotentInstruction,createInitializeMintInstruction,createSyncNativeInstruction}from'@solana/spl-token';import{OFFLINE_PUMP_AMM_PROGRAM,GLOBAL_CONFIG_PDA,poolPda}from'@pump-fun/pump-swap-sdk';
          const U=new PublicKey('HTVZVEQMBsNanubDPTs3CxDAEGNFQHJY8c1441iy2S5r'),RPC='https://rpc.solanatracker.io/public';let id=1;async function rpc(m,p){const r=await fetch(RPC,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});const j=await r.json();if(j.error)throw Error(JSON.stringify(j.error));return j.result}const rent=await rpc('getMinimumBalanceForRentExemption',[MINT_SIZE]);
          async function go(baseIn,index){const mint=Keypair.generate(),pool=poolPda(index,U,mint.publicKey,NATIVE_MINT),ub=getAssociatedTokenAddressSync(mint.publicKey,U,false,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID),uq=getAssociatedTokenAddressSync(NATIVE_MINT,U,false,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID),pb=getAssociatedTokenAddressSync(mint.publicKey,pool,true,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID),pq=getAssociatedTokenAddressSync(NATIVE_MINT,pool,true,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID);const ixs=[SystemProgram.createAccount({fromPubkey:U,newAccountPubkey:mint.publicKey,lamports:rent,space:MINT_SIZE,programId:TOKEN_PROGRAM_ID}),createInitializeMintInstruction(mint.publicKey,6,U,null,TOKEN_PROGRAM_ID),createAssociatedTokenAccountIdempotentInstruction(U,ub,U,mint.publicKey,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID),createAssociatedTokenAccountIdempotentInstruction(U,uq,U,NATIVE_MINT,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID),SystemProgram.transfer({fromPubkey:U,toPubkey:uq,lamports:1000000}),createSyncNativeInstruction(uq,TOKEN_PROGRAM_ID),createAssociatedTokenAccountIdempotentInstruction(U,pb,pool,mint.publicKey,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID),createAssociatedTokenAccountIdempotentInstruction(U,pq,pool,NATIVE_MINT,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID)];const cp=await OFFLINE_PUMP_AMM_PROGRAM.methods.createPool(index,new BN(String(baseIn)),new BN('1000000'),U,false,{0:false}).accountsPartial({globalConfig:GLOBAL_CONFIG_PDA,baseMint:mint.publicKey,quoteMint:NATIVE_MINT,creator:U,userBaseTokenAccount:ub,userQuoteTokenAccount:uq,baseTokenProgram:TOKEN_PROGRAM_ID,quoteTokenProgram:TOKEN_PROGRAM_ID}).instruction();ixs.push(cp);const bh=(await rpc('getLatestBlockhash',[{commitment:'processed'}])).value.blockhash;const tx=new Transaction({feePayer:U,recentBlockhash:bh}).add(...ixs);const raw=tx.serialize({requireAllSignatures:false,verifySignatures:false});const v=(await rpc('simulateTransaction',[raw.toString('base64'),{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'processed',accounts:{encoding:'base64',addresses:[pool.toBase58()]}}])).value;const logs=v.logs??[];console.log('RESULT',JSON.stringify({baseIn:String(baseIn),pool:pool.toBase58(),err:v.err,poolExists:!!v.accounts?.[0],anchor:logs.filter(x=>x.includes('AnchorError')||x.includes('Error Code:')),failed:logs.filter(x=>x.includes('failed:')),instructions:logs.filter(x=>x.includes('Instruction:'))},null,2));}
          await go(1n,42000);await go(0n,42001);
          NODE
          node probe.mjs
