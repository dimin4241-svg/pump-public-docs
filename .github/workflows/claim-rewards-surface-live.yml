name: claim-rewards-surface-live
on:
  push:
    paths:
      - '.github/workflows/claim-rewards-surface-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @pump-fun/pump-sdk@1.36.0 @pump-fun/pump-swap-sdk@1.19.0 @solana/web3.js @solana/spl-token bn.js
      - name: Static claim surface and read-only positive-user discovery
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for(const p of ['node_modules/@pump-fun/pump-sdk/src/idl/pump.json','node_modules/@pump-fun/pump-swap-sdk/src/idl/pump_amm.json']){
            const j=JSON.parse(fs.readFileSync(p,'utf8'));console.log('\n=== IDL',p,'===');
            for(const n of ['claim_token_incentives','claim_cashback','claim_cashback_v2','close_user_volume_accumulator','sync_user_volume_accumulator']){
              const ix=j.instructions?.find(x=>x.name===n);if(ix)console.log('\nIX',n,JSON.stringify(ix,null,2));
            }
            for(const a of j.accounts??[])if(/volume|accumulator/i.test(a.name))console.log('\nACCOUNT_DEF',a.name,JSON.stringify(a,null,2));
            for(const t of j.types??[])if(/volume|accumulator/i.test(t.name))console.log('\nTYPE_DEF',t.name,JSON.stringify(t,null,2));
          }
          NODE
          echo '=== token incentives source ==='
          sed -n '1,320p' node_modules/@pump-fun/pump-sdk/src/tokenIncentives.ts || true
          sed -n '1,320p' node_modules/@pump-fun/pump-swap-sdk/src/sdk/tokenIncentives.ts || true
          echo '=== online claim source ==='
          sed -n '350,455p' node_modules/@pump-fun/pump-sdk/src/onlineSdk.ts || true
          sed -n '635,725p' node_modules/@pump-fun/pump-swap-sdk/src/sdk/onlinePumpAmm.ts || true
          echo '=== tests ==='
          sed -n '1,220p' node_modules/@pump-fun/pump-swap-sdk/src/__tests__/claimTokenIncentives.spec.ts || true
          grep -RniE 'claimCashback|claim_cashback|cashback' node_modules/@pump-fun/pump-sdk/src/__tests__ node_modules/@pump-fun/pump-swap-sdk/src/__tests__ 2>/dev/null | head -250 || true
          node --input-type=module <<'NODE'
          import {Connection,PublicKey} from '@solana/web3.js';
          import * as pump from '@pump-fun/pump-sdk';
          import * as amm from '@pump-fun/pump-swap-sdk';
          const RPC='https://api.mainnet-beta.solana.com', c=new Connection(RPC,'confirmed');
          function safe(v){if(v==null)return v;if(typeof v==='bigint')return v.toString();if(v?.toBase58)return v.toBase58();if(v?.toString&&v.constructor?.name==='BN')return v.toString();if(Array.isArray(v))return v.map(safe);if(typeof v==='object'){const o={};for(const [k,z] of Object.entries(v))o[k]=safe(z);return o}return v}
          for(const [label,progId,idlPath,decoderFactory] of [
            ['pump',pump.PUMP_PROGRAM_ID,'node_modules/@pump-fun/pump-sdk/src/idl/pump.json',()=>pump.PUMP_SDK],
            ['amm',amm.PUMP_AMM_PROGRAM_ID,'node_modules/@pump-fun/pump-swap-sdk/src/idl/pump_amm.json',()=>amm.PUMP_AMM_SDK],
          ]){
            console.log('\n=== LIVE',label,'===');
            const idl=JSON.parse((await import('node:fs')).readFileSync(idlPath,'utf8'));
            const accDef=idl.accounts?.find(x=>/user_volume_accumulator/i.test(x.name));
            if(!accDef){console.log('NO_USER_ACC_DEF');continue}
            const disc=Buffer.from(accDef.discriminator??[]);console.log('USER_ACC_DISC',disc.toString('hex'));
            let rows=[];try{rows=await c.getProgramAccounts(progId,{commitment:'confirmed',encoding:'base64',filters:[{memcmp:{offset:0,bytes:(await import('bs58')).default.encode(disc)}}]});console.log('USER_ACC_COUNT',rows.length)}catch(e){console.log('GPA_FAIL',String(e));continue}
            const sdk=decoderFactory();const decMethod=label==='pump'?'decodeUserVolumeAccumulator':'decodeUserVolumeAccumulator';
            const decoded=[];
            for(const r of rows.slice(0,1000)){try{const x=sdk[decMethod](r.account.data);decoded.push({pk:r.pubkey,...x})}catch(e){}}
            console.log('DECODED_SAMPLE_COUNT',decoded.length);
            for(const x of decoded.slice(0,20))console.log('USER_ACC_SAMPLE',JSON.stringify(safe(x)));
            // Rank by any numeric-looking claim/cashback/token fields so we can select a live positive target without guessing layout.
            function rank(x){let s=0n;for(const [k,v] of Object.entries(x)){if(!/(claim|cash|token|volume|amount|unclaimed|earned|sol)/i.test(k))continue;try{const q=BigInt(v?.toString?.()??v);if(q>0n)s+=q}catch{}}return s}
            decoded.sort((a,b)=>rank(a)>rank(b)?-1:rank(a)<rank(b)?1:0);
            for(const x of decoded.slice(0,30))console.log('RANKED_USER_ACC',JSON.stringify({rank:rank(x).toString(),...safe(x)}));
          }
          NODE