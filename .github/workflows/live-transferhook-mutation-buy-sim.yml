name: live-transferhook-mutation-buy-sim
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/live-transferhook-mutation-buy-sim.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @pump-fun/pump-swap-sdk@1.19.0 @solana/web3.js @solana/spl-token bn.js
      - name: Control vs post-mutation buy, simulation only
        shell: bash
        run: |
          cat > hook_mut_buy.mjs <<'NODE'
          import BN from 'bn.js';
          import {Connection,PublicKey,Transaction} from '@solana/web3.js';
          import {TOKEN_2022_PROGRAM_ID,createUpdateTransferHookInstruction,unpackMint,getTransferHook} from '@solana/spl-token';
          import {OnlinePumpAmmSdk,PUMP_AMM_SDK,PUMP_AMM_PROGRAM_ID} from '@pump-fun/pump-swap-sdk';
          const RPCS=['https://api.mainnet-beta.solana.com','https://rpc.solanatracker.io/public','https://solana-rpc.publicnode.com','https://solana.public-rpc.com'];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let conn=null,stateRpc=null;
          for(const u of RPCS){try{const c=new Connection(u,'confirmed');await c.getLatestBlockhash('confirmed');conn=c;stateRpc=u;break}catch(e){console.log('CONN_FAIL',u,String(e).slice(0,180))}}
          if(!conn)throw new Error('no state rpc');console.log('STATE_RPC',stateRpc);
          async function rawRpc(u,method,params,tries=4){let last;for(let a=0;a<tries;a++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-simulation-only/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:1000+a,method,params})});if(r.status===429||r.status>=500){last=new Error('HTTP '+r.status);await sleep(500+700*a);continue}const j=await r.json();if(j.error){last=new Error(JSON.stringify(j.error));if(/No response|429|Too many/i.test(String(last))){await sleep(500+700*a);continue}throw last}return j.result}catch(e){last=e;await sleep(500+700*a)}}throw last}
          async function simulateWithFallback(raw,addresses,label){let last;for(const u of RPCS){try{console.log(label,'SIM_TRY',u);const result=await rawRpc(u,'simulateTransaction',[raw.toString('base64'),{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'confirmed',accounts:{encoding:'base64',addresses}}],3);console.log(label,'SIM_RPC',u);return result.value}catch(e){last=e;console.log(label,'SIM_FAIL',u,String(e).slice(0,260))}}throw last}
          const mint=new PublicKey('pumpCmXqMfrsAkQ5r49WcJnRayYRqmXz6ae8H7H9Dfn');
          const pool=new PublicKey('539m4mVWt6iduB6W8rDGPMarzNCMesuqY5eUTiiYHAgR');
          const user=new PublicKey('HTVZVEQMBsNanubDPTs3CxDAEGNFQHJY8c1441iy2S5r');
          const hookAuthority=new PublicKey('DMdBa812dBW1CHVhmTyUyVcrBnSbZbfoFC7U14k4riH1');
          const [mintInfo,userInfo]=await conn.getMultipleAccountsInfo([mint,user],'confirmed');if(!mintInfo||!userInfo)throw new Error('mint/user missing');
          const mm=unpackMint(mint,mintInfo,TOKEN_2022_PROGRAM_ID);console.log('HOOK_PRE',JSON.stringify(getTransferHook(mm),(_k,v)=>v?.toBase58?.()??v));console.log('USER_LAMPORTS',userInfo.lamports);
          const online=new OnlinePumpAmmSdk(conn);const state=await online.swapSolanaState(pool,user);
          console.log('STATE',JSON.stringify({baseMint:state.pool.baseMint.toBase58(),quoteMint:state.pool.quoteMint.toBase58(),poolBase:state.pool.poolBaseTokenAccount.toBase58(),poolQuote:state.pool.poolQuoteTokenAccount.toBase58(),baseTokenProgram:state.baseTokenProgram.toBase58(),quoteTokenProgram:state.quoteTokenProgram.toBase58(),poolBaseAmount:state.poolBaseAmount?.toString?.(),poolQuoteAmount:state.poolQuoteAmount?.toString?.(),userBase:state.userBaseTokenAccount.toBase58(),userQuote:state.userQuoteTokenAccount.toBase58(),userBaseExists:!!state.userBaseAccountInfo,userQuoteExists:!!state.userQuoteAccountInfo},null,2));
          const baseOut=new BN('1000000'),maxQuote=new BN('10000000');let buyIxs=await PUMP_AMM_SDK.buyInstructionsNoPool(state,baseOut,maxQuote);
          const buyIndex=buyIxs.findIndex(ix=>ix.programId.equals(PUMP_AMM_PROGRAM_ID));if(buyIndex<0)throw new Error('buy instruction not found');buyIxs=buyIxs.slice(0,buyIndex+1);
          console.log('BUY_IXS',buyIxs.map((x,i)=>({i,program:x.programId.toBase58(),keys:x.keys.length,data:x.data.length})));
          const updateIx=createUpdateTransferHookInstruction(mint,hookAuthority,PUMP_AMM_PROGRAM_ID,[],TOKEN_2022_PROGRAM_ID);
          async function sim(label,ixs){
            const bh=await conn.getLatestBlockhash('confirmed');const tx=new Transaction({feePayer:user,recentBlockhash:bh.blockhash});tx.add(...ixs);let raw;
            try{raw=tx.serialize({requireAllSignatures:false,verifySignatures:false})}catch(e){console.log(label,'SERIALIZE_ERROR',String(e));return{serializeError:String(e)}}
            console.log(label,'RAW_BYTES',raw.length,'SIG_SLOTS',tx.signatures.map(x=>x.publicKey.toBase58()));
            const addresses=[mint,pool,state.pool.poolBaseTokenAccount,state.pool.poolQuoteTokenAccount,state.userBaseTokenAccount,state.userQuoteTokenAccount].map(x=>x.toBase58());
            const v=await simulateWithFallback(raw,addresses,label),text=(v.logs??[]).join('\n');
            const out={label,simulationOnly:true,broadcast:false,err:v.err,units:v.unitsConsumed,updateReached:text.includes('TransferHookExtension')||text.includes('Instruction: Update'),updateSuccess:text.includes('TransferHookExtension')&&text.includes(`${TOKEN_2022_PROGRAM_ID.toBase58()} success`),buyReached:text.includes('Instruction: Buy'),unsupportedBase:text.includes('UnsupportedBaseMint'),unsupportedQuote:text.includes('UnsupportedQuoteMint'),hookExecuteHint:/extra account|transfer hook|TransferHook|IncorrectAccount|not enough account/i.test(text),token2022Failed:text.includes(TOKEN_2022_PROGRAM_ID.toBase58())&&v.err!==null};
            console.log(label,'RESULT',JSON.stringify(out,null,2));console.log(label,'LOGS_BEGIN');for(const l of v.logs??[])console.log(l);console.log(label,'LOGS_END');return out;
          }
          const control=await sim('CONTROL',buyIxs);const mutated=await sim('MUTATED',[updateIx,...buyIxs]);
          console.log('DIFFERENTIAL',JSON.stringify({control,mutated,newHookProgram:PUMP_AMM_PROGRAM_ID.toBase58()},null,2));
          NODE
          node hook_mut_buy.mjs