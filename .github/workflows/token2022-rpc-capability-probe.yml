name: Probe public RPC Token-2022 GPA support
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths:
      - '.github/workflows/token2022-rpc-capability-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install --no-save bs58
      - name: Probe narrow first-TLV TransferFeeConfig query
        shell: bash
        run: |
          cat > rpc_probe.mjs <<'NODE'
          import bs58pkg from 'bs58';
          const bs58=bs58pkg.default??bs58pkg;
          const T22='TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb';
          const endpoints=[
            'https://api.mainnet-beta.solana.com',
            'https://solana-rpc.publicnode.com',
            'https://solana.public-rpc.com',
            'https://solana.drpc.org',
            'https://solana-mainnet.rpc.extrnode.com',
            'https://solana.api.onfinality.io/public',
          ];
          const params=[T22,{encoding:'base64',commitment:'confirmed',filters:[
            {memcmp:{offset:165,bytes:bs58.encode(Buffer.from([1]))}},
            {memcmp:{offset:166,bytes:bs58.encode(Buffer.from([1,0]))}}
          ],dataSlice:{offset:0,length:0}}];
          let id=1;
          for(const url of endpoints){
            const row={url};
            try{
              const vr=await fetch(url,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-readonly/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:'getVersion',params:[]})});
              row.versionHttp=vr.status;
              const vj=await vr.json().catch(()=>null); row.version=vj?.result??vj?.error??null;
            }catch(e){row.versionError=String(e)}
            try{
              const t0=Date.now();
              const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-readonly/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:'getProgramAccounts',params})});
              row.gpaHttp=r.status; row.ms=Date.now()-t0;
              const text=await r.text();
              let j; try{j=JSON.parse(text)}catch{}
              row.gpaError=j?.error??(!j?text.slice(0,300):null);
              row.count=Array.isArray(j?.result)?j.result.length:null;
              row.sample=Array.isArray(j?.result)?j.result.slice(0,5).map(x=>x.pubkey):null;
            }catch(e){row.gpaException=String(e)}
            console.log('ENDPOINT',JSON.stringify(row));
          }
          NODE
          node rpc_probe.mjs
