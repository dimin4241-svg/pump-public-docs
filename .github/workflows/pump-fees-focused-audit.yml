name: Pump Fees focused money-sink summary
on:
  push:
    branches: [research/boost-auth-devnet]
    paths:
      - "research/pump-fees-idl-audit/focused.mjs"
      - "idl/pump_fees.json"
      - ".github/workflows/pump-fees-focused-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: research/pump-fees-idl-audit
        run: node focused.mjs
