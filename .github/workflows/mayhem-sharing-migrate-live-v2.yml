name: mayhem-sharing-migrate-live-v2
on:
  push:
    paths:
      - '.github/workflows/mayhem-sharing-migrate-live-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @pump-fun/pump-swap-sdk@1.19.0 @solana/web3.js bs58
      - name: Read-only sampled sharing scan and simulation-only migration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import bs58pkg from 'bs58';const bs58=bs58pkg.default??bs58pkg;
          import {Connection,PublicKey,TransactionInstruction,TransactionMessage,VersionedTransaction,Keypair} from '@solana/web3.js';
          import {OnlinePumpAmmSdk,PUMP_AMM_SDK,getPumpAmmProgram} from '@pump-fun/pump-swap-sdk';
          const RPCS=['https://api.mainnet-beta.solana.com','https://rpc.solanatracker.io/public','https://solana-rpc.publicnode.com'],PROGRAM='pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA',SHARE_PROG=new PublicKey('pfeeUxB6jkeY1Hxd7CsFCAjcbHA9rWtchMGdZ6VojVZ');
          let id=1;const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function one(url,method,params,n=3){let last;for(let a=0;a<n;a++){try{const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-readonly-sharing-sample/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method,params})});if(r.status===429||r.status>=500){last=Error('HTTP '+r.status);await sleep(500+700*a);continue}if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j.error)throw Error(JSON.stringify(j.error));return j.result}catch(e){last=e;await sleep(400+500*a)}}throw last}async function rpc(method,params){let last;for(const u of RPCS){try{return await one(u,method,params,3)}catch(e){last=e;console.log('RPC_FAIL',method,u,String(e).slice(0,160))}}throw last}
          const rows=await rpc('getProgramAccounts',[PROGRAM,{encoding:'base64',commitment:'confirmed',filters:[{dataSize:301},{memcmp:{offset:243,bytes:'2'}}],dataSlice:{offset:0,length:245}}]);console.log('MAYHEM_ROWS',rows.length);const sample=rows.slice(0,5000);
          const pools=sample.map(r=>{const b=Buffer.from(r.account.data[0],'base64');const baseMint=new PublicKey(b.subarray(43,75));const [sharing]=PublicKey.findProgramAddressSync([Buffer.from('sharing-config'),baseMint.toBuffer()],SHARE_PROG);return {pool:r.pubkey,baseMint:baseMint.toBase58(),poolQuote:bs58.encode(b.subarray(171,203)),coinCreator:bs58.encode(b.subarray(211,243)),sharing:sharing.toBase58()}});
          const hits=[];for(let off=0;off<pools.length;off+=100){const batch=pools.slice(off,off+100);let vals;try{vals=(await rpc('getMultipleAccounts',[batch.map(x=>x.sharing),{encoding:'base64',commitment:'confirmed'}])).value}catch(e){console.log('SKIP_SHARING_BATCH',off,String(e).slice(0,180));continue}for(let i=0;i<batch.length;i++)if(vals[i])hits.push({...batch[i],sharingOwner:vals[i].owner,sharingLen:Buffer.from(vals[i].data[0],'base64').length});if(off%1000===0)console.log('SHARING_PROGRESS',off,'hits',hits.length);await sleep(180)}
          console.log('SHARING_SUMMARY',JSON.stringify({sampled:pools.length,withSharing:hits.length},null,2));if(!hits.length)process.exit(0);
          for(let off=0;off<hits.length;off+=100){const batch=hits.slice(off,off+100);let vals;try{vals=(await rpc('getMultipleAccounts',[batch.map(x=>x.poolQuote),{encoding:'base64',commitment:'confirmed'}])).value}catch(e){console.log('SKIP_QUOTE_BATCH',off,String(e).slice(0,180));continue}for(let i=0;i<batch.length;i++){const a=vals[i],d=a?.data?.[0]?Buffer.from(a.data[0],'base64'):null;batch[i].quoteAmount=d?.length>=72?d.readBigUInt64LE(64).toString():'0';batch[i].quoteOwner=a?.owner??null}await sleep(180)}
          hits.sort((a,b)=>BigInt(a.quoteAmount??'0')>BigInt(b.quoteAmount??'0')?-1:BigInt(a.quoteAmount??'0')<BigInt(b.quoteAmount??'0')?1:0);console.log('TOP_SHARING_MAYHEM',JSON.stringify(hits.slice(0,30),null,2));
          let chosen=null;for(const x of hits){try{const c=new Connection(RPCS[0],'confirmed'),online=new OnlinePumpAmmSdk(c),p=await online.fetchPool(new PublicKey(x.pool));if(p){chosen={x,p};break}}catch{}}
          if(!chosen)throw Error('no fetchable hit');const {x:target,p:pre}=chosen,POOL=new PublicKey(target.pool),SHARING=new PublicKey(target.sharing),PAYER=new PublicKey('Gygj9QQby4j2jryqyqBHvLP7ctv2SaANgh4sCb69BUpA'),c=new Connection(RPCS[0],'confirmed'),prog=getPumpAmmProgram(c);
          console.log('TARGET_PRE',JSON.stringify({pool:target.pool,quoteAmount:target.quoteAmount,creator:pre.creator.toBase58(),coinCreator:pre.coinCreator.toBase58(),baseMint:pre.baseMint.toBase58(),isMayhem:pre.isMayhemMode,isCashback:pre.isCashbackCoin,sharing:SHARING.toBase58()},null,2));
          const ix=await prog.methods.migratePoolCoinCreator().accountsPartial({pool:POOL,sharingConfig:SHARING}).instruction();console.log('MIGRATE_KEYS',JSON.stringify(ix.keys.map((k,i)=>({i,pk:k.pubkey.toBase58(),s:k.isSigner,w:k.isWritable})),null,2));
          function parse(logs){const t=(logs??[]).join('\n');return {account:t.match(/AnchorError caused by account: ([A-Za-z0-9_\-]+)/)?.[1]??null,code:t.match(/Error Code: ([A-Za-z0-9_]+)/)?.[1]??null,num:Number(t.match(/Error Number: (\d+)/)?.[1]??0)||null,interesting:(logs??[]).filter(x=>/Instruction:|AnchorError|Error Code|Error Number|Left:|Right:|failed|success|creator|sharing/i.test(x)).slice(-80)}}
          async function sim(label,inst){const bh=(await rpc('getLatestBlockhash',[{commitment:'processed'}])).value.blockhash;const tx=new VersionedTransaction(new TransactionMessage({payerKey:PAYER,recentBlockhash:bh,instructions:[inst]}).compileToV0Message());const raw=Buffer.from(tx.serialize()).toString('base64');const v=(await rpc('simulateTransaction',[raw,{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'processed',accounts:{encoding:'base64',addresses:[POOL.toBase58()]}}])).value,e=parse(v.logs);let post=null,decodeErr=null;try{const a=v.accounts?.[0];if(a?.data?.[0])post=PUMP_AMM_SDK.decodePool(Buffer.from(a.data[0],'base64'))}catch(z){decodeErr=String(z)}console.log('\nSIM',label,JSON.stringify({err:v.err,units:v.unitsConsumed,account:e.account,code:e.code,num:e.num,preCoinCreator:pre.coinCreator.toBase58(),postCoinCreator:post?.coinCreator?.toBase58?.()??null,postCreator:post?.creator?.toBase58?.()??null,decodeErr,interesting:e.interesting},null,2));return {v,e,post}}
          await sim('migrate_control',ix);const si=ix.keys.findIndex(k=>k.pubkey.equals(SHARING));if(si>=0){let keys=ix.keys.map(k=>({...k}));keys[si]={...keys[si],pubkey:Keypair.generate().publicKey};await sim('migrate_random_sharing',new TransactionInstruction({programId:ix.programId,keys,data:Buffer.from(ix.data)}));const otherHit=hits.find(h=>h.sharing!==target.sharing);if(otherHit){keys=ix.keys.map(k=>({...k}));keys[si]={...keys[si],pubkey:new PublicKey(otherHit.sharing)};await sim('migrate_other_valid_sharing',new TransactionInstruction({programId:ix.programId,keys,data:Buffer.from(ix.data)}))}}
          NODE