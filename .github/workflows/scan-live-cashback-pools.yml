name: Scan Live PumpSwap Cashback Pools
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths:
      - audit/scan_live_cashback_pools.py
      - .github/workflows/scan-live-cashback-pools.yml
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python audit/scan_live_cashback_pools.py
