name: boost-deposit-funder-fast
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/boost-deposit-funder-fast.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - shell: bash
        run: |
          node --input-type=module <<'NODE'
          const addrs=['AHT991hB8aYQcVUkUx7MYcLh7bYVMjsNadiG5rMdu3Gs','6MmdYA5kuTb7yrULXBeb39Nr112f8ZhRG8DkegFmNeDV','83FSZbDiCRFzkSYMqvTJG3xUppYzAu1DMXABirei7Uqy'];
          const RPC='https://rpc.solanatracker.io/public';let id=1;async function rpc(m,p){const r=await fetch(RPC,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});const x=await r.json();if(x.error)throw Error(JSON.stringify(x.error));return x.result}
          const v=(await rpc('getMultipleAccounts',[addrs,{encoding:'base64',commitment:'confirmed'}])).value;
          for(let i=0;i<addrs.length;i++){const a=v[i];let parsed=null;if(a){const b=Buffer.from(a.data[0],'base64');if(b.length>=72)parsed={mint:b.subarray(0,32).toString('hex'),owner:b.subarray(32,64).toString('hex'),amount:b.readBigUInt64LE(64).toString(),len:b.length};}console.log('ACCOUNT',JSON.stringify({address:addrs[i],exists:!!a,lamports:a?.lamports,program:a?.owner,parsed}));}
          NODE