name: inspect-deposit-swap-idl
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/inspect-deposit-swap-idl.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @pump-fun/pump-swap-sdk@1.19.0
      - shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const idl=JSON.parse(fs.readFileSync('node_modules/@pump-fun/pump-swap-sdk/src/idl/pump_amm.json','utf8'));
          for(const name of ['deposit','withdraw','buy','sell']){
            const x=idl.instructions.find(i=>i.name.toLowerCase()===name);
            console.log('IDL_'+name.toUpperCase(),JSON.stringify(x,null,2));
          }
          NODE
          echo '=== offline methods ==='
          sed -n '500,950p' node_modules/@pump-fun/pump-swap-sdk/src/sdk/offlinePumpAmm.ts
