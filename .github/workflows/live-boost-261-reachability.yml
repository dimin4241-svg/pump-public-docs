name: live-boost-261-reachability
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/live-boost-261-reachability.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @solana/web3.js @solana/spl-token
      - shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {PublicKey} from '@solana/web3.js';
          const pool='13NksqbGpjQJVDepJK5E8aWMdPHuw5sbAnQDGBvSR4iq';
          const mint='3cQmPTKT41A3FMCKv6SKgKwUQd9YZPXhLvgKdk7upump';
          const poolBase='F4TyHgRwyDyNFKufbhBZNA9YhabeKWFu1qk3BZ7i5NXR';
          const poolQuote='5iRwoVD8XKDGJsAXZdEbCvM7tvbemtJ6JRc9T8eABdCf';
          const RPCS=['https://api.mainnet-beta.solana.com','https://rpc.solanatracker.io/public','https://solana-rpc.publicnode.com','https://solana.public-rpc.com'];let id=1;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function one(u,m,p,n=4){let e;for(let a=0;a<n;a++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});if(r.status===429||r.status>=500){e=new Error('HTTP '+r.status);await sleep(500+600*a);continue}const x=await r.json();if(x.error){e=new Error(JSON.stringify(x.error));if(/No response|429|Too many/i.test(String(e))){await sleep(500+600*a);continue}throw e}return x.result}catch(x){e=x;await sleep(500+600*a)}}throw e}
          async function rpc(m,p){let e;for(const u of RPCS){try{return await one(u,m,p)}catch(x){e=x}}throw e}
          const [pr,br,qr]= (await rpc('getMultipleAccounts',[[pool,poolBase,poolQuote],{encoding:'base64',commitment:'confirmed'}])).value;
          const b=Buffer.from(pr.data[0],'base64'),bd=Buffer.from(br.data[0],'base64'),qd=Buffer.from(qr.data[0],'base64');
          function i128le(buf,o){let u=0n;for(let i=15;i>=0;i--)u=(u<<8n)+BigInt(buf[o+i]);return u&(1n<<127n)?u-(1n<<128n):u}
          const B=bd.readBigUInt64LE(64),Q=qd.readBigUInt64LE(64),V=i128le(b,245);
          const supply=BigInt((await rpc('getTokenSupply',[mint,{commitment:'confirmed'}])).value.amount);
          const external=supply-B;
          const threshold=Q*B/V+1n;
          const gap=threshold-external;
          const largest=(await rpc('getTokenLargestAccounts',[mint,{commitment:'confirmed'}])).value.map(x=>({address:x.address,amount:x.amount,uiAmountString:x.uiAmountString}));
          const topSum=largest.reduce((s,x)=>s+BigInt(x.amount),0n);
          console.log('STATE',JSON.stringify({pool,mint,len:b.length,B:B.toString(),Q:Q.toString(),V:V.toString(),supply:supply.toString(),external:external.toString(),unsafeThreshold:threshold.toString(),gapThresholdMinusExternal:gap.toString(),reachableByAllExternal:external>=threshold,externalPctOfThreshold:Number(external*1000000n/threshold)/10000,top20Sum:topSum.toString()},null,2));
          console.log('LARGEST',JSON.stringify(largest,null,2));
          NODE