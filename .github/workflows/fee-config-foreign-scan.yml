name: fee-config-foreign-scan
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/fee-config-foreign-scan.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @solana/web3.js @coral-xyz/anchor
      - shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {PublicKey} from '@solana/web3.js';
          import {BorshAccountsCoder} from '@coral-xyz/anchor';
          const FEE=new PublicKey('pfeeUxB6jkeY1Hxd7CsFCAjcbHA9rWtchMGdZ6VojVZ');
          const PROGRAMS={pump:'6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P',pump_swap:'pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA',pump_fees:FEE.toBase58()};
          const idl=JSON.parse(fs.readFileSync('idl/pump_fees.json','utf8'));const coder=new BorshAccountsCoder(idl);
          const RPCS=['https://rpc.solanatracker.io/public','https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com'];let id=1;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function req(u,m,p,n=3){let e;for(let a=0;a<n;a++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});if(r.status===429||r.status>=500){e=Error('HTTP '+r.status);await sleep(250+300*a);continue}const x=await r.json();if(x.error)throw Error(JSON.stringify(x.error));return x.result}catch(x){e=x;await sleep(180)}}throw e}
          async function call(m,p){let e;for(const u of RPCS){try{const x=await req(u,m,p);console.log('RPC_OK',m,u);return x}catch(x){e=x;console.log('RPC_FAIL',m,u,String(x).slice(0,180))}}throw e}
          const pdas={};for(const [n,p] of Object.entries(PROGRAMS)){const [a,b]=PublicKey.findProgramAddressSync([Buffer.from('fee_config'),new PublicKey(p).toBuffer()],FEE);pdas[n]={program:p,pda:a.toBase58(),bump:b};console.log('DERIVED',n,JSON.stringify(pdas[n]));}
          console.log('PUMPSWAP_CANONICAL_MATCH',pdas.pump_swap.pda==='5PHirr8joyTMp9JMm6nW7hNDVyEYdkzDqazxPD7RaTjx');
          const vals=(await call('getMultipleAccounts',[Object.values(pdas).map(x=>x.pda),{encoding:'base64',commitment:'confirmed'}])).value;
          function clean(v){return JSON.parse(JSON.stringify(v,(k,x)=>typeof x==='bigint'?x.toString():x?.constructor?.name==='BN'?x.toString():x instanceof PublicKey?x.toBase58():x));}
          let i=0;for(const [n,d] of Object.entries(pdas)){const a=vals[i++];if(!a){console.log('CONFIG',n,JSON.stringify({...d,exists:false}));continue}const buf=Buffer.from(a.data[0],'base64');let dec=null,used=null;for(const nm of ['fee_config','FeeConfig']){try{dec=coder.decode(nm,buf);used=nm;break}catch(e){console.log('DECODE_FAIL',n,nm,String(e).slice(0,160))}}
            console.log('CONFIG',n,JSON.stringify({...d,exists:true,owner:a.owner,lamports:a.lamports,len:buf.length,decodeName:used,decoded:dec?clean(dec):null},null,2));}
          NODE