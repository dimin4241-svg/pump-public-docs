name: fee-config-binding-static
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/fee-config-binding-static.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @pump-fun/pump-swap-sdk@1.19.0
      - shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const amm=JSON.parse(fs.readFileSync('node_modules/@pump-fun/pump-swap-sdk/src/idl/pump_amm.json','utf8'));
          const pf=JSON.parse(fs.readFileSync('idl/pump_fees.json','utf8'));
          for(const n of ['buy','sell']){const x=amm.instructions.find(i=>i.name===n);console.log('AMM_'+n.toUpperCase()+'_FEE_ACCOUNTS',JSON.stringify((x?.accounts??[]).map((a,i)=>({i,...a})).filter(a=>/fee_config|fee_program|protocol_fee|coin_creator/.test(a.name)),null,2));}
          for(const i of pf.instructions??[]){if(/fee|get/i.test(i.name)){console.log('PUMP_FEES_INSTR',i.name,JSON.stringify(i,null,2));}}
          for(const t of pf.types??[]){if(/fee/i.test(t.name)||JSON.stringify(t).toLowerCase().includes('fee_config'))console.log('PUMP_FEES_TYPE',t.name,JSON.stringify(t,null,2));}
          for(const a of pf.accounts??[]){if(/fee/i.test(a.name))console.log('PUMP_FEES_ACCOUNT',a.name,JSON.stringify(a,null,2));}
          for(const e of pf.errors??[])console.log('PUMP_FEES_ERROR',JSON.stringify(e));
          NODE
          echo '=== SDK fee config refs ==='
          grep -Rni -B12 -A35 -E 'feeConfig|fee_config|getFees|PUMP_FEE|pfeeUx|feeProgram' node_modules/@pump-fun/pump-swap-sdk/src/sdk node_modules/@pump-fun/pump-swap-sdk/src 2>/dev/null | head -n 1800 || true
          echo '=== repo pump fees refs ==='
          grep -Rni -B12 -A40 -E 'fee_config|FeeConfig|get_fees|GetFees|pfeeUx' idl docs 2>/dev/null | head -n 1600 || true