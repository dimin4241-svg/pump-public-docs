name: inspect-withdraw-auth-contract
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/inspect-withdraw-auth-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @pump-fun/pump-swap-sdk@1.19.0
      - shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const idl=JSON.parse(fs.readFileSync('node_modules/@pump-fun/pump-swap-sdk/src/idl/pump_amm.json','utf8'));for(const n of ['withdraw','deposit']){const x=idl.instructions.find(i=>i.name.toLowerCase()===n);console.log('INSTR_'+n.toUpperCase(),JSON.stringify(x,null,2));}
          NODE
          grep -Rni -B10 -A45 -E 'withdrawInstructionsInternal|withdrawInstructions\(' node_modules/@pump-fun/pump-swap-sdk/src/sdk/offlinePumpAmm.ts | head -n 300 || true