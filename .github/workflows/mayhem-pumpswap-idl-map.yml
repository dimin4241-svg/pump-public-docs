name: mayhem-pumpswap-idl-map
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/mayhem-pumpswap-idl-map.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save @pump-fun/pump-sdk@1.36.0 @pump-fun/pump-swap-sdk@1.19.0
      - name: Static IDL and builder map
        shell: bash
        run: |
          set -euo pipefail
          echo '=== PACKAGE VERSIONS ==='
          node -e "console.log('pump-sdk',require('./node_modules/@pump-fun/pump-sdk/package.json').version); console.log('pump-swap-sdk',require('./node_modules/@pump-fun/pump-swap-sdk/package.json').version)"
          echo '=== GREP PUMP SDK ==='
          grep -RniE 'buy_pump_swap|sell_pump_swap|buyPumpSwap|sellPumpSwap' node_modules/@pump-fun/pump-sdk --exclude='*.map' | head -200 || true
          echo '=== GREP PUMP SWAP SDK ==='
          grep -RniE 'buy_pump_swap|sell_pump_swap|buyPumpSwap|sellPumpSwap' node_modules/@pump-fun/pump-swap-sdk --exclude='*.map' | head -200 || true
          echo '=== IDL ENTRIES ==='
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import path from 'node:path';
          const roots=['node_modules/@pump-fun/pump-sdk','node_modules/@pump-fun/pump-swap-sdk'];
          const wanted=new Set(['buy_pump_swap','sell_pump_swap']);
          function walk(p){let out=[];for(const e of fs.readdirSync(p,{withFileTypes:true})){const q=path.join(p,e.name);if(e.isDirectory())out=out.concat(walk(q));else if(e.name.endsWith('.json'))out.push(q)}return out}
          for(const root of roots){for(const f of walk(root)){let j;try{j=JSON.parse(fs.readFileSync(f,'utf8'))}catch{continue}for(const ix of j?.instructions??[]){if(wanted.has(ix.name)){console.log('IDL_FILE',f);console.log(JSON.stringify(ix,null,2));}}}}
          NODE
