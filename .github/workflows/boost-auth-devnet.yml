name: PumpSwap BOOST auth Devnet proof

on:
  push:
    branches:
      - research/boost-auth-devnet
    paths:
      - "research/boost-auth/**"
      - "idl/pump_amm.json"
      - ".github/workflows/boost-auth-devnet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devnet-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install isolated harness dependencies
        working-directory: research/boost-auth
        run: npm install --no-audit --no-fund

      - name: Simulate unauthorized BOOST call on Devnet only
        working-directory: research/boost-auth
        env:
          DEVNET_RPC: https://api.devnet.solana.com
        run: |
          sed -i 's/EtWTRABZaYq6iMfeYKouRu166VU2xqa1/EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG/' devnet-sim.mjs
          node devnet-sim.mjs
