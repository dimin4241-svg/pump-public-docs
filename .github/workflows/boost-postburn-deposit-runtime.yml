name: boost-postburn-deposit-runtime
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/boost-postburn-deposit-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @pump-fun/pump-swap-sdk@1.19.0 @solana/web3.js @solana/spl-token bn.js
      - shell: bash
        run: |
          cat > probe.mjs <<'NODE'
          import BN from 'bn.js';
          import {Connection,PublicKey,Transaction,ComputeBudgetProgram,SystemProgram} from '@solana/web3.js';
          import {AccountLayout,getAssociatedTokenAddressSync,createAssociatedTokenAccountIdempotentInstruction,createSyncNativeInstruction,TOKEN_PROGRAM_ID,TOKEN_2022_PROGRAM_ID,NATIVE_MINT} from '@solana/spl-token';
          import {OnlinePumpAmmSdk,PUMP_AMM_SDK,PUMP_AMM_PROGRAM_ID} from '@pump-fun/pump-swap-sdk';
          const POOL=new PublicKey('FpvoV2tqRxDW156CvATS6xFNuGewiHRX5JZneau1uFgF');
          const USER=new PublicKey('7VtfL8fvgNfhz17qKRMjzQEXgbdpnHHHQRh54R9jP2RJ');
          const RPCS=['https://rpc.solanatracker.io/public','https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com'];let rid=1;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function raw(u,m,p,n=4){let e;for(let a=0;a<n;a++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-simulation-only/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:rid++,method:m,params:p})});if(r.status===429||r.status>=500){e=Error('HTTP '+r.status);await sleep(300+400*a);continue}const x=await r.json();if(x.error){e=Error(JSON.stringify(x.error));if(/429|No response|Too many/i.test(String(e))){await sleep(300+400*a);continue}throw e}return x.result}catch(x){e=x;await sleep(250)}}throw e}
          async function call(m,p){let e;for(const u of RPCS){try{return await raw(u,m,p)}catch(x){e=x;console.log('RPC_FAIL',m,u,String(x).slice(0,180))}}throw e}
          let conn=null;for(const u of RPCS){try{const c=new Connection(u,'confirmed');await c.getLatestBlockhash();conn=c;console.log('SDK_RPC',u);break}catch(e){console.log('SDK_RPC_FAIL',u,String(e).slice(0,120))}}if(!conn)throw Error('no sdk rpc');
          const sdk=new OnlinePumpAmmSdk(conn);const swap=await sdk.swapSolanaState(POOL,USER);const liq=await sdk.liquiditySolanaState(POOL,USER);
          const B0=BigInt(swap.poolBaseAmount.toString()),Q0=BigInt(swap.poolQuoteAmount.toString()),L0=BigInt(swap.pool.lpSupply.toString()),V0=BigInt(swap.pool.virtualQuoteReserves.toString());
          const ceil=(a,b)=>(a+b-1n)/b;const lpOut=L0/10000n;const baseNeed=ceil(B0*lpOut,L0),quoteNeed=ceil(Q0*lpOut,L0);
          console.log('PRE',JSON.stringify({B:B0.toString(),Q:Q0.toString(),V:V0.toString(),L:L0.toString(),lpOut:lpOut.toString(),baseNeed:baseNeed.toString(),quoteNeed:quoteNeed.toString(),baseMint:swap.pool.baseMint.toBase58(),quoteMint:swap.pool.quoteMint.toBase58(),lpMint:swap.pool.lpMint.toBase58(),baseProgram:swap.baseTokenProgram.toBase58(),quoteProgram:swap.quoteTokenProgram.toBase58(),userBase:swap.userBaseTokenAccount.toBase58(),userQuote:swap.userQuoteTokenAccount.toBase58(),userLp:liq.userPoolTokenAccount.toBase58()}));
          const addrs=[USER,swap.userBaseTokenAccount,swap.userQuoteTokenAccount,liq.userPoolTokenAccount];const preA=(await call('getMultipleAccounts',[addrs.map(x=>x.toBase58()),{encoding:'base64',commitment:'confirmed'}])).value;for(let i=0;i<preA.length;i++){const a=preA[i];let amt=null;if(a&&Buffer.from(a.data[0],'base64').length>=72)amt=AccountLayout.decode(Buffer.from(a.data[0],'base64')).amount.toString();console.log('USER_PRE',i,addrs[i].toBase58(),JSON.stringify({exists:!!a,lamports:a?.lamports??0,owner:a?.owner??null,amount:amt}));}
          const baseAta=getAssociatedTokenAddressSync(swap.pool.baseMint,USER,false,swap.baseTokenProgram);const quoteAta=getAssociatedTokenAddressSync(swap.pool.quoteMint,USER,false,swap.quoteTokenProgram);const lpAta=getAssociatedTokenAddressSync(swap.pool.lpMint,USER,false,TOKEN_2022_PROGRAM_ID);
          const setup=[createAssociatedTokenAccountIdempotentInstruction(USER,baseAta,USER,swap.pool.baseMint,swap.baseTokenProgram),createAssociatedTokenAccountIdempotentInstruction(USER,quoteAta,USER,swap.pool.quoteMint,swap.quoteTokenProgram),createAssociatedTokenAccountIdempotentInstruction(USER,lpAta,USER,swap.pool.lpMint,TOKEN_2022_PROGRAM_ID),SystemProgram.transfer({fromPubkey:USER,toPubkey:quoteAta,lamports:2_000_000_000}),createSyncNativeInstruction(quoteAta,TOKEN_PROGRAM_ID)];
          const buyIxs=await PUMP_AMM_SDK.buyBaseInput(swap,new BN(baseNeed.toString()),5);const buy=buyIxs.find(ix=>ix.programId.equals(PUMP_AMM_PROGRAM_ID));if(!buy)throw Error('buy ix missing');
          const depIxs=await PUMP_AMM_SDK.depositInstructions(liq,new BN(lpOut.toString()),5);const dep=depIxs.find(ix=>ix.programId.equals(PUMP_AMM_PROGRAM_ID));if(!dep)throw Error('deposit ix missing');
          console.log('IX_META',JSON.stringify({buyIxs:buyIxs.map(ix=>ix.programId.toBase58()),depIxs:depIxs.map(ix=>ix.programId.toBase58()),buyKeys:buy.keys.length,depKeys:dep.keys.length,buyData:buy.data.toString('hex'),depData:dep.data.toString('hex')}));
          const bh=(await call('getLatestBlockhash',[{commitment:'confirmed'}])).value.blockhash;const tx=new Transaction({feePayer:USER,recentBlockhash:bh}).add(ComputeBudgetProgram.setComputeUnitLimit({units:1_400_000}),...setup,buy,dep);let bytes;try{bytes=tx.serialize({requireAllSignatures:false,verifySignatures:false})}catch(e){console.log('SERIALIZE_ERR',String(e));throw e}console.log('TX_BYTES',bytes.length,'SIGS',tx.signatures.map(x=>x.publicKey.toBase58()));
          const watch=[POOL,swap.pool.poolBaseTokenAccount,swap.pool.poolQuoteTokenAccount,swap.pool.lpMint,baseAta,quoteAta,lpAta];let val=null;for(const u of RPCS){try{const x=await raw(u,'simulateTransaction',[bytes.toString('base64'),{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'confirmed',accounts:{encoding:'base64',addresses:watch.map(x=>x.toBase58())}}],3);val=x.value;console.log('SIM_RPC',u);break}catch(e){console.log('SIM_FAIL',u,String(e).slice(0,220))}}if(!val)throw Error('no sim');
          const rows=val.accounts??[];const tok=i=>rows[i]?AccountLayout.decode(Buffer.from(rows[i].data[0],'base64')).amount:null;const mintSupply=i=>{if(!rows[i])return null;const b=Buffer.from(rows[i].data[0],'base64');return b.length>=44?b.readBigUInt64LE(36):null};const pbuf=rows[0]?Buffer.from(rows[0].data[0],'base64'):null;const i128=(b,o)=>{let u=0n;for(let i=15;i>=0;i--)u=(u<<8n)+BigInt(b[o+i]);return u&(1n<<127n)?u-(1n<<128n):u};const post={B:tok(1),Q:tok(2),lpMintSupply:mintSupply(3),userBase:tok(4),userQuote:tok(5),userLp:tok(6),V:pbuf?i128(pbuf,245):null,L:pbuf?pbuf.readBigUInt64LE(203):null};
          console.log('RESULT',JSON.stringify({err:val.err,units:val.unitsConsumed,post:Object.fromEntries(Object.entries(post).map(([k,v])=>[k,v===null?null:v.toString()])),instructions:(val.logs??[]).filter(l=>l.includes('Instruction:')),anchor:(val.logs??[]).filter(l=>l.includes('AnchorError')||l.includes('Error Code:')),failed:(val.logs??[]).filter(l=>l.includes('failed:'))},null,2));
          if(val.err)for(const l of val.logs??[])console.log('ERRLOG',l);
          NODE
          node probe.mjs