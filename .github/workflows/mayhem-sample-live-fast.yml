name: mayhem-sample-live-fast
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/mayhem-sample-live-fast.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save bs58
      - shell: bash
        run: |
          node --input-type=module <<'NODE'
          import bs58pkg from 'bs58';const bs58=bs58pkg.default??bs58pkg;
          const pools=['BkyEQLxRpKkWpToGidioiBHMaqbkiKd29jTsqPGshuPB','RDAY1jMaf5x2oai7vhwdr3GjhRsfaaB7xWJrfCMZoL8','uEQjqGqGPEmaBFy3133yrrKU68x3xqEHvRbPVhyw8XH','xP9717Ug9Hiwr9s3wFak65r4WY47vUhRhbXG4pu7nuh','284jmrdKemVmLH4bmB1XgWKyTTeEGmVqYiTcH9y7ji3z','2BPeSgbZNcLkw7rPp8WZ6aGNm39sB23QjV4DHU8zoPTH','2ELgPdHLqZEBdf2aQJQEpE4ycmepWa4c1SixYqPmDo69','2f8ZfdhihotWzzwUjawAW48LpkcDj6uRTZhBFM5PS7Mb','2gM3pbuy5e2YvFze9grRJ3PZaxR7XFvv5QSdiQsKQpdG','2ticu9SyfVYTy4tdNSEBJAikuPNFCTSQTzTmCaZ393YE','3CR5KAYUwmfr9hxqRJVWnD4s1kxv8M3ViCPJQwQMJK66','3D2ENpQNGkFN58FRDP2vRgg4QTNWVZEKjMzUaWVkWJCZ','3EUUwdSpEXap46NB6n5Mmt3U8XM8vW8HPCLtJDoGzw33','3M81j7R9toNii31LFjDew3DRAAuaTq8Z3cUBTcC6o91n','3RdefkhmvGAcCyeieoHfo59tCrEs9czpmhg3SprmmQdc','3bCcX4jVnhqGmenRmpwUVoX9bYV6KWRUyfbWtgDjF7cj','3fZmh4MaCNgbEpy5hpfEq4eJLAUjim3SPCXGYnkBH2Tg','3qq8yJS9XmkoDjMg8yJMNmdzQuAUkkVzs85RHZg1ZCp2','4DUuWogY1TDPrHiTUGexYWKNmpZ7JhNf6i5YTTL1Y8yW','4Ni7dvdSHLJUmxDjcgJN6jT5Q65ud4NNcZSMHEzpbxiP'];
          const RPCS=['https://rpc.solanatracker.io/public','https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com'];let id=1;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function req(u,m,p,n=3){let e;for(let a=0;a<n;a++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});if(r.status===429||r.status>=500){e=Error('HTTP '+r.status);await sleep(300+400*a);continue}const x=await r.json();if(x.error)throw Error(JSON.stringify(x.error));return x.result}catch(x){e=x;await sleep(200)}}throw e}
          async function call(m,p){let e;for(const u of RPCS){try{const x=await req(u,m,p);console.log('RPC_OK',m,u);return x}catch(x){e=x;console.log('RPC_FAIL',m,u,String(x).slice(0,180))}}throw e}
          const vals=(await call('getMultipleAccounts',[pools,{encoding:'base64',commitment:'confirmed'}])).value;
          const rows=[];
          for(let i=0;i<pools.length;i++){const a=vals[i];if(!a){rows.push({pool:pools[i],exists:false});continue}const b=Buffer.from(a.data[0],'base64');if(b.length<244){rows.push({pool:pools[i],exists:true,len:b.length,error:'short'});continue}const row={pool:pools[i],exists:true,len:b.length,creator:bs58.encode(b.subarray(11,43)),baseMint:bs58.encode(b.subarray(43,75)),quoteMint:bs58.encode(b.subarray(75,107)),lpMint:bs58.encode(b.subarray(107,139)),poolBase:bs58.encode(b.subarray(139,171)),poolQuote:bs58.encode(b.subarray(171,203)),lpSupply:b.readBigUInt64LE(203).toString(),coinCreator:bs58.encode(b.subarray(211,243)),isMayhem:b[243],isCashback:b.length>244?b[244]:null};rows.push(row)}
          const vaultAddrs=rows.filter(r=>r.poolQuote).flatMap(r=>[r.poolBase,r.poolQuote]);const vv=(await call('getMultipleAccounts',[vaultAddrs,{encoding:'base64',commitment:'confirmed'}])).value;let k=0;for(const r of rows.filter(r=>r.poolQuote)){const ba=vv[k++],qa=vv[k++];for(const [name,a] of [['base',ba],['quote',qa]]){if(!a){r[name+'Amount']='0';r[name+'Program']=null;continue}const d=Buffer.from(a.data[0],'base64');r[name+'Amount']=d.length>=72?d.readBigUInt64LE(64).toString():'0';r[name+'Program']=a.owner}}
          rows.sort((a,b)=>BigInt(b.quoteAmount??0)>BigInt(a.quoteAmount??0)?1:BigInt(b.quoteAmount??0)<BigInt(a.quoteAmount??0)?-1:0);
          console.log('LIVE_MAYHEM_SAMPLE',JSON.stringify(rows,null,2));
