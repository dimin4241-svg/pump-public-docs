name: boost-lp-gpa-holder
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/boost-lp-gpa-holder.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @solana/web3.js bs58 @solana/spl-token
      - shell: bash
        run: |
          node --input-type=module <<'NODE'
          import bs58pkg from'bs58';import{PublicKey,SystemProgram}from'@solana/web3.js';import{TOKEN_2022_PROGRAM_ID}from'@solana/spl-token';const bs58=bs58pkg.default??bs58pkg;
          const pool='FpvoV2tqRxDW156CvATS6xFNuGewiHRX5JZneau1uFgF',RPCS=['https://rpc.solanatracker.io/public','https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com','https://solana.public-rpc.com'];let id=1;
          async function req(u,m,p){const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});const x=await r.json();if(x.error)throw Error(JSON.stringify(x.error));return x.result}
          async function call(m,p){let e;for(const u of RPCS){try{const x=await req(u,m,p);console.log('RPC_OK',m,u);return x}catch(x){e=x;console.log('RPC_FAIL',m,u,String(x).slice(0,180))}}throw e}
          const pr=(await call('getAccountInfo',[pool,{encoding:'base64',commitment:'confirmed'}])).value,b=Buffer.from(pr.data[0],'base64'),lp=bs58.encode(b.subarray(107,139)),lpSupply=b.readBigUInt64LE(203);console.log('LP',lp,'LP_SUPPLY_FIELD',lpSupply.toString());
          let rows=null;for(const u of RPCS){try{rows=await req(u,'getProgramAccounts',[TOKEN_2022_PROGRAM_ID.toBase58(),{encoding:'base64',commitment:'confirmed',filters:[{memcmp:{offset:0,bytes:lp}}],dataSlice:{offset:32,length:40}}]);console.log('GPA_RPC',u,'ROWS',rows.length);break}catch(e){console.log('GPA_FAIL',u,String(e).slice(0,200))}}if(!rows)throw Error('all GPA failed');
          const hs=[];for(const r of rows){const d=Buffer.from(r.account.data[0],'base64');if(d.length<40)continue;const owner=bs58.encode(d.subarray(0,32)),amount=d.readBigUInt64LE(32);if(amount===0n)continue;hs.push({ta:r.pubkey,owner,amount})}hs.sort((a,b)=>a.amount>b.amount?-1:a.amount<b.amount?1:0);console.log('NONZERO_HOLDERS',hs.length);
          for(const h of hs.slice(0,30)){let oi=null;try{oi=(await call('getAccountInfo',[h.owner,{encoding:'base64',commitment:'confirmed'}])).value}catch{}console.log('HOLDER',JSON.stringify({ta:h.ta,owner:h.owner,amount:h.amount.toString(),sharePct:Number(h.amount*1000000n/lpSupply)/10000,onCurve:PublicKey.isOnCurve(new PublicKey(h.owner).toBytes()),program:oi?.owner,lamports:oi?.lamports??0,system:oi?.owner===SystemProgram.programId.toBase58()}))}
          NODE