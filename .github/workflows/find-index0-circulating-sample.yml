name: PumpSwap Sample Index0 Circulating Pools

on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths:
      - .github/workflows/find-index0-circulating-sample.yml
      - audit/find_index0_circulating_fast.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch to a deterministic spread sample and run
        shell: python
        run: |
          from pathlib import Path
          p=Path('audit/find_index0_circulating_fast.py')
          s=p.read_text()
          old="ps=[pool(r) for r in rows];ps=[p for p in ps if p and p['index']==0 and p['quoteMint']==WSOL and p['virtual']==0]"
          new=old+"\n # Sample across the full returned set instead of resolving every linked account.\n if len(ps)>360:\n  step=max(1,len(ps)//360); ps=ps[::step][:360]"
          if old not in s: raise SystemExit('pool list marker missing')
          p.write_text(s.replace(old,new))
      - name: Discover circulating LP in sampled index-0 pools
        run: python audit/find_index0_circulating_fast.py
