name: Exact Okko static closure via trusted RuStore CDN v191

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  exact-static:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download and verify exact public package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/okko
          URL='https://static.rustore.ru/2026/8/14/7b/de764e6d-0184-4e0f-a7c6-0b6a30580a79.zip'
          curl --location --fail --retry 2 --silent --show-error \
            --header 'User-Agent: okko-standoff365-static-research/1.0' \
            --header 'Accept: */*' \
            --output /tmp/okko/okko.pkg "$URL"
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('/tmp/okko/okko.pkg');h=hashlib.sha256();n=0
          with p.open('rb') as f:
              for b in iter(lambda:f.read(1024*1024),b''):
                  n+=len(b);h.update(b)
          got=h.hexdigest()
          print(json.dumps({'bytes':n,'sha256':got},indent=2))
          assert n==45942514
          assert got=='b00bca9cb327ab3ee483b46d390c9120ac28bfc7674c75fda0129c6c594cc1f9'
          PY

      - name: Install JADX from GitHub
        shell: bash
        run: |
          set -euo pipefail
          URL=$(python3 - <<'PY'
          import json,urllib.request
          d=json.load(urllib.request.urlopen('https://api.github.com/repos/skylot/jadx/releases/latest',timeout=30))
          print([a['browser_download_url'] for a in d['assets'] if a['name'].startswith('jadx-') and a['name'].endswith('.zip')][0])
          PY
          )
          curl -L --fail --retry 2 "$URL" -o /tmp/jadx.zip
          mkdir -p /tmp/jadx && unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          /tmp/jadx/bin/jadx --version

      - name: Extract main APK and decompile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import shutil,zipfile
          from pathlib import Path
          pkg=Path('/tmp/okko/okko.pkg');out=Path('/tmp/okko/okko.apk')
          if zipfile.is_zipfile(pkg):
              with zipfile.ZipFile(pkg) as z:
                  apks=[x for x in z.infolist() if x.filename.lower().endswith('.apk')]
                  if apks:
                      info=max(apks,key=lambda x:x.file_size)
                      print('selected_apk',info.filename,'bytes',info.file_size)
                      with z.open(info) as src,out.open('wb') as dst:
                          shutil.copyfileobj(src,dst,1024*1024)
                  else:
                      shutil.copy2(pkg,out)
          else:
              shutil.copy2(pkg,out)
          PY
          /tmp/jadx/bin/jadx --no-res --no-imports --show-bad-code --threads-count 4 \
            -d /tmp/okko/jadx /tmp/okko/okko.apk >/tmp/jadx.stdout 2>/tmp/jadx.stderr || true
          test -d /tmp/okko/jadx/sources

      - name: Derive strict AI converter and Rekko config evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib,json,re
          from pathlib import Path

          SRC=Path('/tmp/okko/jadx/sources')
          OUT=Path('/tmp/okko-v191.json')
          EXPECTED='b00bca9cb327ab3ee483b46d390c9120ac28bfc7674c75fda0129c6c594cc1f9'
          STRONG={'answer','text','content','query','prompt','recommendation','recommendations','suggestion','suggestions','reply','utterance','result'}
          WEAK={'message','status','state','progress','error','errors','code','token','id','requestid','requesttoken','timestamp','retryafter'}
          FIELD_RX=re.compile(r'^\s*(?:(?:public|private|protected|final|static|transient|volatile)\s+)+([A-Za-z0-9_.$<>?, \[\]]+)\s+([A-Za-z_$][\w$]*)\s*(?:;|=)')
          GETTER_RX=re.compile(r'\b(?:get|is)([A-Za-z_$][\w$]*)\s*\(\s*\)\s*\{')
          ASSIGN_RX=re.compile(r'(?m)^\s*(?:final\s+)?(?:[A-Za-z0-9_.$<>?, \[\]]+\s+)?([A-Za-z_$][\w$]*)\s*=\s*([^;]+);')
          IDENT_RX=re.compile(r'\b([A-Za-z_$][\w$]*)\b')
          GCALL_RX=re.compile(r'\.\s*(?:get|is)([A-Za-z_$][\w$]*)\s*\(')
          URL_RX=re.compile(r'(?i)https?://(?:[a-z0-9-]+\.)+(?:okko\.tv|playfamily\.ru|tvgateway\.ru|yotaplay\.ru|howdoyoustream\.ru)(?::\d+)?(?:/[^\s\"\'<>]*)?|https?://okko\.sport(?::\d+)?(?:/[^\s\"\'<>]*)?')
          HOST_RX=re.compile(r'(?i)(?:https?://)?((?:[a-z0-9-]+\.)+(?:okko\.tv|playfamily\.ru|tvgateway\.ru|yotaplay\.ru|howdoyoustream\.ru)|okko\.sport)(?::\d+)?')
          SERIAL_RX=re.compile(r'(?i)(?:SerialName|SerializedName|JsonProperty)\s*\(\s*"([^"\\]{1,120})"')

          def digest(p):
              h=hashlib.sha256();n=0
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''):
                      n+=len(b);h.update(b)
              return n,h.hexdigest()
          def rel(p):return str(p.relative_to(SRC)).replace('\\','/')
          def text(p):return p.read_text(encoding='utf-8',errors='replace')
          def one(suffix,basename):
              p=SRC/suffix
              if p.is_file():return p
              rows=[x for x in SRC.rglob(basename) if str(x).replace('\\','/').endswith(str(suffix).replace('\\','/'))]
              if not rows:rows=list(SRC.rglob(basename))
              if len(rows)!=1:raise SystemExit(f'{basename}: expected one, got {len(rows)}')
              return rows[0]
          def match(text0,op,left,right):
              d=0;q=None;esc=False
              for i in range(op,len(text0)):
                  c=text0[i]
                  if q:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c==q:q=None
                      continue
                  if c in ('"',"'"):q=c;continue
                  if c==left:d+=1
                  elif c==right:
                      d-=1
                      if d==0:return i
              return None
          def split_args(s):
              out=[];st=0;dp=db=ds=da=0;q=None;esc=False
              for i,c in enumerate(s):
                  if q:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c==q:q=None
                      continue
                  if c in ('"',"'"):q=c
                  elif c=='(':dp+=1
                  elif c==')':dp-=1
                  elif c=='{':db+=1
                  elif c=='}':db-=1
                  elif c=='[':ds+=1
                  elif c==']':ds-=1
                  elif c=='<':da+=1
                  elif c=='>':da=max(0,da-1)
                  elif c==',' and dp==db==ds==da==0:
                      out.append(s[st:i].strip());st=i+1
              out.append(s[st:].strip())
              return [x for x in out if x]
          def tokens(s):
              if not s:return set()
              s=re.sub(r'^(?:get|is)','',s,flags=re.I)
              bits=[]
              for c in re.sub(r'[^A-Za-z0-9]+',' ',s).split():
                  bits += re.findall(r'[A-Z]+(?=[A-Z][a-z]|\d|$)|[A-Z]?[a-z]+|\d+',c) or [c]
              return {x.lower() for x in bits}
          def strength(names):
              ts=set();compact=set()
              for n in names:
                  ts|=tokens(n);compact.add(re.sub(r'[^A-Za-z0-9]+','',n).lower())
              if ts&STRONG or compact&STRONG:return 'strong-private'
              if ts&WEAK or compact&WEAK:return 'weak-metadata'
              return 'unknown'
          def model(p):
              t=text(p);ls=t.splitlines();fields={};getters={};pending=None
              for i,l in enumerate(ls,1):
                  sm=SERIAL_RX.search(l)
                  if sm:pending=(i,sm.group(1))
                  fm=FIELD_RX.search(l)
                  if fm:
                      ser=pending[1] if pending and i-pending[0]<=4 else None
                      fields[fm.group(2)]={'type':fm.group(1).strip(),'serialized':ser,'line':i}
                      pending=None
              for i,l in enumerate(ls,1):
                  gm=GETTER_RX.search(l)
                  if not gm:continue
                  suffix=gm.group(1);pref='get' if 'get' in gm.group(0) else 'is'
                  tail='\n'.join(ls[i-1:min(len(ls),i+8)])
                  rm=re.search(r'return\s+(?:this\.)?([A-Za-z_$][\w$]*)\s*;',tail)
                  fld=rm.group(1) if rm else None;names={suffix}
                  if fld:
                      names.add(fld)
                      if fields.get(fld,{}).get('serialized'):names.add(fields[fld]['serialized'])
                  getters[pref+suffix]={'field':fld,'names':sorted(names),'line':i}
              field_names={k:set([k]+([v['serialized']] if v.get('serialized') else [])) for k,v in fields.items()}
              for g in getters.values():
                  if g.get('field'):field_names.setdefault(g['field'],set()).update(g['names'])
              return {'path':rel(p),'fields':fields,'getters':getters,'field_semantics':{k:sorted(v) for k,v in field_names.items()}}
          def constructors(p,mdl):
              t=text(p);cls=p.stem;out=[]
              rx=re.compile(r'(?m)^\s*(?:(?:public|private|protected)\s+)?'+re.escape(cls)+r'\s*\(([^)]*)\)\s*\{')
              for m in rx.finditer(t):
                  rows=split_args(m.group(1));names=[]
                  for r in rows:
                      r=re.sub(r'@[\w.$]+(?:\([^)]*\))?\s*','',r).strip();mm=re.search(r'([A-Za-z_$][\w$]*)\s*$',r);names.append(mm.group(1) if mm else '')
                  op=t.find('{',m.start(),m.end()+2);cp=match(t,op,'{','}') if op>=0 else None;body=t[op+1:cp] if cp else ''
                  fby={};sem={}
                  for i,n in enumerate(names):
                      if not n:continue
                      mm=re.search(r'this\.([A-Za-z_$][\w$]*)\s*=\s*'+re.escape(n)+r'\s*;',body)
                      if mm:
                          fld=mm.group(1);fby[i]=fld;sem[i]=sorted(set([n,fld])|set(mdl['field_semantics'].get(fld,[])))
                  out.append({'arity':len(names),'param_names':names,'field_by_param':fby,'semantics_by_param':sem})
              return out
          def converter_method(t):
              rx=re.compile(r'(?s)(?P<sig>(?:(?:public|private|protected|static|final)\s+)+[^\{;]{0,800}?AiAssistantAnswer[^\{;]{0,300}?\((?P<params>[^)]*AiAssistantAnswerResponse[^)]*)\))\s*\{')
              for m in rx.finditer(t):
                  pm=re.search(r'AiAssistantAnswerResponse\s+([A-Za-z_$][\w$]*)',m.group('params'))
                  if not pm:continue
                  op=t.find('{',m.start(),m.end()+2);cp=match(t,op,'{','}')
                  if cp is None:continue
                  return re.sub(r'\s+',' ',m.group('sig')).strip(),t[op+1:cp],pm.group(1)
              return None,None,None
          def rooted(expr,ident,mdl=None):
              out=set();crx=re.compile(r'\b'+re.escape(ident)+r'((?:\s*\.\s*(?:get|is)[A-Za-z_$][\w$]*\s*\(\s*\))+)',re.S)
              for cm in crx.finditer(expr):
                  for gm in GCALL_RX.finditer(cm.group(1)):
                      suf=gm.group(1);out.add(suf)
                      if mdl:
                          row=mdl['getters'].get('get'+suf) or mdl['getters'].get('is'+suf)
                          if row:out.update(row['names'])
              return out
          def taint(expr,rp,assigns,rmdl,depth=0,seen=None):
              seen=seen or set()
              if depth>8:return False,set(),[]
              d=bool(re.search(r'\b'+re.escape(rp)+r'\b',expr));sem=rooted(expr,rp,rmdl);paths=[]
              if d:paths.append('direct-response')
              for ident in IDENT_RX.findall(expr):
                  if ident==rp or ident in seen or ident not in assigns:continue
                  for rhs in assigns[ident]:
                      dd,ss,pp=taint(rhs,rp,assigns,rmdl,depth+1,seen|{ident})
                      if dd:
                          d=True;sem|=ss;sem|=rooted(expr,ident);paths.append('local:'+ident);paths+=pp
              return d,sem,paths[:30]

          n,h=digest('/tmp/okko/okko.pkg');assert n==45942514 and h==EXPECTED
          conv=one(Path('ru/okko/sdk/domain/converters/aiAssistant/AiAssistantDomainConverter.java'),'AiAssistantDomainConverter.java')
          resp=one(Path('ru/okko/sdk/domain/oldEntity/response/aiAssistant/AiAssistantAnswerResponse.java'),'AiAssistantAnswerResponse.java')
          dom=one(Path('ru/okko/sdk/domain/entity/aiAssistant/model/AiAssistantAnswer.java'),'AiAssistantAnswer.java')
          repo=one(Path('ru/okko/sdk/data/repository/aiAssistant/AiAssistantRepositoryImpl.java'),'AiAssistantRepositoryImpl.java')
          provider=one(Path('ru/okko/commonApp/internal/di/modules/lazyApi/RekkoGatewayApiProvider.java'),'RekkoGatewayApiProvider.java')

          rmdl=model(resp);dmdl=model(dom);ctors=constructors(dom,dmdl)
          sig,body,rp=converter_method(text(conv));maps=[]
          if body and rp:
              assigns={}
              for m in ASSIGN_RX.finditer(body):assigns.setdefault(m.group(1),[]).append(m.group(2).strip())
              nrx=re.compile(r'\bnew\s+(?:[A-Za-z_$][\w$]*\.)*AiAssistantAnswer\s*\(')
              for nm in nrx.finditer(body):
                  op=body.find('(',nm.start(),nm.end()+2);cp=match(body,op,'(',')') if op>=0 else None
                  if cp is None:continue
                  args=split_args(body[op+1:cp]);ctor=next((c for c in ctors if c['arity']==len(args)),None)
                  for i,a in enumerate(args):
                      der,src,paths=taint(a,rp,assigns,rmdl);dest=set()
                      if ctor and i<len(ctor['param_names']):dest.add(ctor['param_names'][i])
                      if ctor and i in ctor['semantics_by_param']:dest.update(ctor['semantics_by_param'][i])
                      maps.append({'index':i,'response_derived':der,'source_semantics':sorted(src),'destination_semantics':sorted(dest),'strength':strength(set(src)|dest),'dataflow_paths':paths})
          live_repo=bool(re.search(r'AiAssistantDomainConverter',text(repo)) and re.search(r'\.f\.a\s*\([^\n]{0,200}AiAssistantAnswerResponse',text(repo)))
          strict=[x for x in maps if x['response_derived'] and x['strength']=='strong-private']

          pt=text(provider)
          dynamic=bool('getConfig().getRekkoGatewayUrlV2()' in pt and '.baseUrl(' in pt)
          getter_owners=[];config_impl=[];config_routes=[];config_urls=[]
          retrofit=re.compile(r'@(GET|POST|PUT|DELETE|PATCH|HEAD)\s*\(\s*"([^"]+)"\s*\)')
          for p in SRC.rglob('*.java'):
              try:t=text(p)
              except Exception:continue
              rr=rel(p)
              if 'getRekkoGatewayUrlV2' in t or 'rekkoGatewayUrlV2' in t:
                  gm=re.search(r'(?s)(?:public|private|protected)[^\{;]{0,500}?getRekkoGatewayUrlV2\s*\([^)]*\)\s*\{(.{0,1600}?)\}',t)
                  ret=None
                  if gm:
                      rm=re.search(r'\breturn\s+([^;]+);',gm.group(1));ret=rm.group(1).strip() if rm else None
                  urls=sorted(set(URL_RX.findall(t)))
                  getter_owners.append({'path':rr,'return_expression':ret,'urls':urls[:20]})
              if re.search(r'\bimplements\s+(?:ru\.okko\.sdk\.domain\.repository\.login\.)?ConfigRepository\b',t):config_impl.append(rr)
              if re.search(r'(?i)(ConfigRepository|ConfigApi|GetConfigUseCase|config\.tvgateway|getConfig\s*\()',t):
                  us=sorted(set(URL_RX.findall(t)))
                  if us:config_urls += [{'path':rr,'url':u} for u in us]
                  for rm in retrofit.finditer(t):
                      config_routes.append({'path':rr,'verb':rm.group(1),'route':rm.group(2)})
          direct_hosts=[]
          for row in getter_owners:
              for u in row['urls']:
                  hm=HOST_RX.search(u)
                  if hm:direct_hosts.append(hm.group(1).lower().rstrip('.'))

          report={
            'status':'ok','run_rev':'v191.0',
            'package_identity':{'version_name':'8.180.0','bytes':n,'sha256':h},
            'network_policy':{'okko_requests':0,'protected_requests':0,'runtime_started':False,'credentials_read':False,'mutations':0,'third_party_accounts':0,'identifier_enumeration':False,'certificate_or_trust_override':False,'static_only':True},
            'converter':{
              'path':rel(conv),'response_model':rmdl,'domain_model':dmdl,
              'method_signature':sig,'response_param':rp,'live_repository_binding_proven':live_repo,
              'mappings':maps,'strict_private_mapping_count':len(strict),
              'strict_private_answer_payload_proven':bool(live_repo and sig and strict),
            },
            'config':{
              'provider_path':rel(provider),'dynamic_config_to_baseurl_proven':dynamic,
              'getter_owners':getter_owners[:50],'config_repository_implementers':sorted(set(config_impl))[:50],
              'config_routes':config_routes[:100],'config_urls':config_urls[:100],
              'direct_rekko_hosts':sorted(set(direct_hosts)),
              'exact_rekko_host_proven':len(set(direct_hosts))==1,
            },
            'decision':{'vulnerability_proven':False,'reportable':False,'runtime_authorized':False}
          }
          OUT.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'converter':report['converter'],'config':report['config']},ensure_ascii=False,indent=2)[:50000])
          PY

      - name: Validate and upload derived evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/okko-v191.json',encoding='utf-8'))
          assert d['package_identity']=={'version_name':'8.180.0','bytes':45942514,'sha256':'b00bca9cb327ab3ee483b46d390c9120ac28bfc7674c75fda0129c6c594cc1f9'}
          n=d['network_policy']
          assert n['okko_requests']==0 and n['protected_requests']==0 and n['runtime_started'] is False
          assert n['credentials_read'] is False and n['mutations']==0 and n['identifier_enumeration'] is False
          assert n['certificate_or_trust_override'] is False
          print(json.dumps({'private_payload':d['converter']['strict_private_answer_payload_proven'],'exact_host':d['config']['exact_rekko_host_proven']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okko-exact-static-v191
          path: |
            /tmp/okko-v191.json
            /tmp/jadx.stderr
          if-no-files-found: warn
          retention-days: 7

# Exact byte-identical public Okko 8.180.0 package only, fetched through the trusted official
# static.rustore.ru CDN alias. Native TLS verification remains enabled. Derived evidence only is uploaded.
# Zero Okko target/protected requests, credentials, mutations, enumeration or certificate/trust override.
