name: Exact Rekko contracts and active-profile provenance v196

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and verify exact Okko 8.180.0, then decompile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/okko
          curl --location --fail --retry 2 --silent --show-error \
            --output /tmp/okko/okko.pkg \
            'https://static.rustore.ru/2026/8/14/7b/de764e6d-0184-4e0f-a7c6-0b6a30580a79.zip'
          python3 - <<'PY'
          import hashlib,shutil,zipfile
          from pathlib import Path
          p=Path('/tmp/okko/okko.pkg');h=hashlib.sha256();n=0
          with p.open('rb') as f:
              for b in iter(lambda:f.read(1024*1024),b''):
                  n+=len(b);h.update(b)
          got=h.hexdigest();print({'bytes':n,'sha256':got})
          assert n==45942514 and got=='b00bca9cb327ab3ee483b46d390c9120ac28bfc7674c75fda0129c6c594cc1f9'
          out=Path('/tmp/okko/okko.apk')
          with zipfile.ZipFile(p) as z:
              apks=[x for x in z.infolist() if x.filename.lower().endswith('.apk')]
              if apks:
                  info=max(apks,key=lambda x:x.file_size)
                  with z.open(info) as src,out.open('wb') as dst:shutil.copyfileobj(src,dst,1024*1024)
              else:shutil.copy2(p,out)
          PY
          URL=$(python3 - <<'PY'
          import json,urllib.request
          d=json.load(urllib.request.urlopen('https://api.github.com/repos/skylot/jadx/releases/latest',timeout=30))
          print([a['browser_download_url'] for a in d['assets'] if a['name'].startswith('jadx-') and a['name'].endswith('.zip')][0])
          PY
          )
          curl -L --fail --retry 2 "$URL" -o /tmp/jadx.zip
          mkdir -p /tmp/jadx && unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          /tmp/jadx/bin/jadx --no-res --no-imports --show-bad-code --threads-count 4 \
            -d /tmp/okko/jadx /tmp/okko/okko.apk >/tmp/jadx.stdout 2>/tmp/jadx.stderr || true
          test -d /tmp/okko/jadx/sources

      - name: Derive exact endpoint contracts and active profile provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json,re
          from pathlib import Path

          SRC=Path('/tmp/okko/jadx/sources');OUT=Path('/tmp/okko-v196.json')
          API='ru/okko/sdk/data/network/api/RekkoGatewayApi.java'
          FIRST=('ru/okko/','ru/more/play/','p003nskobfuscated/','nskobfuscated/')
          STR_RX=re.compile(r'"([^"\\]*(?:\\.[^"\\]*)*)"')
          ANN_RX=re.compile(r'@(?:retrofit2\.http\.)?([A-Za-z]+)(?:\s*\(\s*"([^"]*)"\s*\))?')
          HTTP={'GET','POST','PUT','PATCH','DELETE','HEAD'}

          def rel(p):return str(p.relative_to(SRC)).replace('\\','/')
          def rd(p):return p.read_text(encoding='utf-8',errors='replace')
          def redact(s):return STR_RX.sub('"<lit>"',s)[:5000]
          def split_top(s):
              out=[];st=0;dp=db=ds=da=0;q=None;esc=False
              for i,c in enumerate(s):
                  if q:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c==q:q=None
                      continue
                  if c in ('"',"'"):q=c
                  elif c=='(':dp+=1
                  elif c==')':dp-=1
                  elif c=='{':db+=1
                  elif c=='}':db-=1
                  elif c=='[':ds+=1
                  elif c==']':ds-=1
                  elif c=='<':da+=1
                  elif c=='>':da=max(0,da-1)
                  elif c==',' and dp==db==ds==da==0:
                      out.append(s[st:i].strip());st=i+1
              out.append(s[st:].strip());return [x for x in out if x]
          def line_slice(lines,line,b=12,a=18):
              lo=max(1,line-b);hi=min(len(lines),line+a)
              return {'start':lo,'end':hi,'text':'\n'.join(f'{i:05d}: {redact(lines[i-1])}' for i in range(lo,hi+1))}
          def match_paren(t,op):
              d=0;q=None;esc=False
              for i in range(op,len(t)):
                  c=t[i]
                  if q:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c==q:q=None
                      continue
                  if c in ('"',"'"):q=c;continue
                  if c=='(':d+=1
                  elif c==')':
                      d-=1
                      if d==0:return i
              return None
          def methods(text):
              rows=[]
              rx=re.compile(r'(?m)^\s*(?:(?:public|private|protected|static|final|synchronized|native|abstract)\s+)+[^;={}]{1,1800}\([^;{}]*\)\s*(?:throws [^{]+)?\{')
              for m in rx.finditer(text):
                  op=text.find('{',m.start(),m.end()+2);d=0;q=None;esc=False;end=None
                  for i in range(op,len(text)):
                      c=text[i]
                      if q:
                          if esc:esc=False
                          elif c=='\\':esc=True
                          elif c==q:q=None
                          continue
                      if c in ('"',"'"):q=c;continue
                      if c=='{':d+=1
                      elif c=='}':
                          d-=1
                          if d==0:end=i+1;break
                  if end:rows.append({'start':m.start(),'end':end,'sig':re.sub(r'\s+',' ',m.group(0)[:-1]).strip()[:1800]})
              return rows
          def owner(ms,pos):
              x=[m for m in ms if m['start']<=pos<m['end']]
              return x[-1] if x else None

          # 1) Exact Retrofit contracts from interface source.
          api=SRC/API
          if not api.is_file():raise SystemExit('RekkoGatewayApi source missing')
          at=rd(api);al=at.splitlines();contracts=[]
          for target in ('getAiAssistantAnswer','getAiAssistantAnswerToken'):
              # Capture annotation block plus declaration up to semicolon.
              mm=re.search(r'(?s)((?:\s*@[^\n]+\n){1,12}\s*[^;]{0,5000}?\b'+target+r'\s*\((.*?)\)\s*;)',at)
              if not mm:continue
              block=mm.group(1);params_raw=mm.group(2);anns=[]
              for am in ANN_RX.finditer(block):
                  kind=am.group(1);val=am.group(2)
                  if kind.upper() in HTTP:anns.append({'kind':kind.upper(),'value':val})
              params=[]
              for idx,p in enumerate(split_top(params_raw)):
                  pann=[]
                  for am in ANN_RX.finditer(p):pann.append({'kind':am.group(1),'value':am.group(2)})
                  cleaned=re.sub(r'@[\w.$]+(?:\([^)]*\))?\s*','',p).strip()
                  nm=re.search(r'([A-Za-z_$][\w$]*)\s*$',cleaned)
                  params.append({'index':idx,'name':nm.group(1) if nm else None,'declaration':redact(cleaned),'annotations':pann})
              contracts.append({'method':target,'http_annotations':anns,'params':params,'declaration_shape':redact(block)})

          # 2) Exact repository callsites and caller-boundary constructor captures.
          repo=SRC/'ru/okko/sdk/data/repository/aiAssistant/AiAssistantRepositoryImpl.java'
          rt=rd(repo);rl=rt.splitlines();rms=methods(rt);repo_calls=[]
          for target in ('getAiAssistantAnswer','getAiAssistantAnswerToken'):
              for cm in re.finditer(r'\.'+target+r'\s*\(',rt):
                  op=rt.find('(',cm.start(),cm.end()+1);cp=match_paren(rt,op)
                  if cp is None:continue
                  line=rt[:cm.start()].count('\n')+1;mo=owner(rms,cm.start())
                  repo_calls.append({'target':target,'line':line,'args':[redact(x) for x in split_top(rt[op+1:cp])],
                                     'owner_method':mo['sig'] if mo else None,'slice':line_slice(rl,line,24,28)})

          captures=[]
          for m in re.finditer(r'this\.\$(assistantRequestToken|activeMultiProfileId)\s*=\s*([A-Za-z_$][\w$]*)\s*;',rt):
              line=rt[:m.start()].count('\n')+1;mo=owner(rms,m.start())
              captures.append({'capture':m.group(1),'from_param':m.group(2),'line':line,'owner':mo['sig'] if mo else None,'slice':line_slice(rl,line,8,10)})

          # 3) Search first-party source for active profile provenance markers.
          marker_rx=re.compile(r'(?i)(activeMultiProfileId|getActiveMultiProfileId|activeProfileId|getActiveProfile|multiProfileId|getMultiProfile|CurrentProfile|ActiveProfile)')
          profile_rows=[]
          profile_paths=[]
          for p in SRC.rglob('*.java'):
              rp=rel(p)
              if not rp.startswith(FIRST):continue
              try:t=rd(p)
              except Exception:continue
              if not marker_rx.search(t):continue
              ls=t.splitlines();hits=[i for i,x in enumerate(ls,1) if marker_rx.search(x)]
              score=0
              low=(rp+' '+t[:8000]).lower()
              for tok,w in [('repository',5),('usecase',5),('profile',4),('active',3),('session',2),('config',1),('api',2)]:
                  if tok in low:score+=w
              profile_paths.append({'path':rp,'score':score,'hit_count':len(hits)})
              for i in hits[:10]:
                  profile_rows.append({'path':rp,'line':i,'text':redact(ls[i-1]),'slice':line_slice(ls,i,7,9)})
          profile_paths.sort(key=lambda x:(x['score'],x['hit_count']),reverse=True)

          # 4) Retrofit endpoints whose declaration contains profile identifiers.
          profile_endpoints=[]
          http_rx=re.compile(r'@(?:retrofit2\.http\.)?(GET|POST|PUT|PATCH|DELETE|HEAD)\s*\(\s*"([^"]*)"\s*\)')
          for p in SRC.rglob('*.java'):
              rp=rel(p)
              if not rp.startswith(FIRST):continue
              try:t=rd(p)
              except Exception:continue
              for hm in http_rx.finditer(t):
                  tail=t[hm.end():hm.end()+4500]
                  semi=tail.find(';');decl=tail[:semi+1] if semi>=0 else tail[:1800]
                  if re.search(r'(?i)(activeMultiProfileId|multiProfileId|profileId|activeProfile)',decl):
                      profile_endpoints.append({'path':rp,'verb':hm.group(1),'route':hm.group(2),'declaration_shape':redact(re.sub(r'\s+',' ',decl))[:2500]})

          # 5) Locate profile-centric domain/repository classes by filename and content.
          profile_classes=[]
          for p in SRC.rglob('*.java'):
              rp=rel(p)
              if not rp.startswith(FIRST):continue
              bn=p.name.lower()
              if 'profile' not in bn:continue
              try:t=rd(p)
              except Exception:continue
              if not re.search(r'(?i)(profileId|active|current|multiProfile)',t):continue
              sigs=[]
              for m in methods(t)[:80]:
                  if re.search(r'(?i)(profile|active|current)',m['sig']):sigs.append(m['sig'])
              profile_classes.append({'path':rp,'methods':sigs[:30]})

          report={
            'status':'ok','run_rev':'v196.0',
            'package_identity':{'version_name':'8.180.0','bytes':45942514,'sha256':'b00bca9cb327ab3ee483b46d390c9120ac28bfc7674c75fda0129c6c594cc1f9'},
            'network_policy':{'okko_requests':0,'protected_requests':0,'runtime_started':False,'credentials_read':False,'mutations':0,'identifier_enumeration':False,'certificate_or_trust_override':False,'static_only':True},
            'rekko_contracts':contracts,
            'repository_calls':repo_calls,
            'caller_capture_assignments':captures,
            'active_profile':{
              'ranked_paths':profile_paths[:100],
              'occurrences':profile_rows[:160],
              'profile_endpoints':profile_endpoints[:100],
              'profile_classes':profile_classes[:100]
            },
            'summary':{
              'contract_count':len(contracts),
              'consumer_contract_proven':any(x['method']=='getAiAssistantAnswer' for x in contracts),
              'producer_contract_proven':any(x['method']=='getAiAssistantAnswerToken' for x in contracts),
              'caller_capture_count':len(captures),
              'active_profile_occurrence_count':len(profile_rows),
              'profile_endpoint_count':len(profile_endpoints),
              'vulnerability_proven':False
            },
            'decision':{'vulnerability_proven':False,'reportable':False,'runtime_authorized':False}
          }
          OUT.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'summary':report['summary'],'contracts':contracts,'repo_calls':repo_calls,'captures':captures,
                            'profile_paths':profile_paths[:30],'profile_endpoints':profile_endpoints[:30],'profile_classes':profile_classes[:30]},ensure_ascii=False,indent=2)[:70000])
          PY
      - name: Upload derived evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okko-rekko-contract-profile-v196
          path: |
            /tmp/okko-v196.json
            /tmp/jadx.stderr
          if-no-files-found: warn
          retention-days: 7

# Byte-identical public Okko 8.180.0, trusted official RuStore CDN alias, native TLS.
# Static endpoint/profile provenance only; zero Okko target/protected requests or credential access.
