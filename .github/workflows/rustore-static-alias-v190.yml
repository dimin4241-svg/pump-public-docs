name: Resolve Rekko sid and local active-profile path v197

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact package and decompile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/okko
          curl --location --fail --retry 2 --silent --show-error \
            --output /tmp/okko/okko.pkg \
            'https://static.rustore.ru/2026/8/14/7b/de764e6d-0184-4e0f-a7c6-0b6a30580a79.zip'
          python3 - <<'PY'
          import hashlib,shutil,zipfile
          from pathlib import Path
          p=Path('/tmp/okko/okko.pkg');h=hashlib.sha256();n=0
          with p.open('rb') as f:
              for b in iter(lambda:f.read(1024*1024),b''):
                  n+=len(b);h.update(b)
          assert n==45942514 and h.hexdigest()=='b00bca9cb327ab3ee483b46d390c9120ac28bfc7674c75fda0129c6c594cc1f9'
          out=Path('/tmp/okko/okko.apk')
          with zipfile.ZipFile(p) as z:
              apks=[x for x in z.infolist() if x.filename.lower().endswith('.apk')]
              if apks:
                  info=max(apks,key=lambda x:x.file_size)
                  with z.open(info) as src,out.open('wb') as dst:shutil.copyfileobj(src,dst,1024*1024)
              else:shutil.copy2(p,out)
          PY
          URL=$(python3 - <<'PY'
          import json,urllib.request
          d=json.load(urllib.request.urlopen('https://api.github.com/repos/skylot/jadx/releases/latest',timeout=30))
          print([a['browser_download_url'] for a in d['assets'] if a['name'].startswith('jadx-') and a['name'].endswith('.zip')][0])
          PY
          )
          curl -L --fail --retry 2 "$URL" -o /tmp/jadx.zip
          mkdir -p /tmp/jadx && unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          /tmp/jadx/bin/jadx --no-res --no-imports --show-bad-code --threads-count 4 \
            -d /tmp/okko/jadx /tmp/okko/okko.apk >/tmp/jadx.stdout 2>/tmp/jadx.stderr || true
          test -d /tmp/okko/jadx/sources

      - name: Resolve sid constant and local profile source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json,re
          from pathlib import Path
          SRC=Path('/tmp/okko/jadx/sources');OUT=Path('/tmp/okko-v197.json')
          FIRST=('ru/okko/','ru/more/play/','p003nskobfuscated/','nskobfuscated/')
          STR_RX=re.compile(r'"([^"\\]*(?:\\.[^"\\]*)*)"')

          def rel(p): return str(p.relative_to(SRC)).replace('\\','/')
          def rd(p): return p.read_text(encoding='utf-8',errors='replace')
          def one(path,base):
              p=SRC/path
              if p.is_file(): return p
              rows=[x for x in SRC.rglob(base) if str(x).replace('\\','/').endswith(str(path).replace('\\','/'))] or list(SRC.rglob(base))
              if len(rows)!=1: raise SystemExit(f'{base}: {len(rows)}')
              return rows[0]
          def redact(s): return STR_RX.sub(lambda m:'"'+m.group(1)+'"' if m.group(1) in {'sid','activeMultiProfileId','assistantRequestToken'} else '"<lit>"',s)[:6000]
          def match_body(t,op):
              d=0;q=None;esc=False
              for i in range(op,len(t)):
                  c=t[i]
                  if q:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c==q:q=None
                      continue
                  if c in ('"',"'"):q=c;continue
                  if c=='{':d+=1
                  elif c=='}':
                      d-=1
                      if d==0:return i+1
              return None
          def methods(t):
              out=[]
              rx=re.compile(r'(?m)^\s*(?:(?:public|private|protected|static|final|synchronized|native|abstract|override)\s+)+[^;={}]{1,1800}\([^;{}]*\)\s*(?:throws [^{]+)?\{')
              for m in rx.finditer(t):
                  op=t.find('{',m.start(),m.end()+2);end=match_body(t,op) if op>=0 else None
                  if end:out.append({'start':m.start(),'end':end,'sig':re.sub(r'\s+',' ',m.group(0)[:-1]).strip()[:1800]})
              return out
          def owner(ms,pos):
              x=[m for m in ms if m['start']<=pos<m['end']]
              return x[-1] if x else None
          def line_slice(t,pos,b=10,a=14):
              ls=t.splitlines();line=t[:pos].count('\n')+1;lo=max(1,line-b);hi=min(len(ls),line+a)
              return {'line':line,'start':lo,'end':hi,'text':'\n'.join(f'{i:05d}: {redact(ls[i-1])}' for i in range(lo,hi+1))}
          def file_summary(p,need_rx=None):
              t=rd(p);ms=methods(t);rows=[]
              if need_rx:
                  for m in need_rx.finditer(t):
                      mo=owner(ms,m.start())
                      rows.append({'match':redact(m.group(0)),'owner':mo['sig'] if mo else None,'slice':line_slice(t,m.start(),10,16)})
              return {'path':rel(p),'method_signatures':[m['sig'] for m in ms[:120]],'matches':rows[:80]}

          # Resolve NetworkConstants.HEADER_SID exactly.
          nc=one(Path('ru/okko/sdk/domain/oldEntity/utils/NetworkConstants.java'),'NetworkConstants.java')
          nt=rd(nc);sid_rows=[]
          for m in re.finditer(r'(?m)^.*\bHEADER_SID\b.*$',nt):
              sid_rows.append({'line':nt[:m.start()].count('\n')+1,'text':redact(m.group(0).strip())})
          sid_literal=None
          for row in sid_rows:
              mm=re.search(r'HEADER_SID\s*=\s*"([^"]+)"',row['text'])
              if mm:sid_literal=mm.group(1)

          gaid=one(Path('ru/okko/sdk/domain/usecase/multiProfile/GetActiveProfileIdUseCase.java'),'GetActiveProfileIdUseCase.java')
          gap=one(Path('ru/okko/sdk/domain/usecase/multiProfile/GetActiveProfileUseCase.java'),'GetActiveProfileUseCase.java')
          mpr=one(Path('ru/okko/sdk/domain/repository/MultiProfileRepository.java'),'MultiProfileRepository.java')
          mpri=one(Path('ru/okko/sdk/data/repository/multiProfile/MultiProfileRepositoryImpl.java'),'MultiProfileRepositoryImpl.java')
          mp=one(Path('ru/okko/sdk/domain/entity/multiProfile/MultiProfile.java'),'MultiProfile.java')
          air=one(Path('ru/okko/sdk/data/repository/aiAssistant/AiAssistantRepositoryImpl.java'),'AiAssistantRepositoryImpl.java')

          focus_rx=re.compile(r'(?i)(activeProfile|profileId|MultiProfile|getId\s*\(|invoke\s*\(|getActiveProfile\s*\()')
          gaid_sum=file_summary(gaid,focus_rx);gap_sum=file_summary(gap,focus_rx);mpr_sum=file_summary(mpr,focus_rx);mpri_sum=file_summary(mpri,focus_rx);mp_sum=file_summary(mp,focus_rx)

          # Find all usages of GetActiveProfileIdUseCase/GetActiveProfileUseCase and direct repository getActiveProfile calls.
          usages=[]
          use_rx=re.compile(r'GetActiveProfileIdUseCase|GetActiveProfileUseCase|\.getActiveProfile\s*\(|\.observeActiveProfile\s*\(')
          for p in SRC.rglob('*.java'):
              rp=rel(p)
              if not rp.startswith(FIRST):continue
              try:t=rd(p)
              except Exception:continue
              if not use_rx.search(t):continue
              ms=methods(t)
              for m in use_rx.finditer(t):
                  mo=owner(ms,m.start())
                  usages.append({'path':rp,'line':t[:m.start()].count('\n')+1,'marker':m.group(0),'owner':mo['sig'] if mo else None,'slice':line_slice(t,m.start(),8,12)})

          # AI repository outer methods that instantiate coroutine classes a/b/c.
          at=rd(air);ams=methods(at);ai_outer=[]
          for rx in (re.compile(r'\bnew\s+a\s*\('),re.compile(r'\bnew\s+b\s*\('),re.compile(r'\bnew\s+c\s*\(')):
              for m in rx.finditer(at):
                  mo=owner(ams,m.start())
                  ai_outer.append({'line':at[:m.start()].count('\n')+1,'marker':m.group(0),'owner':mo['sig'] if mo else None,'slice':line_slice(at,m.start(),12,16)})

          # Interface for AI repository, then usages of its method names if they survive decompilation.
          ai_ifaces=[]
          for p in SRC.rglob('*AiAssistantRepository*.java'):
              rp=rel(p)
              if 'Impl' in p.name or '__Factory' in p.name:continue
              try:t=rd(p)
              except Exception:continue
              ai_ifaces.append({'path':rp,'method_signatures':[m['sig'] for m in methods(t)[:80]],'shape':redact(t[:12000])})

          # Top usages where active-profile usecase and ai-assistant markers coexist in same file/method.
          correlated=[]
          for p in SRC.rglob('*.java'):
              rp=rel(p)
              if not rp.startswith(FIRST):continue
              try:t=rd(p)
              except Exception:continue
              if not re.search(r'GetActiveProfile(?:Id)?UseCase',t):continue
              if not re.search(r'(?i)AiAssistant|assistantRequestToken',t):continue
              ms=methods(t)
              for mo in ms:
                  body=t[mo['start']:mo['end']]
                  if re.search(r'GetActiveProfile(?:Id)?UseCase|activeProfile',body) and re.search(r'(?i)AiAssistant|assistant',body):
                      correlated.append({'path':rp,'owner':mo['sig'],'slice':line_slice(t,mo['start'],0,35)})

          report={
            'status':'ok','run_rev':'v197.0',
            'package_identity':{'version_name':'8.180.0','bytes':45942514,'sha256':'b00bca9cb327ab3ee483b46d390c9120ac28bfc7674c75fda0129c6c594cc1f9'},
            'network_policy':{'okko_requests':0,'protected_requests':0,'runtime_started':False,'credentials_read':False,'mutations':0,'identifier_enumeration':False,'certificate_or_trust_override':False,'static_only':True},
            'network_constants':{'path':rel(nc),'header_sid_rows':sid_rows,'header_sid_literal':sid_literal},
            'active_profile_id_usecase':gaid_sum,
            'active_profile_usecase':gap_sum,
            'multi_profile_repository':mpr_sum,
            'multi_profile_repository_impl':mpri_sum,
            'multi_profile_entity':mp_sum,
            'active_profile_usages':usages[:250],
            'ai_repository_outer_calls':ai_outer,
            'ai_repository_interfaces':ai_ifaces[:20],
            'profile_ai_correlated_methods':correlated[:100],
            'summary':{
              'header_sid_literal_proven':sid_literal is not None,
              'header_sid_literal':sid_literal,
              'active_profile_usecase_found':True,
              'active_profile_usage_count':len(usages),
              'ai_outer_call_count':len(ai_outer),
              'profile_ai_correlated_method_count':len(correlated),
              'vulnerability_proven':False
            },
            'decision':{'vulnerability_proven':False,'reportable':False,'runtime_authorized':False}
          }
          OUT.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'summary':report['summary'],'network_constants':report['network_constants'],
                            'active_profile_id_usecase':gaid_sum,'active_profile_usecase':gap_sum,
                            'ai_outer':ai_outer,'correlated':correlated[:30],'usages':usages[:40]},ensure_ascii=False,indent=2)[:90000])
          PY
      - name: Upload derived evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okko-rekko-profile-local-v197
          path: |
            /tmp/okko-v197.json
            /tmp/jadx.stderr
          if-no-files-found: warn
          retention-days: 7

# Exact public Okko 8.180.0 static analysis via trusted RuStore CDN alias only.
# Zero Okko target requests, credentials, mutations or identifier enumeration.
