name: Exact Rekko V2 config provenance v193

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  config-static:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download and verify exact public Okko package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/okko
          curl --location --fail --retry 2 --silent --show-error \
            --header 'User-Agent: okko-standoff365-static-research/1.0' \
            --output /tmp/okko/okko.pkg \
            'https://static.rustore.ru/2026/8/14/7b/de764e6d-0184-4e0f-a7c6-0b6a30580a79.zip'
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('/tmp/okko/okko.pkg');h=hashlib.sha256();n=0
          with p.open('rb') as f:
              for b in iter(lambda:f.read(1024*1024),b''):
                  n+=len(b);h.update(b)
          assert n==45942514
          assert h.hexdigest()=='b00bca9cb327ab3ee483b46d390c9120ac28bfc7674c75fda0129c6c594cc1f9'
          PY

      - name: Install JADX and decompile exact package
        shell: bash
        run: |
          set -euo pipefail
          URL=$(python3 - <<'PY'
          import json,urllib.request
          d=json.load(urllib.request.urlopen('https://api.github.com/repos/skylot/jadx/releases/latest',timeout=30))
          print([a['browser_download_url'] for a in d['assets'] if a['name'].startswith('jadx-') and a['name'].endswith('.zip')][0])
          PY
          )
          curl -L --fail --retry 2 "$URL" -o /tmp/jadx.zip
          mkdir -p /tmp/jadx && unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          python3 - <<'PY'
          import shutil,zipfile
          from pathlib import Path
          pkg=Path('/tmp/okko/okko.pkg');out=Path('/tmp/okko/okko.apk')
          with zipfile.ZipFile(pkg) as z:
              apks=[x for x in z.infolist() if x.filename.lower().endswith('.apk')]
              if apks:
                  info=max(apks,key=lambda x:x.file_size)
                  with z.open(info) as src,out.open('wb') as dst:shutil.copyfileobj(src,dst,1024*1024)
              else:shutil.copy2(pkg,out)
          PY
          /tmp/jadx/bin/jadx --no-res --no-imports --show-bad-code --threads-count 4 \
            -d /tmp/okko/jadx /tmp/okko/okko.apk >/tmp/jadx.stdout 2>/tmp/jadx.stderr || true
          test -d /tmp/okko/jadx/sources

      - name: Map rekkoGatewayUrlV2 constructor slot and config acquisition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib,json,re
          from pathlib import Path
          SRC=Path('/tmp/okko/jadx/sources')
          OUT=Path('/tmp/okko-v193.json')
          EXPECTED='b00bca9cb327ab3ee483b46d390c9120ac28bfc7674c75fda0129c6c594cc1f9'
          URL_RX=re.compile(r'(?i)https?://[^\s\"\'<>]+')
          HOST_RX=re.compile(r'(?i)^https?://([^/:?#]+)')
          FIELD='rekkoGatewayUrlV2'

          def digest(p):
              h=hashlib.sha256();n=0
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''):
                      n+=len(b);h.update(b)
              return n,h.hexdigest()
          def rel(p):return str(p.relative_to(SRC)).replace('\\','/')
          def rd(p):return p.read_text(encoding='utf-8',errors='replace')
          def one(path,base):
              p=SRC/path
              if p.is_file():return p
              rows=[x for x in SRC.rglob(base) if str(x).replace('\\','/').endswith(str(path).replace('\\','/'))]
              if not rows:rows=list(SRC.rglob(base))
              if len(rows)!=1:raise SystemExit(f'{base}: {len(rows)} matches')
              return rows[0]
          def match(t,op,L,R):
              dep=0;q=None;esc=False
              for i in range(op,len(t)):
                  c=t[i]
                  if q:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c==q:q=None
                      continue
                  if c in ('"',"'"):q=c;continue
                  if c==L:dep+=1
                  elif c==R:
                      dep-=1
                      if dep==0:return i
              return None
          def split_args(s):
              out=[];st=0;dp=db=ds=da=0;q=None;esc=False
              for i,c in enumerate(s):
                  if q:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c==q:q=None
                      continue
                  if c in ('"',"'"):q=c
                  elif c=='(':dp+=1
                  elif c==')':dp-=1
                  elif c=='{':db+=1
                  elif c=='}':db-=1
                  elif c=='[':ds+=1
                  elif c==']':ds-=1
                  elif c=='<':da+=1
                  elif c=='>':da=max(0,da-1)
                  elif c==',' and dp==db==ds==da==0:
                      out.append(s[st:i].strip());st=i+1
              out.append(s[st:].strip())
              return [x for x in out if x]
          def pname(row):
              row=re.sub(r'@[\w.$]+(?:\([^)]*\))?\s*','',row).strip()
              m=re.search(r'([A-Za-z_$][\w$]*)\s*$',row);return m.group(1) if m else ''
          def nearest_method(t,pos):
              prefix=t[:pos]
              rx=re.compile(r'(?m)^\s*(?:(?:public|private|protected|static|final|synchronized)\s+)+[^;{}=]{1,700}\([^;{}]*\)\s*\{')
              ms=list(rx.finditer(prefix[-30000:]));
              return re.sub(r'\s+',' ',ms[-1].group(0)).strip()[:1000] if ms else None
          def clean_expr(s):
              s=re.sub(r'"(?:[^"\\]|\\.)*"',lambda m:m.group(0) if URL_RX.fullmatch(m.group(0).strip('"')) else '"<lit>"',s)
              return re.sub(r'\s+',' ',s).strip()[:1200]

          n,h=digest('/tmp/okko/okko.pkg');assert n==45942514 and h==EXPECTED
          cmr=one(Path('ru/okko/sdk/domain/oldEntity/response/config/ConfigModelResponse.java'),'ConfigModelResponse.java')
          dcmr=one(Path('ru/okko/sdk/domain/oldEntity/response/config/DefaultConfigModelResponse.java'),'DefaultConfigModelResponse.java')
          cmi=one(Path('ru/okko/sdk/data/repository/login/ConfigRepositoryImpl.java'),'ConfigRepositoryImpl.java')
          cmodel=one(Path('ru/okko/sdk/domain/entity/config/ConfigModel.java'),'ConfigModel.java')
          provider=one(Path('ru/okko/commonApp/internal/di/modules/lazyApi/RekkoGatewayApiProvider.java'),'RekkoGatewayApiProvider.java')
          t=rd(cmr);cls='ConfigModelResponse';constructors=[]
          crx=re.compile(r'(?m)^\s*(?:(?:public|private|protected)\s+)?'+cls+r'\s*\(([^)]*)\)\s*\{')
          for m in crx.finditer(t):
              params=split_args(m.group(1));names=[pname(x) for x in params]
              op=t.find('{',m.start(),m.end()+2);cp=match(t,op,'{','}') if op>=0 else None
              if cp is None:continue
              body=t[op+1:cp]
              am=re.search(r'this\.'+FIELD+r'\s*=\s*([A-Za-z_$][\w$]*)\s*;',body)
              idx=names.index(am.group(1)) if am and am.group(1) in names else None
              constructors.append({'arity':len(params),'field_param':am.group(1) if am else None,'field_index':idx,'synthetic':any('DefaultConstructorMarker' in x for x in params)})
          real=[x for x in constructors if x['field_index'] is not None and not x['synthetic']]
          if not real:raise SystemExit('real ConfigModelResponse V2 constructor slot not found')
          slot=real[0]['field_index'];arity=real[0]['arity']

          dt=rd(dcmr);calls=[]
          patterns=[('new ConfigModelResponse',re.compile(r'\bnew\s+(?:[A-Za-z_$][\w$]*\.)*ConfigModelResponse\s*\(')),('super',re.compile(r'\bsuper\s*\('))]
          for kind,rx in patterns:
              for m in rx.finditer(dt):
                  op=dt.find('(',m.start(),m.end()+2);cp=match(dt,op,'(',')') if op>=0 else None
                  if cp is None:continue
                  args=split_args(dt[op+1:cp])
                  if len(args)!=arity or slot>=len(args):continue
                  arg=args[slot];urls=URL_RX.findall(arg);host=None
                  if urls:
                      hm=HOST_RX.search(urls[0]);host=hm.group(1).lower() if hm else None
                  calls.append({'kind':kind,'arity':len(args),'slot':slot,'v2_argument':clean_expr(arg),'v2_urls':urls,'v2_host':host,'context':nearest_method(dt,m.start())})

          # Independently find every Rekko-looking URL in default config and preserve literal identity.
          rekko_literals=[]
          for m in re.finditer(r'"(https?://[^"\s]*rekko[^"\s]*)"',dt,re.I):
              u=m.group(1);hm=HOST_RX.search(u)
              rekko_literals.append({'url':u,'host':hm.group(1).lower() if hm else None,'context':nearest_method(dt,m.start())})

          # Domain ConfigModel keeps the same named property.
          ct=rd(cmodel);domain_getter=bool(re.search(r'getRekkoGatewayUrlV2\s*\(',ct));domain_field=bool(re.search(r'\brekkoGatewayUrlV2\b',ct))
          pt=rd(provider);provider_binding=bool('getConfig().getRekkoGatewayUrlV2()' in pt and '.baseUrl(' in pt)
          rit=rd(cmi)
          repo_facts={
              'getConfig_present':bool(re.search(r'\bgetConfig\s*\(',rit)),
              'default_config_reference':'DefaultConfigModelResponse' in rit,
              'config_model_response_reference':'ConfigModelResponse' in rit,
              'config_model_reference':'ConfigModel' in rit,
          }

          # Recover config Retrofit endpoints by type/route, with fully-qualified annotations supported.
          endpoints=[];host_bindings=[]
          ann=re.compile(r'@(?:retrofit2\.http\.)?(GET|POST|PUT|PATCH|DELETE|HEAD)\s*\(\s*"([^"]+)"\s*\)')
          for p in SRC.rglob('*.java'):
              try:s=rd(p)
              except Exception:continue
              rr=rel(p)
              for m in ann.finditer(s):
                  tail=s[m.end():m.end()+1800]
                  sig=re.sub(r'\s+',' ',tail.split(';',1)[0])[:1200]
                  if re.search(r'(?i)(ConfigModelResponse|ConfigResponse|ConfigRepository|\bconfig\b)',sig) or re.search(r'(?i)(ConfigApi|ConfigService)',rr):
                      endpoints.append({'path':rr,'verb':m.group(1),'route':m.group(2),'signature':clean_expr(sig)})
              if re.search(r'(?i)(ConfigRepository|ConfigApi|ConfigService|GetConfigUseCase|config\.tvgateway|getConfig\s*\()',s):
                  for um in re.finditer(r'"(https?://[^"\s]+)"',s):
                      u=um.group(1)
                      if 'config.tvgateway.ru' in u.lower() or 'pre-config.tvgateway.ru' in u.lower():host_bindings.append({'path':rr,'url':u})

          direct_hosts=sorted(set(x['v2_host'] for x in calls if x.get('v2_host')))
          report={
              'status':'ok','run_rev':'v193.0',
              'package_identity':{'version_name':'8.180.0','bytes':n,'sha256':h},
              'network_policy':{'okko_requests':0,'protected_requests':0,'runtime_started':False,'credentials_read':False,'mutations':0,'identifier_enumeration':False,'certificate_or_trust_override':False,'static_only':True},
              'config_model_response':{'path':rel(cmr),'constructors':constructors,'selected_real_arity':arity,'rekko_v2_param_index':slot},
              'default_config':{'path':rel(dcmr),'mapped_calls':calls,'rekko_literals':rekko_literals},
              'domain_config':{'path':rel(cmodel),'getter_present':domain_getter,'field_present':domain_field},
              'provider':{'path':rel(provider),'dynamic_config_to_retrofit_baseurl_proven':provider_binding},
              'repository':{'path':rel(cmi),**repo_facts},
              'config_network':{'endpoints':endpoints[:100],'config_host_bindings':host_bindings[:100]},
              'derived':{'mapped_v2_hosts':direct_hosts,'mapped_v2_urls':sorted(set(u for x in calls for u in x['v2_urls']))},
              'summary':{
                  'rekko_v2_constructor_slot_proven':slot is not None,
                  'mapped_default_call_count':len(calls),
                  'mapped_v2_host_count':len(direct_hosts),
                  'single_mapped_v2_host_proven':len(direct_hosts)==1,
                  'provider_dynamic_binding_proven':provider_binding,
                  'exact_rekko_v2_host_proven':bool(provider_binding and len(direct_hosts)==1),
                  'vulnerability_proven':False,
              },
              'decision':{'vulnerability_proven':False,'reportable':False,'runtime_authorized':False}
          }
          OUT.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'summary':report['summary'],'derived':report['derived'],'default_calls':calls,'config_network':report['config_network']},ensure_ascii=False,indent=2)[:50000])
          PY

      - name: Upload derived config evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okko-rekko-config-v193
          path: |
            /tmp/okko-v193.json
            /tmp/jadx.stderr
          if-no-files-found: warn
          retention-days: 7

# Byte-identical public Okko 8.180.0, trusted official RuStore CDN alias, native TLS.
# Static config provenance only; zero Okko target/protected traffic or certificate/trust override.
