name: Trace active-profile provider and AI token DTO v199

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact package and decompile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/okko
          curl --location --fail --retry 2 --silent --show-error \
            --output /tmp/okko/okko.pkg \
            'https://static.rustore.ru/2026/8/14/7b/de764e6d-0184-4e0f-a7c6-0b6a30580a79.zip'
          python3 - <<'PY'
          import hashlib,shutil,zipfile
          from pathlib import Path
          p=Path('/tmp/okko/okko.pkg');h=hashlib.sha256();n=0
          with p.open('rb') as f:
              for b in iter(lambda:f.read(1024*1024),b''):
                  n+=len(b);h.update(b)
          assert n==45942514 and h.hexdigest()=='b00bca9cb327ab3ee483b46d390c9120ac28bfc7674c75fda0129c6c594cc1f9'
          out=Path('/tmp/okko/okko.apk')
          with zipfile.ZipFile(p) as z:
              apks=[x for x in z.infolist() if x.filename.lower().endswith('.apk')]
              if apks:
                  info=max(apks,key=lambda x:x.file_size)
                  with z.open(info) as src,out.open('wb') as dst:shutil.copyfileobj(src,dst,1024*1024)
              else:shutil.copy2(p,out)
          PY
          URL=$(python3 - <<'PY'
          import json,urllib.request
          d=json.load(urllib.request.urlopen('https://api.github.com/repos/skylot/jadx/releases/latest',timeout=30))
          print([a['browser_download_url'] for a in d['assets'] if a['name'].startswith('jadx-') and a['name'].endswith('.zip')][0])
          PY
          )
          curl -L --fail --retry 2 "$URL" -o /tmp/jadx.zip
          mkdir -p /tmp/jadx && unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          /tmp/jadx/bin/jadx --no-res --no-imports --show-bad-code --threads-count 4 \
            -d /tmp/okko/jadx /tmp/okko/okko.apk >/tmp/jadx.stdout 2>/tmp/jadx.stderr || true
          test -d /tmp/okko/jadx/sources

      - name: Trace active profile provider and token response semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json,re
          from pathlib import Path
          SRC=Path('/tmp/okko/jadx/sources');OUT=Path('/tmp/okko-v199.json')
          FIRST=('ru/okko/','ru/more/play/','p003nskobfuscated/','nskobfuscated/')
          STR_RX=re.compile(r'"([^"\\]*(?:\\.[^"\\]*)*)"')
          SERIAL_RX=re.compile(r'(?i)(?:SerialName|SerializedName|JsonProperty)\s*\(\s*"([^"\\]{1,160})"')

          def rel(p): return str(p.relative_to(SRC)).replace('\\','/')
          def rd(p): return p.read_text(encoding='utf-8',errors='replace')
          def one(path,base):
              p=SRC/path
              if p.is_file(): return p
              rows=[x for x in SRC.rglob(base) if str(x).replace('\\','/').endswith(str(path).replace('\\','/'))] or list(SRC.rglob(base))
              if len(rows)!=1: raise SystemExit(f'{base}: {len(rows)}')
              return rows[0]
          def redact(s):
              safe={'sid','assistantRequestToken','activeMultiProfileId','assistantClientContext','query','profileId','requestToken'}
              return STR_RX.sub(lambda m:'"'+m.group(1)+'"' if m.group(1) in safe else '"<lit>"',s)[:7000]
          def match_block(t,op,L='{',R='}'):
              d=0;q=None;esc=False
              for i in range(op,len(t)):
                  c=t[i]
                  if q:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c==q:q=None
                      continue
                  if c in ('"',"'"):q=c;continue
                  if c==L:d+=1
                  elif c==R:
                      d-=1
                      if d==0:return i+1
              return None
          def methods(t):
              out=[]
              rx=re.compile(r'(?m)^\s*(?:(?:public|private|protected|static|final|synchronized|native|abstract|default)\s+)+[^;={}]{1,2200}\([^;{}]*\)\s*(?:throws [^{]+)?\{')
              for m in rx.finditer(t):
                  op=t.find('{',m.start(),m.end()+2);end=match_block(t,op) if op>=0 else None
                  if end: out.append({'start':m.start(),'end':end,'sig':re.sub(r'\s+',' ',m.group(0)[:-1]).strip()[:2200]})
              return out
          def owner(ms,pos):
              x=[m for m in ms if m['start']<=pos<m['end']]
              return x[-1] if x else None
          def line_slice(t,pos,b=10,a=15):
              ls=t.splitlines();line=t[:pos].count('\n')+1;lo=max(1,line-b);hi=min(len(ls),line+a)
              return {'line':line,'start':lo,'end':hi,'text':'\n'.join(f'{i:05d}: {redact(ls[i-1])}' for i in range(lo,hi+1))}
          def model(p):
              t=rd(p);ls=t.splitlines();fields=[];getters=[];pending=None
              for i,l in enumerate(ls,1):
                  sm=SERIAL_RX.search(l)
                  if sm:pending=(i,sm.group(1))
                  fm=re.search(r'^\s*(?:(?:public|private|protected|final|static|transient|volatile)\s+)+([A-Za-z0-9_.$<>?, \[\]]+)\s+([A-Za-z_$][\w$]*)\s*(?:;|=)',l)
                  if fm:
                      ser=pending[1] if pending and i-pending[0]<=4 else None
                      fields.append({'line':i,'type':fm.group(1).strip(),'field':fm.group(2),'serialized':ser});pending=None
              for i,l in enumerate(ls,1):
                  gm=re.search(r'\b(get|is)([A-Za-z_$][\w$]*)\s*\(\s*\)\s*\{',l)
                  if gm:
                      tail='\n'.join(ls[i-1:min(len(ls),i+8)]);rm=re.search(r'return\s+(?:this\.)?([A-Za-z_$][\w$]*)\s*;',tail)
                      getters.append({'line':i,'getter':gm.group(1)+gm.group(2),'field':rm.group(1) if rm else None})
              return {'path':rel(p),'fields':fields,'getters':getters,'method_signatures':[m['sig'] for m in methods(t)[:120]]}

          # A) Resolve the obfuscated provider used by GetActiveProfileIdUseCase.
          uoa=one(Path('p003nskobfuscated/uoa.java'),'uoa.java');ut=rd(uoa);ums=methods(ut)
          uoa_info={'path':rel(uoa),'shape':redact(ut[:22000]),'method_signatures':[m['sig'] for m in ums[:120]]}
          implementations=[];bindings=[];usages=[]
          impl_rx=re.compile(r'(?:implements|extends)\s+(?:p003nskobfuscated\.)?uoa\b')
          bind_rx=re.compile(r'(?i)(?:uoa\.class|p003nskobfuscated\.uoa\.class)')
          call_rx=re.compile(r'\.b\s*\(\s*\)')
          for p in SRC.rglob('*.java'):
              rp=rel(p)
              if not rp.startswith(FIRST):continue
              try:t=rd(p)
              except Exception:continue
              ms=methods(t)
              if impl_rx.search(t):
                  rows=[]
                  for m in ms:
                      if re.search(r'\b(?:java\.lang\.)?String\s+b\s*\(\s*\)',m['sig']) or re.search(r'\bb\s*\(\s*\)',m['sig']):
                          rows.append({'signature':m['sig'],'body':redact(t[m['start']:m['end']])[:12000]})
                  implementations.append({'path':rp,'methods':rows,'shape':redact(t[:16000])})
              if bind_rx.search(t):
                  for bm in bind_rx.finditer(t):bindings.append({'path':rp,'slice':line_slice(t,bm.start(),8,12)})
              if 'GetActiveProfileIdUseCase' in t and '.a.b()' in t:
                  for cm in re.finditer(r'GetActiveProfileIdUseCase[^\n]{0,500}?\.a\.b\s*\(\s*\)',t):
                      mo=owner(ms,cm.start());usages.append({'path':rp,'owner':mo['sig'] if mo else None,'slice':line_slice(t,cm.start(),9,12)})

          # B) Token response/domain DTO and converter b path.
          tokresp=one(Path('ru/okko/sdk/domain/oldEntity/response/aiAssistant/AiAssistantAnswerTokenResponse.java'),'AiAssistantAnswerTokenResponse.java')
          tokdom=one(Path('ru/okko/sdk/domain/entity/aiAssistant/model/AiAssistantTokenAnswer.java'),'AiAssistantTokenAnswer.java')
          conv=one(Path('ru/okko/sdk/domain/converters/aiAssistant/AiAssistantDomainConverter.java'),'AiAssistantDomainConverter.java')
          context=one(Path('ru/okko/sdk/data/repository/aiAssistant/model/AiAssistantClientContextRequest.java'),'AiAssistantClientContextRequest.java')
          scope=one(Path('ru/okko/sdk/domain/entity/aiAssistant/AiAssistantContextScope.java'),'AiAssistantContextScope.java')
          tokresp_m=model(tokresp);tokdom_m=model(tokdom);context_m=model(context);scope_t=rd(scope)
          enum_constants=[]
          em=re.search(r'enum\s+AiAssistantContextScope\s*\{([^;}]*)',scope_t,re.S)
          if em:
              for x in re.split(r',',em.group(1)):
                  x=re.sub(r'/\*.*?\*/','',x,flags=re.S).strip();mm=re.match(r'([A-Z][A-Z0-9_]*)\b',x)
                  if mm:enum_constants.append(mm.group(1))
          ct=rd(conv);cms=methods(ct);converter_b=[]
          for m in cms:
              sig=m['sig'];body=ct[m['start']:m['end']]
              if 'AiAssistantAnswerTokenResponse' in sig or ('AiAssistantAnswerTokenResponse' in body and 'AiAssistantTokenAnswer' in body):
                  converter_b.append({'signature':sig,'body':redact(body)[:16000]})

          # C) Find token response/request token usages and normal producer-related domain/usecase chain.
          producer_usages=[]
          marker_rx=re.compile(r'(?i)(AiAssistantTokenAnswer|assistantRequestToken|getAiAssistantAnswerToken|AiAssistantClientContextRequest)')
          for p in SRC.rglob('*.java'):
              rp=rel(p)
              if not rp.startswith(FIRST):continue
              try:t=rd(p)
              except Exception:continue
              if not marker_rx.search(t):continue
              ms=methods(t)
              hits=[]
              for mm in marker_rx.finditer(t):
                  mo=owner(ms,mm.start());hits.append({'marker':mm.group(1),'owner':mo['sig'] if mo else None,'slice':line_slice(t,mm.start(),7,11)})
                  if len(hits)>=20:break
              score=sum(k.lower() in (rp+' '+t[:10000]).lower() for k in ['usecase','assistant','repository','interactor','handler'])
              producer_usages.append({'path':rp,'score':score,'hits':hits})
          producer_usages.sort(key=lambda x:(x['score'],len(x['hits'])),reverse=True)

          # D) AI repository public/outer methods that create coroutine c (producer) or a (consumer).
          air=one(Path('ru/okko/sdk/data/repository/aiAssistant/AiAssistantRepositoryImpl.java'),'AiAssistantRepositoryImpl.java');at=rd(air);ams=methods(at);outer=[]
          for marker,name in [(r'new\s+(?:ru\.okko\.sdk\.data\.repository\.aiAssistant\.AiAssistantRepositoryImpl\.)?a\s*\(','consumer'),(r'new\s+(?:ru\.okko\.sdk\.data\.repository\.aiAssistant\.AiAssistantRepositoryImpl\.)?c\s*\(','producer')]:
              rx=re.compile(marker)
              for mm in rx.finditer(at):
                  mo=owner(ams,mm.start())
                  if mo and ('create(' in mo['sig'] or 'invoke(' in mo['sig']):continue
                  outer.append({'kind':name,'owner':mo['sig'] if mo else None,'slice':line_slice(at,mm.start(),12,16)})

          report={
            'status':'ok','run_rev':'v199.0',
            'package_identity':{'version_name':'8.180.0','bytes':45942514,'sha256':'b00bca9cb327ab3ee483b46d390c9120ac28bfc7674c75fda0129c6c594cc1f9'},
            'network_policy':{'okko_requests':0,'protected_requests':0,'runtime_started':False,'credentials_read':False,'mutations':0,'identifier_enumeration':False,'certificate_or_trust_override':False,'static_only':True},
            'active_profile_provider':{'uoa':uoa_info,'implementations':implementations[:50],'bindings':bindings[:100],'get_active_profile_id_usecase_usages':usages[:100]},
            'token_response':tokresp_m,
            'token_domain':tokdom_m,
            'token_converter':converter_b,
            'client_context_model':context_m,
            'context_scope':{'path':rel(scope),'enum_constants':enum_constants,'shape':redact(scope_t[:16000])},
            'producer_usages':producer_usages[:120],
            'ai_repository_outer_methods':outer,
            'summary':{
              'uoa_implementation_count':len(implementations),
              'uoa_binding_count':len(bindings),
              'active_profile_id_usage_count':len(usages),
              'token_response_field_count':len(tokresp_m['fields']),
              'token_domain_field_count':len(tokdom_m['fields']),
              'token_converter_path_count':len(converter_b),
              'context_scope_enum_count':len(enum_constants),
              'ai_outer_method_count':len(outer),
              'vulnerability_proven':False
            },
            'decision':{'vulnerability_proven':False,'reportable':False,'runtime_authorized':False}
          }
          OUT.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'summary':report['summary'],'uoa':uoa_info,'implementations':implementations[:15],'bindings':bindings[:20],
                            'token_response':tokresp_m,'token_domain':tokdom_m,'token_converter':converter_b,
                            'context_scope':report['context_scope'],'ai_outer':outer,'producer_usages':producer_usages[:25]},ensure_ascii=False,indent=2)[:120000])
          PY
      - name: Upload derived evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okko-rekko-runtime-prereq-v199
          path: |
            /tmp/okko-v199.json
            /tmp/jadx.stderr
          if-no-files-found: warn
          retention-days: 7

# Exact Okko 8.180.0 static analysis only via trusted official RuStore CDN alias.
# Zero Okko target traffic, credentials, mutations or enumeration.
