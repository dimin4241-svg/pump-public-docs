name: Distinguish production Rekko V2 default v194

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact package and decompile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/okko
          curl --location --fail --retry 2 --silent --show-error \
            --output /tmp/okko/okko.pkg \
            'https://static.rustore.ru/2026/8/14/7b/de764e6d-0184-4e0f-a7c6-0b6a30580a79.zip'
          python3 - <<'PY'
          import hashlib,shutil,zipfile
          from pathlib import Path
          p=Path('/tmp/okko/okko.pkg');h=hashlib.sha256();n=0
          with p.open('rb') as f:
              for b in iter(lambda:f.read(1024*1024),b''):
                  n+=len(b);h.update(b)
          assert n==45942514 and h.hexdigest()=='b00bca9cb327ab3ee483b46d390c9120ac28bfc7674c75fda0129c6c594cc1f9'
          out=Path('/tmp/okko/okko.apk')
          with zipfile.ZipFile(p) as z:
              apks=[x for x in z.infolist() if x.filename.lower().endswith('.apk')]
              if apks:
                  info=max(apks,key=lambda x:x.file_size)
                  with z.open(info) as src,out.open('wb') as dst:shutil.copyfileobj(src,dst,1024*1024)
              else:shutil.copy2(p,out)
          PY
          URL=$(python3 - <<'PY'
          import json,urllib.request
          d=json.load(urllib.request.urlopen('https://api.github.com/repos/skylot/jadx/releases/latest',timeout=30))
          print([a['browser_download_url'] for a in d['assets'] if a['name'].startswith('jadx-') and a['name'].endswith('.zip')][0])
          PY
          )
          curl -L --fail --retry 2 "$URL" -o /tmp/jadx.zip
          mkdir -p /tmp/jadx && unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          /tmp/jadx/bin/jadx --no-res --no-imports --show-bad-code --threads-count 4 \
            -d /tmp/okko/jadx /tmp/okko/okko.apk >/tmp/jadx.stdout 2>/tmp/jadx.stderr || true
          test -d /tmp/okko/jadx/sources
      - name: Trace production selection for Rekko V2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json,re
          from pathlib import Path
          SRC=Path('/tmp/okko/jadx/sources');OUT=Path('/tmp/okko-v194.json')
          URL_RX=re.compile(r'https?://[^\s\"\'<>]+',re.I)
          SLOT=93;ARITY=100
          def rel(p):return str(p.relative_to(SRC)).replace('\\','/')
          def rd(p):return p.read_text(encoding='utf-8',errors='replace')
          def one(path,base):
              p=SRC/path
              if p.is_file():return p
              rows=[x for x in SRC.rglob(base) if str(x).replace('\\','/').endswith(str(path).replace('\\','/'))] or list(SRC.rglob(base))
              if len(rows)!=1:raise SystemExit(f'{base}: {len(rows)}')
              return rows[0]
          def match(t,op,L,R):
              d=0;q=None;esc=False
              for i in range(op,len(t)):
                  c=t[i]
                  if q:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c==q:q=None
                      continue
                  if c in ('"',"'"):q=c;continue
                  if c==L:d+=1
                  elif c==R:
                      d-=1
                      if d==0:return i
              return None
          def split_args(s):
              out=[];st=0;dp=db=ds=da=0;q=None;esc=False
              for i,c in enumerate(s):
                  if q:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c==q:q=None
                      continue
                  if c in ('"',"'"):q=c
                  elif c=='(':dp+=1
                  elif c==')':dp-=1
                  elif c=='{':db+=1
                  elif c=='}':db-=1
                  elif c=='[':ds+=1
                  elif c==']':ds-=1
                  elif c=='<':da+=1
                  elif c=='>':da=max(0,da-1)
                  elif c==',' and dp==db==ds==da==0:
                      out.append(s[st:i].strip());st=i+1
              out.append(s[st:].strip());return [x for x in out if x]
          def redact(s):
              def f(m):
                  x=m.group(1)
                  return '"'+x+'"' if URL_RX.fullmatch(x) else '"<lit>"'
              return re.sub(r'"([^"\\]*(?:\\.[^"\\]*)*)"',f,s)
          def slice_lines(ls,line,r=8):
              lo=max(1,line-r);hi=min(len(ls),line+r)
              return {'start':lo,'end':hi,'text':'\n'.join(f'{i:05d}: '+redact(ls[i-1])[:1200] for i in range(lo,hi+1))}
          def methods(t):
              out=[]
              rx=re.compile(r'(?m)^\s*(?:(?:public|private|protected|static|final|synchronized|native|abstract)\s+)+[^;={}]{1,1500}\([^;{}]*\)\s*(?:throws [^{]+)?\{')
              for m in rx.finditer(t):
                  op=t.find('{',m.start(),m.end()+2);cp=match(t,op,'{','}') if op>=0 else None
                  if cp is None:continue
                  out.append({'start':m.start(),'end':cp+1,'sig':re.sub(r'\s+',' ',m.group(0)[:-1]).strip()[:1500]})
              return out
          def owner(ms,pos):
              rows=[m for m in ms if m['start']<=pos<m['end']]
              return rows[-1]['sig'] if rows else '<static-initializer-or-field-init>'

          dflt=one(Path('ru/okko/sdk/domain/oldEntity/response/config/DefaultConfigModelResponse.java'),'DefaultConfigModelResponse.java')
          repo=one(Path('ru/okko/sdk/data/repository/login/ConfigRepositoryImpl.java'),'ConfigRepositoryImpl.java')
          provider=one(Path('ru/okko/commonApp/internal/di/modules/lazyApi/RekkoGatewayApiProvider.java'),'RekkoGatewayApiProvider.java')
          dt=rd(dflt);dls=dt.splitlines();ms=methods(dt)
          fields=[]
          for i,l in enumerate(dls,1):
              fm=re.search(r'^\s*(?:(?:public|private|protected|static|final)\s+)+([^=;]+?)\s+([A-Za-z_$][\w$]*)\s*(?:=|;)',l)
              if fm:fields.append({'line':i,'type':fm.group(1).strip(),'name':fm.group(2)})
          calls=[]
          rx=re.compile(r'\bnew\s+(?:[A-Za-z_$][\w$]*\.)*ConfigModelResponse\s*\(')
          for m in rx.finditer(dt):
              op=dt.find('(',m.start(),m.end()+2);cp=match(dt,op,'(',')') if op>=0 else None
              if cp is None:continue
              args=split_args(dt[op+1:cp])
              if len(args)!=ARITY:continue
              arg=args[SLOT];urls=URL_RX.findall(arg)
              line=dt[:m.start()].count('\n')+1
              left=dt[max(0,m.start()-1200):m.start()]
              assign=None
              am=re.search(r'([A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)?)\s*=\s*$',left)
              if am:assign=am.group(1)
              elif re.search(r'\breturn\s*$',left):assign='<return>'
              around=' '.join(re.findall(r'(?i)\b[A-Za-z_$][\w$]*(?:prod|pre|default|config|debug|release)[A-Za-z_$0-9]*\b',dt[max(0,m.start()-3000):min(len(dt),cp+3000)]))
              calls.append({'line':line,'owner':owner(ms,m.start()),'assignment_target':assign,'v2_argument':redact(arg)[:1000],'v2_urls':urls,'semantic_identifiers_near':sorted(set(around.split()))[:80],'source_slice':slice_lines(dls,line,10)})

          # Every reference to DefaultConfigModelResponse outside its own class.
          refs=[]
          for p in SRC.rglob('*.java'):
              if p==dflt:continue
              try:t=rd(p)
              except Exception:continue
              if 'DefaultConfigModelResponse' not in t:continue
              ls=t.splitlines()
              for i,l in enumerate(ls,1):
                  if 'DefaultConfigModelResponse' not in l:continue
                  ids=sorted(set(re.findall(r'\b[A-Za-z_$][\w$]*\b',l)))
                  refs.append({'path':rel(p),'line':i,'identifiers':ids[:80],'line_shape':re.sub(r'"(?:[^"\\]|\\.)*"','"<lit>"',l.strip())[:1400]})

          # Methods/fields in ConfigRepositoryImpl relevant to default/prod/config source.
          rt=rd(repo);rls=rt.splitlines();rms=methods(rt);repo_methods=[]
          for m in rms:
              body=rt[m['start']:m['end']]
              if re.search(r'(?i)(getConfig|DefaultConfig|production|isProd|preConfig|ConfigApi|ConfigModel)',m['sig']+' '+body):
                  toks=sorted(set(re.findall(r'(?i)\b[A-Za-z_$][\w$]*(?:prod|pre|default|config)[A-Za-z_$0-9]*\b',body)))
                  repo_methods.append({'signature':m['sig'],'semantic_identifiers':toks[:100],'contains_default_config':'DefaultConfigModelResponse' in body,'contains_config_api':'ConfigApi' in body})

          pt=rd(provider)
          host_candidates=sorted(set(u for c in calls for u in c['v2_urls']))
          prod_named=[c for c in calls if any(re.search(r'(?i)(prod|release)',x) for x in c['semantic_identifiers_near']) or (c['assignment_target'] and re.search(r'(?i)(prod|release)',c['assignment_target']))]
          pre_named=[c for c in calls if any(re.search(r'(?i)pre',x) for x in c['semantic_identifiers_near']) or (c['assignment_target'] and re.search(r'(?i)pre',c['assignment_target']))]
          explicit_prod_urls=sorted(set(u for c in prod_named for u in c['v2_urls']))
          explicit_pre_urls=sorted(set(u for c in pre_named for u in c['v2_urls']))
          # Conservative heuristic: a non-pre host can only be labeled production-looking, not proven, unless code naming/usage says prod/release.
          non_pre=sorted(u for u in host_candidates if not re.search(r'(?i)://pre[-.]',u))
          report={
            'status':'ok','run_rev':'v194.0',
            'package_identity':{'version_name':'8.180.0','bytes':45942514,'sha256':'b00bca9cb327ab3ee483b46d390c9120ac28bfc7674c75fda0129c6c594cc1f9'},
            'network_policy':{'okko_requests':0,'protected_requests':0,'runtime_started':False,'credentials_read':False,'mutations':0,'identifier_enumeration':False,'certificate_or_trust_override':False,'static_only':True},
            'default_config':{'path':rel(dflt),'fields':fields,'methods':[m['sig'] for m in ms],'v2_calls':calls},
            'cross_references':refs[:100],
            'config_repository':{'path':rel(repo),'relevant_methods':repo_methods},
            'provider':{'path':rel(provider),'dynamic_v2_to_baseurl_proven':bool('getConfig().getRekkoGatewayUrlV2()' in pt and '.baseUrl(' in pt)},
            'derived':{'all_v2_urls':host_candidates,'explicit_prod_urls':explicit_prod_urls,'explicit_pre_urls':explicit_pre_urls,'non_pre_v2_urls':non_pre},
            'summary':{
              'v2_call_count':len(calls),'explicit_prod_mapping_proven':len(explicit_prod_urls)==1,'explicit_pre_mapping_proven':len(explicit_pre_urls)>=1,
              'single_non_pre_v2_url':len(non_pre)==1,'exact_production_v2_host_proven':bool(len(explicit_prod_urls)==1 and len(non_pre)==1 and explicit_prod_urls==non_pre),
              'vulnerability_proven':False
            },
            'decision':{'vulnerability_proven':False,'reportable':False,'runtime_authorized':False}
          }
          OUT.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'summary':report['summary'],'derived':report['derived'],'calls':calls,'refs':refs[:30],'repo':repo_methods},ensure_ascii=False,indent=2)[:60000])
          PY
      - name: Upload derived evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okko-rekko-production-v194
          path: |
            /tmp/okko-v194.json
            /tmp/jadx.stderr
          if-no-files-found: warn
          retention-days: 7

# Exact byte-identical Okko 8.180.0; trusted official RuStore CDN alias and native TLS.
# Static production/pre-production config selection only. Zero Okko target traffic.
