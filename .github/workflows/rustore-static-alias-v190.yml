name: Verify exact RuStore APK split structure v202.1

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download exact public package and inventory APK entries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/okko
          curl --location --fail --retry 2 --silent --show-error \
            --header 'User-Agent: okko-standoff365-static-research/1.0' \
            --output /tmp/okko/okko.pkg \
            'https://static.rustore.ru/2026/8/14/7b/de764e6d-0184-4e0f-a7c6-0b6a30580a79.zip'
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path

          p=Path('/tmp/okko/okko.pkg'); h=hashlib.sha256(); n=0
          with p.open('rb') as f:
              for b in iter(lambda:f.read(1024*1024),b''):
                  n+=len(b);h.update(b)
          got=h.hexdigest()
          assert n==45942514
          assert got=='b00bca9cb327ab3ee483b46d390c9120ac28bfc7674c75fda0129c6c594cc1f9'
          if not zipfile.is_zipfile(p):
              raise SystemExit('exact RuStore package is not a ZIP container')

          with zipfile.ZipFile(p) as z:
              rows=[]
              for x in z.infolist():
                  if not x.filename.lower().endswith('.apk'): continue
                  rows.append({
                    'name':x.filename,
                    'file_size':x.file_size,
                    'compress_size':x.compress_size,
                    'crc32':f'{x.CRC:08x}',
                    'compression_type':x.compress_type,
                  })
              rows.sort(key=lambda x:x['file_size'],reverse=True)
              all_entries=len(z.infolist())

          report={
            'status':'ok','run_rev':'v202.1-package-structure',
            'package_identity':{'version_name':'8.180.0','bytes':n,'sha256':got},
            'network_policy':{'okko_requests':0,'protected_requests':0,'runtime_started':False,'credentials_read':False,'mutations':0,'identifier_enumeration':False,'certificate_or_trust_override':False,'static_only':True},
            'zip_entry_count':all_entries,
            'apk_entry_count':len(rows),
            'apk_entries':rows,
            'largest_apk':rows[0] if rows else None,
            'summary':{
              'single_apk_container':len(rows)==1,
              'multiple_apk_splits_present':len(rows)>1,
              'reachability_scan_largest_apk_is_container_complete':len(rows)==1,
              'vulnerability_proven':False
            },
            'decision':{
              'vulnerability_proven':False,
              'reportable':False,
              'runtime_authorized':False,
              'next_action':'If apk_entry_count is 1, v201 largest-APK reachability is split-complete. If more than 1, scan every code-bearing APK for AI caller markers before drawing a reachability conclusion.'
            }
          }
          Path('/tmp/okko-package-structure-v202.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Upload derived package evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okko-package-structure-v202
          path: /tmp/okko-package-structure-v202.json
          if-no-files-found: warn
          retention-days: 7

# Exact public Okko 8.180.0 package inventory only via trusted official RuStore CDN alias.
# Native TLS verification remains enabled. Zero Okko target traffic, credentials, mutations or enumeration.
