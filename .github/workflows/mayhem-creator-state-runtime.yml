name: mayhem-creator-state-runtime
on:
  push:
    paths:
      - '.github/workflows/mayhem-creator-state-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @pump-fun/pump-swap-sdk@1.19.0 @pump-fun/pump-sdk@1.36.0 @solana/web3.js
      - name: Simulation-only set/migrate coin creator state transitions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {Connection,PublicKey,TransactionMessage,VersionedTransaction,Keypair} from '@solana/web3.js';
          import {OnlinePumpAmmSdk,PUMP_AMM_SDK,getPumpAmmProgram,PUMP_AMM_PROGRAM_ID} from '@pump-fun/pump-swap-sdk';
          const RPC='https://api.mainnet-beta.solana.com', connection=new Connection(RPC,'confirmed');
          const online=new OnlinePumpAmmSdk(connection), program=getPumpAmmProgram(connection);
          const POOL=new PublicKey('DSV2CUbhfEWRPRn9QRZWkYohRi47WEeauz8s89ekKBdN');
          const PAYER=new PublicKey('Gygj9QQby4j2jryqyqBHvLP7ctv2SaANgh4sCb69BUpA');
          const safe=v=>{if(v==null)return v;if(v?.toBase58)return v.toBase58();if(v?.toString&&typeof v!=='object')return v.toString();if(Array.isArray(v))return v.map(safe);if(typeof v==='object'){const o={};for(const [k,z] of Object.entries(v))o[k]=safe(z);return o}return v};
          const pre=await online.fetchPool(POOL); console.log('PRE_POOL',JSON.stringify(safe(pre),null,2));
          function ixDesc(ix){return {program:ix.programId.toBase58(),data:Buffer.from(ix.data).toString('hex'),keys:ix.keys.map((k,i)=>({i,pk:k.pubkey.toBase58(),s:k.isSigner,w:k.isWritable}))}}
          function parse(logs){const t=(logs??[]).join('\n');return {account:t.match(/AnchorError caused by account: ([A-Za-z0-9_\-]+)/)?.[1]??null,code:t.match(/Error Code: ([A-Za-z0-9_]+)/)?.[1]??null,num:Number(t.match(/Error Number: (\d+)/)?.[1]??0)||null,interesting:(logs??[]).filter(x=>/Instruction:|AnchorError|Error Code|Error Number|Left:|Right:|failed|success|creator|sharing/i.test(x)).slice(-80)}}
          async function sim(label,ix){const {blockhash}=await connection.getLatestBlockhash('processed');const msg=new TransactionMessage({payerKey:PAYER,recentBlockhash:blockhash,instructions:[ix]}).compileToV0Message();const tx=new VersionedTransaction(msg);const raw=Buffer.from(tx.serialize()).toString('base64');const req={jsonrpc:'2.0',id:1,method:'simulateTransaction',params:[raw,{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'processed',accounts:{encoding:'base64',addresses:[POOL.toBase58()]}}]};const r=await fetch(RPC,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-simulation-only-creator-state/1.0'},body:JSON.stringify(req)});const j=await r.json();if(j.error)throw Error(JSON.stringify(j.error));const v=j.result.value,e=parse(v.logs);let post=null,postErr=null;try{const a=v.accounts?.[0];if(a?.data?.[0])post=PUMP_AMM_SDK.decodePool(Buffer.from(a.data[0],'base64'))}catch(x){postErr=String(x)}console.log('\nSIM',label,JSON.stringify({err:v.err,units:v.unitsConsumed,account:e.account,code:e.code,num:e.num,preCoinCreator:pre.coinCreator.toBase58(),postPool:post?safe(post):null,postDecodeError:postErr,interesting:e.interesting},null,2));return {v,e,post}}

          // Public set_coin_creator has no signer in the IDL. Test its canonical behavior and seed guards.
          const setIx=await PUMP_AMM_SDK.setCoinCreator(POOL);console.log('SET_IX',JSON.stringify(ixDesc(setIx),null,2));
          await sim('set_coin_creator_control',setIx);
          if(setIx.keys.length>=3){let bad={...setIx,keys:setIx.keys.map(k=>({...k}))};bad.keys[1]={...bad.keys[1],pubkey:Keypair.generate().publicKey};await sim('set_coin_creator_random_metadata',bad);bad={...setIx,keys:setIx.keys.map(k=>({...k}))};bad.keys[2]={...bad.keys[2],pubkey:Keypair.generate().publicKey};await sim('set_coin_creator_random_bonding_curve',bad)}

          // Public migrate path: let Anchor resolve the canonical sharing_config PDA from the live pool.
          let migIx=null;
          try{migIx=await program.methods.migratePoolCoinCreator().accountsPartial({pool:POOL}).instruction();console.log('MIGRATE_IX',JSON.stringify(ixDesc(migIx),null,2));await sim('migrate_pool_coin_creator_control',migIx)}catch(e){console.log('MIGRATE_BUILD_OR_SIM_FAIL',String(e).slice(0,1200))}
          if(migIx?.keys?.length>=2){const bad={...migIx,keys:migIx.keys.map(k=>({...k}))};bad.keys[1]={...bad.keys[1],pubkey:Keypair.generate().publicKey};await sim('migrate_random_sharing_config',bad)}
          NODE