name: mayhem-signer-cluster
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/mayhem-signer-cluster.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cluster:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save bs58
      - name: Read-only signer clustering
        shell: bash
        run: |
          cat > x.mjs <<'NODE'
          import bs58pkg from 'bs58';const bs58=bs58pkg.default??bs58pkg;
          const MAY='MAyhSmzXzV1pTf7LsNkrNwkWKTo4ougAJ1PPg47MD4e';
          const NAMES={
            '66063d1201daebea':'Buy','b817ee6167c5d33d':'BuyV2','de939d076c089151':'BuyPumpSwap',
            '33e685a4017f83ad':'Sell','5df6823ce7e940b2':'SellV2','10c691f0ee6589cb':'SellPumpSwap'
          };
          const RPCS=['https://rpc.solanatracker.io/public','https://api.mainnet-beta.solana.com'];let id=1;const sl=m=>new Promise(r=>setTimeout(r,m));
          async function q(u,m,p){const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-readonly/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j.error)throw Error(JSON.stringify(j.error));return j.result}
          async function call(m,p){let e;for(const u of RPCS){for(let n=0;n<5;n++)try{return await q(u,m,p)}catch(x){e=x;await sl(250+450*n)}console.log('RPC_FAIL',m,u,String(e).slice(0,140))}throw e}
          const sigs=[];let before;for(let p=0;p<2;p++){const opt={limit:100};if(before)opt.before=before;const a=await call('getSignaturesForAddress',[MAY,opt]);sigs.push(...a.filter(x=>!x.err));if(a.length<100)break;before=a.at(-1).signature;await sl(150)}console.log('SIG_COUNT',sigs.length,sigs[0]?.slot,sigs.at(-1)?.slot);
          const key=x=>typeof x==='string'?x:x?.pubkey??String(x);function keys(t){const a=(t.transaction.message.accountKeys??[]).map(key),l=t.meta?.loadedAddresses??{};return [...a,...(l.writable??[]).map(key),...(l.readonly??[]).map(key)]}function dec(ix,k){try{return {pid:k[ix.programIdIndex],data:Buffer.from(bs58.decode(ix.data??'')),accounts:(ix.accounts??[]).map(i=>k[i])}}catch{return null}}
          const rows=[];
          for(let i=0;i<sigs.length;i++){
            let t;try{t=await call('getTransaction',[sigs[i].signature,{encoding:'json',maxSupportedTransactionVersion:0,commitment:'confirmed'}])}catch(e){console.log('TXFAIL',i,String(e).slice(0,120));continue}if(!t)continue;const k=keys(t),msg=t.transaction.message,h=msg.header;const txSigners=(msg.accountKeys??[]).slice(0,h.numRequiredSignatures).map(key);
            for(let oi=0;oi<(msg.instructions??[]).length;oi++){const d=dec(msg.instructions[oi],k);if(!d||d.pid!==MAY||d.data.length<8)continue;const disc=d.data.subarray(0,8).toString('hex'),name=NAMES[disc]??'other';if(name==='other')continue;const quote=name.includes('V2')&&d.accounts.length>4?d.accounts[4]:null;rows.push({signature:sigs[i].signature,slot:sigs[i].slot,blockTime:sigs[i].blockTime,name,disc,outerIndex:oi,signers:txSigners,account0:d.accounts[0]??null,accountCount:d.accounts.length,baseMint:name.includes('V2')?d.accounts[3]??null:null,quoteMint:quote,dataHex:d.data.toString('hex')});}
            if(i%20===19){console.log('PROGRESS',i+1,'rows',rows.length);await sl(150)}else await sl(45)
          }
          const bySigner={},byName={},byPair={};for(const r of rows){for(const s of r.signers)bySigner[s]=(bySigner[s]??0)+1;byName[r.name]=(byName[r.name]??0)+1;const p=r.name+'|'+(r.quoteMint??'n/a');byPair[p]=(byPair[p]??0)+1}
          console.log('SUMMARY',JSON.stringify({rows:rows.length,byName,bySigner:Object.fromEntries(Object.entries(bySigner).sort((a,b)=>b[1]-a[1])),byPair:Object.fromEntries(Object.entries(byPair).sort((a,b)=>b[1]-a[1]))},null,2));
          console.log('SAMPLES',JSON.stringify(rows.slice(0,80),null,2));
          NODE
          node x.mjs
