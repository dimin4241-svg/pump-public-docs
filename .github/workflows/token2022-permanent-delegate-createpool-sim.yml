name: token2022-permanent-delegate-createpool-sim
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/token2022-permanent-delegate-createpool-sim.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @pump-fun/pump-swap-sdk@1.19.0 @solana/web3.js @solana/spl-token bn.js
      - name: PermanentDelegate create_pool — simulation only
        shell: bash
        run: |
          cat > pd.mjs <<'NODE'
          import BN from 'bn.js';
          import {PublicKey,SystemProgram,Transaction} from '@solana/web3.js';
          import {
            TOKEN_2022_PROGRAM_ID,TOKEN_PROGRAM_ID,NATIVE_MINT,ASSOCIATED_TOKEN_PROGRAM_ID,
            ExtensionType,getMintLen,getAssociatedTokenAddressSync,
            createAssociatedTokenAccountIdempotentInstruction,createInitializeMintInstruction,
            createInitializePermanentDelegateInstruction,createMintToInstruction,createSyncNativeInstruction,
            unpackMint,getPermanentDelegate,
          } from '@solana/spl-token';
          import {OFFLINE_PUMP_AMM_PROGRAM,GLOBAL_CONFIG_PDA,poolPda} from '@pump-fun/pump-swap-sdk';
          const RPCS=['https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com','https://solana.public-rpc.com','https://rpc.solanatracker.io/public'];let id=1;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function one(u,m,p,n=5){let e;for(let a=0;a<n;a++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-simulation-only/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method:m,params:p})});if(r.status===429||r.status>=500){e=new Error('HTTP '+r.status);await sleep(600+500*a);continue}const x=await r.json();if(x.error){e=new Error(JSON.stringify(x.error));break}return x.result}catch(x){e=x;await sleep(600+500*a)}}throw e}
          async function rpc(m,p){let e;for(const u of RPCS){try{return await one(u,m,p)}catch(x){e=x;console.log('RPC_FAIL',u,m,String(x).slice(0,180))}}throw e}
          async function ai(pk){return (await rpc('getAccountInfo',[pk.toBase58(),{encoding:'base64',commitment:'processed'}])).value}
          const amount=r=>r&&Buffer.from(r.data[0],'base64').length>=72?Buffer.from(r.data[0],'base64').readBigUInt64LE(64):null;
          const creator=new PublicKey('HTVZVEQMBsNanubDPTs3CxDAEGNFQHJY8c1441iy2S5r');const cr=await ai(creator);if(!cr)throw new Error('creator missing');
          const seed='pd1';const base=await PublicKey.createWithSeed(creator,seed,TOKEN_2022_PROGRAM_ID);if(await ai(base))throw new Error('seeded mint exists');
          const index=0,baseIn=100_000_000n,quoteIn=1_000_000n,supply=1_000_000_000n;
          const mintLen=getMintLen([ExtensionType.PermanentDelegate]),rent=await rpc('getMinimumBalanceForRentExemption',[mintLen,{commitment:'processed'}]);
          const pool=poolPda(index,creator,base,NATIVE_MINT);
          const userBase=getAssociatedTokenAddressSync(base,creator,true,TOKEN_2022_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID);
          const userQuote=getAssociatedTokenAddressSync(NATIVE_MINT,creator,true,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID);
          const poolBase=getAssociatedTokenAddressSync(base,pool,true,TOKEN_2022_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID);
          const poolQuote=getAssociatedTokenAddressSync(NATIVE_MINT,pool,true,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID);
          const uq=await ai(userQuote),have=amount(uq)??0n;
          const ixs=[
            SystemProgram.createAccountWithSeed({fromPubkey:creator,newAccountPubkey:base,basePubkey:creator,seed,lamports:rent,space:mintLen,programId:TOKEN_2022_PROGRAM_ID}),
            createInitializePermanentDelegateInstruction(base,creator,TOKEN_2022_PROGRAM_ID),
            createInitializeMintInstruction(base,6,creator,null,TOKEN_2022_PROGRAM_ID),
            createAssociatedTokenAccountIdempotentInstruction(creator,userBase,creator,base,TOKEN_2022_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID),
            createMintToInstruction(base,userBase,creator,supply,[],TOKEN_2022_PROGRAM_ID),
            createAssociatedTokenAccountIdempotentInstruction(creator,userQuote,creator,NATIVE_MINT,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID),
          ];
          if(have<quoteIn){ixs.push(SystemProgram.transfer({fromPubkey:creator,toPubkey:userQuote,lamports:Number(quoteIn-have)}));ixs.push(createSyncNativeInstruction(userQuote,TOKEN_PROGRAM_ID));}
          ixs.push(createAssociatedTokenAccountIdempotentInstruction(creator,poolBase,pool,base,TOKEN_2022_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID));
          ixs.push(createAssociatedTokenAccountIdempotentInstruction(creator,poolQuote,pool,NATIVE_MINT,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID));
          const cp=await OFFLINE_PUMP_AMM_PROGRAM.methods.createPool(index,new BN(baseIn.toString()),new BN(quoteIn.toString()),SystemProgram.programId,false,{0:false}).accountsPartial({globalConfig:GLOBAL_CONFIG_PDA,baseMint:base,quoteMint:NATIVE_MINT,creator,userBaseTokenAccount:userBase,userQuoteTokenAccount:userQuote,baseTokenProgram:TOKEN_2022_PROGRAM_ID,quoteTokenProgram:TOKEN_PROGRAM_ID}).instruction();ixs.push(cp);
          const bh=await rpc('getLatestBlockhash',[{commitment:'processed'}]);const tx=new Transaction({feePayer:creator,recentBlockhash:bh.value.blockhash});tx.add(...ixs);const raw=tx.serialize({requireAllSignatures:false,verifySignatures:false});
          console.log('CASE',JSON.stringify({simulationOnly:true,broadcast:false,base:base.toBase58(),pool:pool.toBase58(),poolBase:poolBase.toBase58(),mintLen,rawBytes:raw.length,baseIn:String(baseIn),quoteIn:String(quoteIn)},null,2));
          const addrs=[base,pool,poolBase,poolQuote,userBase,userQuote].map(x=>x.toBase58());const sim=await rpc('simulateTransaction',[raw.toString('base64'),{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'processed',accounts:{encoding:'base64',addresses:addrs}}]);const v=sim.value??{},ps=v.accounts??[],text=(v.logs??[]).join('\n');
          let pd=null;if(ps[0]){try{const row=ps[0];const info={data:Buffer.from(row.data[0],'base64'),executable:row.executable,lamports:row.lamports,owner:new PublicKey(row.owner),rentEpoch:row.rentEpoch??0};const m=unpackMint(base,info,TOKEN_2022_PROGRAM_ID);const x=getPermanentDelegate(m);pd=x?JSON.parse(JSON.stringify(x,(_k,z)=>z?.toBase58?.()??z)):null}catch(e){pd={error:String(e)}}}
          console.log('RESULT',JSON.stringify({err:v.err,units:v.unitsConsumed,createPoolReached:text.includes('Instruction: CreatePool'),unsupportedBase:text.includes('UnsupportedBaseMint'),poolExists:!!ps[1],poolBaseAmount:String(amount(ps[2])),poolQuoteAmount:String(amount(ps[3])),userBaseAmount:String(amount(ps[4])),userQuoteAmount:String(amount(ps[5])),permanentDelegate:pd},null,2));
          console.log('LOGS_BEGIN');for(const l of v.logs??[])console.log(l);console.log('LOGS_END');
          NODE
          node pd.mjs
