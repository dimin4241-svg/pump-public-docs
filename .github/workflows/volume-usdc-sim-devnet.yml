name: Pump USDC volume Devnet simulation

on:
  push:
    branches: [research/boost-auth-devnet]
    paths:
      - "research/volume-usdc-sim/**"
      - "idl/pump.json"
      - ".github/workflows/volume-usdc-sim-devnet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usdc-volume-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install isolated dependencies
        working-directory: research/volume-usdc-sim
        run: npm install --no-audit --no-fund
      - name: Simulate tiny USDC buy and inspect volume delta
        working-directory: research/volume-usdc-sim
        env:
          DEVNET_RPC: https://api.devnet.solana.com
        run: node probe.mjs
