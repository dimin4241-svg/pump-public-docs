name: inspect-cashback-close-idl
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/inspect-cashback-close-idl.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @pump-fun/pump-swap-sdk@1.19.0
      - shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const idl=JSON.parse(fs.readFileSync('node_modules/@pump-fun/pump-swap-sdk/src/idl/pump_amm.json','utf8'));
          for(const n of ['close_user_volume_accumulator','init_user_volume_accumulator','claim_cashback','sync_user_volume_accumulator']){const x=idl.instructions.find(i=>i.name.toLowerCase()===n);console.log('INSTR',n,JSON.stringify(x,null,2))}
          NODE
          grep -Rni -E 'closeUserVolumeAccumulator|close_user_volume_accumulator' node_modules/@pump-fun/pump-swap-sdk/src | head -n 100 || true