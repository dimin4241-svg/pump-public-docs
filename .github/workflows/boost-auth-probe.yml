name: PumpSwap migrate_v2 BOOST account map

on:
  push:
    branches:
      - security/boost-auth-probe-20260813
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boost-auth-probe
  cancel-in-progress: true

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web3 dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @solana/web3.js@1.98.4
      - name: Inspect known production migration read-only
        env:
          SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
          MIGRATE_SIG: dX8PkFMB874eCG9qV8gZJmEtZYmNDW8zggUju7UXBKG8u9yoBDMNZBH7Rfbqh2ZDGsCTUvETjvwZizJLpRZF97c
        run: node security/inspect-migrate-boost-accounts.cjs
