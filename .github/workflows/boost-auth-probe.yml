name: Inspect local validator harness patches

on:
  push:
    branches:
      - security/boost-auth-probe-20260813
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boost-auth-probe
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Print existing local-validator harness patches
        run: |
          git clone -q https://gist.github.com/dimin4241-svg/fa148417da8131fd3f4ac3a76bfbba7d.git /tmp/vqr-gist
          echo '=== local_mainnet_harness.patch ==='
          cat /tmp/vqr-gist/local_mainnet_harness.patch
          echo '=== local_validator_dependency_pins.patch ==='
          cat /tmp/vqr-gist/local_validator_dependency_pins.patch
          echo '=== natural_mainnet_harness_cargo.patch ==='
          cat /tmp/vqr-gist/natural_mainnet_harness_cargo.patch
