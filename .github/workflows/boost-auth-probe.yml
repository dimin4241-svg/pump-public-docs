name: Pump migrate_v2 BOOST shape sample

on:
  push:
    branches:
      - security/boost-auth-probe-20260813
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boost-auth-probe
  cancel-in-progress: true

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web3 dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @solana/web3.js@1.98.4
      - name: Sample recent migrate_v2 calls read-only
        env:
          SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
          WITHDRAW_AUTHORITY: 39azUYFWPz3VHgKCf3VChUwbpURdCHRxjWVowf5jUJjg
          SIG_LIMIT: "100"
          MIGRATE_LIMIT: "30"
        run: node security/sample-migrate-v2-boost-shapes.cjs
