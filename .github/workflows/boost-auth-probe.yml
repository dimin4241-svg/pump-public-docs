name: PumpSwap BOOST harness inspect

on:
  push:
    branches:
      - security/boost-auth-probe-20260813
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boost-auth-probe
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Clone existing public reproduction Gist
        run: |
          git clone -q https://gist.github.com/dimin4241-svg/fa148417da8131fd3f4ac3a76bfbba7d.git /tmp/vqr-gist
          echo '=== FILES ==='
          find /tmp/vqr-gist -maxdepth 1 -type f -printf '%f\n' | sort
          echo '=== HARNESS SYMBOLS ==='
          grep -RniE 'ProgramTest|TestValidator|start_validator|pump_amm|program dump|fixture|snapshot|set_account|add_account|clone' /tmp/vqr-gist --include='*.rs' --include='*.patch' --include='*.md' | head -n 240 || true
          echo '=== vqr_mainnet_exact.rs HEAD ==='
          sed -n '1,260p' /tmp/vqr-gist/vqr_mainnet_exact.rs || true
          echo '=== build_pinned_snapshot_fixture.rs ==='
          sed -n '1,320p' /tmp/vqr-gist/build_pinned_snapshot_fixture.rs || true
          echo '=== local_mainnet_harness.patch ==='
          sed -n '1,360p' /tmp/vqr-gist/local_mainnet_harness.patch || true
