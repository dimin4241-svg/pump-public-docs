name: PumpSwap BOOST atomicity history probe

on:
  push:
    branches:
      - security/boost-auth-probe-20260813
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boost-auth-probe
  cancel-in-progress: true

jobs:
  atomicity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web3 dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @solana/web3.js@1.98.4
      - name: Inspect boost-vault and pool history read-only
        env:
          SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
          BOOST_POOL: J5qbay91WVMCpnBmDHMqQ789LVR3ENTuEkttp4669tZJ
          BOOST_VAULT: 4bFNJ6sVpqYaF8jM8n62dNdNzH6G2bRTVcf6xag6UAiJ
        run: node security/boost-atomicity-history.cjs
