name: Pump migrate_v2 no-init retry classification

on:
  push:
    branches:
      - security/boost-auth-probe-20260813
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boost-auth-probe
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web3 dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @solana/web3.js@1.98.4
      - name: Check BOOST-vault history for successful no-init calls
        env:
          SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
        run: node security/check-noinit-migrate-retries.cjs
