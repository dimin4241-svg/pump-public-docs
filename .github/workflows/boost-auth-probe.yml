name: Inspect local BOOST harness commands

on:
  push:
    branches:
      - security/boost-auth-probe-20260813
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boost-auth-probe
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Clone existing reproduction gist and print exact setup
        run: |
          git clone -q https://gist.github.com/dimin4241-svg/fa148417da8131fd3f4ac3a76bfbba7d.git /tmp/vqr-gist
          echo '=== REPRODUCTION SETUP ==='
          sed -n '1,120p' /tmp/vqr-gist/REPRODUCTION.md
          echo '=== README SETUP ==='
          sed -n '1,150p' /tmp/vqr-gist/README.md
          echo '=== REPO / COMMIT / TOOLCHAIN REFERENCES ==='
          grep -RniE 'git clone|git checkout|pump-rust-client|rustup|solana-install|agave|cargo test|local-validator|validator' /tmp/vqr-gist --include='*.md' --include='*.patch' | head -n 260 || true
