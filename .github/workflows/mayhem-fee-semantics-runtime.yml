name: mayhem-fee-semantics-runtime
on:
  push:
    branches: [audit/boost-runtime-probe-20260815]
    paths: ['.github/workflows/mayhem-fee-semantics-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: audit/boost-runtime-probe-20260815}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save @pump-fun/pump-swap-sdk@1.19.0 @solana/web3.js @solana/spl-token bn.js tsx
      - name: Compare SDK and runtime fees
        shell: bash
        run: |
          echo '=== SDK FEE CALLSITE ==='
          grep -Rni -B20 -A45 'computeFeesBps' node_modules/@pump-fun/pump-swap-sdk/src/sdk/offlinePumpAmm.ts | head -n 260 || true
          echo '=== SDK FEE IMPLEMENTATION ==='
          sed -n '1,145p' node_modules/@pump-fun/pump-swap-sdk/src/sdk/fees.ts
          cat > mayhem_fee_semantics.mts <<'NODE'
          import BN from 'bn.js';
          import {Connection,PublicKey,Transaction,ComputeBudgetProgram,SystemProgram} from '@solana/web3.js';
          import {getAssociatedTokenAddressSync,createAssociatedTokenAccountIdempotentInstruction,createSyncNativeInstruction,TOKEN_PROGRAM_ID} from '@solana/spl-token';
          import {OnlinePumpAmmSdk,PUMP_AMM_SDK,pumpAmmJson} from '@pump-fun/pump-swap-sdk';
          import {computeFeesBps} from './node_modules/@pump-fun/pump-swap-sdk/src/sdk/fees.ts';

          const AMM=new PublicKey('pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA');
          const FEE_PROGRAM='pfeeUxB6jkeY1Hxd7CsFCAjcbHA9rWtchMGdZ6VojVZ';
          const POOL=new PublicKey('3EUUwdSpEXap46NB6n5Mmt3U8XM8vW8HPCLtJDoGzw33');
          const USER=new PublicKey('39azUYFWPz3VHgKCf3VChUwbpURdCHRxjWVowf5jUJjg');
          const QUOTE_IN=new BN('1000000');
          const RPCS=['https://rpc.solanatracker.io/public','https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com'];
          let rid=1;const sleep=(ms:number)=>new Promise(r=>setTimeout(r,ms));
          async function raw(u:string,m:string,p:any[],n=4){let e:any;for(let a=0;a<n;a++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json','user-agent':'pump-authorized-bounty-simulation-only/1.0'},body:JSON.stringify({jsonrpc:'2.0',id:rid++,method:m,params:p})});if(r.status===429||r.status>=500){e=Error('HTTP '+r.status);await sleep(300+450*a);continue}const x:any=await r.json();if(x.error){e=Error(JSON.stringify(x.error));if(/429|No response|Too many/i.test(String(e))){await sleep(300+450*a);continue}throw e}return x.result}catch(x){e=x;await sleep(180)}}throw e}
          async function call(m:string,p:any[]){let e:any;for(const u of RPCS){try{const x=await raw(u,m,p);console.log('RPC_OK',m,u);return x}catch(x){e=x;console.log('RPC_FAIL',m,u,String(x).slice(0,180))}}throw e}
          function primitive(x:any):any{
            if(x===null||x===undefined)return x;
            if(typeof x==='bigint')return x.toString();
            if(typeof x==='string'||typeof x==='number'||typeof x==='boolean')return x;
            if(Buffer.isBuffer(x))return x.toString('hex');
            if(typeof x?.toBase58==='function')return x.toBase58();
            if(typeof x?.toString==='function' && x?.constructor?.name==='BN')return x.toString();
            if(Array.isArray(x))return x.map(primitive);
            if(typeof x==='object'){const o:any={};for(const [k,v] of Object.entries(x))o[k]=primitive(v);return o;}
            return String(x);
          }
          function bn(x:any){if(BN.isBN(x))return x;return new BN(String(x??0));}
          function feeTuple(x:any){return [x.lpFeeBps,x.protocolFeeBps,x.creatorFeeBps].map((v:any)=>bn(v).toString());}
          function decodeFeeReturn(logs:string[]){
            const lines=logs.filter(l=>l.startsWith('Program return: '+FEE_PROGRAM+' '));
            if(!lines.length)return {line:null,tuple:null};
            const line=lines[lines.length-1];const b64=line.split(' ').at(-1)!;const b=Buffer.from(b64,'base64');
            if(b.length<24)return {line,bytes:b.length,tuple:null};
            return {line,bytes:b.length,tuple:[0,8,16].map(o=>b.readBigUInt64LE(o).toString())};
          }

          let conn:Connection|null=null;for(const u of RPCS){try{const c=new Connection(u,'confirmed');await c.getLatestBlockhash('confirmed');conn=c;console.log('SDK_RPC',u);break}catch(e){console.log('SDK_RPC_FAIL',u,String(e).slice(0,160))}}if(!conn)throw Error('no SDK rpc');
          const sdk=new OnlinePumpAmmSdk(conn);const state:any=await sdk.swapSolanaState(POOL,USER);
          console.log('STATE_KEYS',Object.keys(state));
          console.log('POOL',JSON.stringify(primitive({pool:POOL,isMayhemMode:state.pool.isMayhemMode,isCashbackCoin:state.pool.isCashbackCoin,creator:state.pool.creator,coinCreator:state.pool.coinCreator,baseMint:state.pool.baseMint,quoteMint:state.pool.quoteMint,virtualQuoteReserves:state.pool.virtualQuoteReserves,poolBaseAmount:state.poolBaseAmount,poolQuoteAmount:state.poolQuoteAmount}),null,2));
          console.log('GLOBAL_LEGACY_FEES',JSON.stringify(primitive({lpFeeBasisPoints:state.globalConfig.lpFeeBasisPoints,protocolFeeBasisPoints:state.globalConfig.protocolFeeBasisPoints,coinCreatorFeeBasisPoints:state.globalConfig.coinCreatorFeeBasisPoints}),null,2));
          console.log('FEE_CONFIG',JSON.stringify(primitive(state.feeConfig),null,2));
          console.log('BASE_MINT_ACCOUNT',JSON.stringify(primitive(state.baseMintAccount),null,2));
          if(!state.pool.isMayhemMode)throw Error('target no longer Mayhem');
          if(!state.feeConfig)throw Error('feeConfig unexpectedly null; runtime-vs-legacy comparison needed instead');

          const supply=bn(state.baseMintAccount?.supply??state.baseMintSupply??0);
          const creator=state.pool.creator;
          const sdkFees:any=computeFeesBps({globalConfig:state.globalConfig,feeConfig:state.feeConfig,creator,baseMintSupply:supply,baseMint:state.pool.baseMint,baseReserve:bn(state.poolBaseAmount),quoteReserve:bn(state.poolQuoteAmount),tradeSize:QUOTE_IN});
          const sdkTuple=feeTuple(sdkFees);
          console.log('SDK_COMPUTE_FEES',JSON.stringify({tuple:sdkTuple,raw:primitive(sdkFees),inputs:primitive({creator,baseMintSupply:supply,baseMint:state.pool.baseMint,baseReserve:state.poolBaseAmount,quoteReserve:state.poolQuoteAmount,tradeSize:QUOTE_IN})},null,2));

          const userBase=getAssociatedTokenAddressSync(state.pool.baseMint,USER,false,state.baseTokenProgram);
          const userQuote=getAssociatedTokenAddressSync(state.pool.quoteMint,USER,false,state.quoteTokenProgram);
          const built:any[]=await PUMP_AMM_SDK.buyQuoteInput(state,QUOTE_IN,5);
          const def:any=pumpAmmJson.instructions.find((i:any)=>i.name==='buy');const disc=Buffer.from(def.discriminator);
          const bi=built.findIndex(ix=>ix.programId.equals(AMM)&&ix.data.length>=8&&Buffer.from(ix.data.subarray(0,8)).equals(disc));if(bi<0)throw Error('buy ix missing');
          const buy=built[bi];const names=def.accounts.map((a:any)=>a.name);console.log('BUY_KEYS',JSON.stringify(buy.keys.map((k:any,i:number)=>({i,name:names[i]??'remaining',p:k.pubkey.toBase58(),w:k.isWritable,s:k.isSigner})),null,2));
          const bh=(await call('getLatestBlockhash',[{commitment:'confirmed'}])).value.blockhash;
          const setup=[createAssociatedTokenAccountIdempotentInstruction(USER,userBase,USER,state.pool.baseMint,state.baseTokenProgram),createAssociatedTokenAccountIdempotentInstruction(USER,userQuote,USER,state.pool.quoteMint,state.quoteTokenProgram),SystemProgram.transfer({fromPubkey:USER,toPubkey:userQuote,lamports:20_000_000}),createSyncNativeInstruction(userQuote,TOKEN_PROGRAM_ID)];
          const tx=new Transaction({feePayer:USER,recentBlockhash:bh}).add(ComputeBudgetProgram.setComputeUnitLimit({units:1_400_000}),...setup,...built);
          const bytes=tx.serialize({requireAllSignatures:false,verifySignatures:false});let sim:any=null,simRpc:string|null=null;
          for(const u of RPCS){try{sim=(await raw(u,'simulateTransaction',[bytes.toString('base64'),{encoding:'base64',sigVerify:false,replaceRecentBlockhash:true,commitment:'confirmed'}],3)).value;simRpc=u;break}catch(e){console.log('SIM_FAIL',u,String(e).slice(0,190))}}
          if(!sim)throw Error('all simulation RPCs failed');const logs:string[]=sim.logs??[];const runtime=decodeFeeReturn(logs);
          console.log('RUNTIME',JSON.stringify({simulationOnly:true,broadcast:false,rpc:simRpc,err:sim.err,units:sim.unitsConsumed,feeReturn:runtime,feeProgramLogs:logs.filter(l=>l.includes(FEE_PROGRAM)||l.includes('Instruction: GetFees')),anchor:logs.filter(l=>l.includes('AnchorError')||l.includes('Error Code:')),failed:logs.filter(l=>l.includes('failed:'))},null,2));
          const runtimeTuple:any=runtime.tuple;const matches=Array.isArray(runtimeTuple)&&runtimeTuple.length===3&&sdkTuple.every((x:string,i:number)=>x===runtimeTuple[i]);
          const legacyTuple=[state.globalConfig.lpFeeBasisPoints,state.globalConfig.protocolFeeBasisPoints,state.globalConfig.coinCreatorFeeBasisPoints].map((v:any)=>bn(v).toString());
          console.log('DECISIVE',JSON.stringify({pool:POOL.toBase58(),isMayhemMode:state.pool.isMayhemMode,simulationOnly:true,broadcast:false,sdkTuple,runtimeTuple,legacyGlobalTuple:legacyTuple,sdkMatchesRuntime:matches,legacyMatchesRuntime:Array.isArray(runtimeTuple)&&legacyTuple.every((x:string,i:number)=>x===runtimeTuple[i]),verdict:matches?'MATCH':'DIVERGENCE'},null,2));
          if(sim.err)process.exitCode=2;
          NODE
          npx tsx mayhem_fee_semantics.mts